# yaml-language-server: $schema=https://genroc.org/process-schema.json
#
# The script task as a CHILD PROCESS: one place that knows the evaluator's contract, so a
# caller writes `type: child` plus a result_schema instead of an external task plus its own
# error handling. This is custom-tasks.md's middle tier — the parent↔child relationship IS the
# extension point — and the engine still has no idea scripts exist.
#
# The output is the TOP TYPE. A forwarding process must not declare a shape that is the
# caller's concern; the caller narrows it with result_schema, which collect conforms against
# the real output. See specs/unknown-type.md.
name: script
config_schema:
  type: object
  properties: {}
input_schema:
  type: object
  properties:
    code: { type: string }
    input:
      description: "opaque here — whatever the script reads, typed by whoever wrote it"
    timeout_ms: { type: integer, default: 5000 }
  required: [code]
tasks:
  - id: eval
    action:
      # An `external` task: the engine parks and holds no worker, and an evaluator claims it
      # off the queue. Nothing here names a URL — the worker calls genroc, not the other way
      # round, which is what lets it live anywhere with outbound access.
      type: external
      input:
        code: "$: input.code"
        input: "$: input.input"
        timeout_ms: "$: input.timeout_ms"
      result_schema: {}
      # The closed set of codes an evaluator may answer with: the failure kinds in
      # evaluator/eval.ts, one arm each below. A code outside this is refused at submission,
      # so a worker that invents one is caught rather than routed to a catch-all.
      raises:
        threw: { $ref: "#/$defs/script_error" }
        timeout: { $ref: "#/$defs/script_error" }
        compile_error: { $ref: "#/$defs/script_error" }
        nonserializable: { $ref: "#/$defs/script_error" }
        exited: { $ref: "#/$defs/script_error" }
    # Above the evaluator's own budget, so a script that overruns comes back as a classified
    # `timeout` rather than external.timeout — which is unknowable, and so never retryable.
    timeout: 30s
    output: "$: self.result"
    on_error:
      # Every arm below is a code the WORKER sent, so the script demonstrably ran. There is no
      # retry arm and no "evaluator unavailable" arm any more: a runner that faults releases its
      # claim instead of answering, and the task simply waits on the queue for another worker.
      # That is the queue's own retry, and it costs the definition nothing.
      - code: [threw]
        raise:
          code: script_threw
          message: "script threw (${error.data.name}): ${error.message}"
          # The refusal, recomposed rather than forwarded whole: the evaluator puts the text
          # on error.MESSAGE and only `name`/`stack` in data, so a caller declaring
          # {name, message} would fail the conform against a verbatim `$: error.data`.
          # `name` is what a caller tells one throw from another by, and it cannot be a code
          # here (R2) because this process is generic. A caller reads either only by
          # declaring a shape under `raises`.
          data:
            name: "$: error.data.name"
            stack: "$: error.data.stack"
      - code: [timeout]
        goto: $timed_out
      # A script that would not compile, returned what JSON cannot represent, or ended its own
      # realm. One arm because they are fixed the same way — by editing the script — and none
      # is a condition a caller could react to.
      - code: [compile_error, nonserializable, exited]
        panic:
          code: script_broken
          message: "the script is broken (${error.code}): ${error.message}"
          # Nobody can catch a panic, so this reaches an operator and no one else — which is
          # the only place a stack trace was ever going to be read.
          data:
            name: "$: error.data.name"
            stack: "$: error.data.stack"
      # The deadline passed with nothing submitted: no evaluator is running, or one died
      # holding the task. Which of those it was is not knowable from here, so this says so
      # rather than picking the reassuring reading.
      - code: [external.timeout]
        raise:
          code: script_unknown
          message: "no evaluator answered within the budget"
    switch:
      - goto: end

  # The budget is the caller's, so name it — "too slow" without the number sends whoever
  # reads this to the wrong file.
  - id: timed_out
    switch:
      - raise:
          code: script_timeout
          message: "the script ran past its ${input.timeout_ms}ms budget"
          data:
            budget_ms: "$: input.timeout_ms"

output: "$: outputs.eval"

$defs:
  # What a failure carries beside its code. `kind` is gone: it IS the code now, which is the
  # whole gain of answering on the error channel rather than through a status.
  script_error:
    type: object
    properties:
      name: { type: string }
      stack: { type: string }
    required: [name]
