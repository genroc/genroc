# genroc's half of the proxy arrangement. specs/auth-two-credentials.md.
#
# genroc verifies the ID token Dex signed. It reads no identity headers and mints nothing for
# the proxy — the proxy's whole job is turning a session cookie into a JWT.
mode: jwt

jwt:
  # Two URLs for one issuer, and they are not interchangeable. genroc FETCHES keys over the
  # compose network (`dex`), but PINS the issuer to the value Dex actually stamps into `iss`,
  # which is the browser-facing URL. Setting either to the other's host fails: a wrong jwks_url
  # cannot resolve, and a wrong issuer rejects every token.
  jwks_url: http://dex:5556/dex/keys
  issuer: http://localhost:5556/dex
  # The OIDC client id. Pinning it is what stops a token Dex minted for a DIFFERENT application
  # from verifying here on the same signature. specs/api-auth.md §2.4.
  audience: genroc
  algorithms: [RS256]
  subject_claim: email
  roles_claim: groups

# A SUBJECT ALLOWLIST, because this demo's Dex uses `staticPasswords`, which carries no group
# membership — the ID token has no `groups` claim, so `roles:` below can grant nobody anything
# beyond `*`. Swap in a `connectors:` entry (dex/config.yaml) and groups arrive in the token.
#
# The cost is that every person is a line here AND a genroc restart — this file is read once at
# startup. Prefer `roles:` wherever the provider carries groups.
users:
  alice@genroc.test: [admin]
  carol@genroc.test: [operate, read]
  # bob is deliberately absent: he falls through to the "*" rule below.

roles:
  # What a real connector carries. Dex's GitHub connector emits `org:team`, so the keys are
  # quoted and look like `my-org:platform` rather than a bare group name.
  genroc-admins: [admin]
  genroc-operators: [operate, read]
  # Anyone Dex authenticated may read. A deployment that wants less says so here.
  "*": [read]
