# yaml-language-server: $schema=https://genroc.org/process-schema.json
#
# Runs a TypeScript module through script-node as a CHILD, the documented way to run user code
# (specs/script-tasks.md).
name: hello-script
input_schema:
  type: object
  properties:
    name: { type: string, default: "world" }
tasks:
  - id: greet
    action:
      type: child
      name: script-node
      input:
        # A MODULE: the evaluator calls its default export with `input`; anything else comes
        # back as compile_error, which script-node panics as `script_broken`.
        # `$${input.name}` is ESCAPED: genroc would otherwise interpolate `${...}` itself.
        code: |
          export default function (input) {
            return {
              greeting: `hello, $${input.name}`,
              at: new Date().toISOString(),
            };
          }
        input:
          name: "$: input.name"
      # The child forwards the top type, so the CALLER says what it expects and the collect
      # conforms the real output against it. specs/unknown-type.md.
      result_schema:
        type: object
        properties:
          greeting: { type: string }
          at: { type: string }
        required: [greeting]
    output: "$: self.result"
    switch:
      - goto: end

output: "$: outputs.greet"
