# yaml-language-server: $schema=https://genroc.org/process-schema.json
#
# The script task as a child process (custom-tasks.md's middle tier): a caller writes
# `type: child` plus a result_schema, and the engine has no idea scripts exist. The output is
# the top type; the caller narrows it with result_schema (specs/unknown-type.md).
name: script-node
config_schema:
  type: object
  properties: {}
input_schema:
  type: object
  properties:
    code: { type: string }
    input:
      description: "opaque here — whatever the script reads, typed by whoever wrote it"
    timeout_ms: { type: integer, default: 5000 }
  required: [code]
tasks:
  - id: eval_node
    action:
      # `external`: an evaluator claims it off the queue. No URL: the worker calls genroc, so
      # it can live anywhere with outbound access.
      type: external
      input:
        code: "$: input.code"
        input: "$: input.input"
        timeout_ms: "$: input.timeout_ms"
      result_schema: {}
      # The codes an evaluator may answer with (eval-node/eval.ts), one arm each below; any
      # other code is refused at submission.
      raises:
        threw: { $ref: "#/$defs/script_error" }
        timeout: { $ref: "#/$defs/script_error" }
        compile_error: { $ref: "#/$defs/script_error" }
        nonserializable: { $ref: "#/$defs/script_error" }
        exited: { $ref: "#/$defs/script_error" }
      # Above the evaluator's own budget, so a script that overruns comes back as a classified
      # `timeout` rather than external.timeout — which is unknowable, and so never retryable.
      timeout: 30s
    output: "$: self.result"
    on_error:
      # Every arm below is a code the worker sent, so the script ran. No retry arm: a faulting
      # runner releases its claim and the task waits on the queue for another worker.
      - code: [threw]
        raise:
          code: script_threw
          message: "script threw (${error.data.name}): ${error.message}"
          # Recomposed, not forwarded: the evaluator puts the text on error.message and only
          # `name`/`stack` in data, so a verbatim `$: error.data` fails a {name, message} conform.
          data:
            name: "$: error.data.name"
            stack: "$: error.data.stack"
      - code: [timeout]
        goto: $timed_out
      # Compile failure, non-JSON result, or the script ended its realm: one arm, since each is
      # fixed by editing the script.
      - code: [compile_error, nonserializable, exited]
        panic:
          code: script_broken
          message: "the script is broken (${error.code}): ${error.message}"
          # Nobody can catch a panic, so this reaches an operator and no one else — which is
          # the only place a stack trace was ever going to be read.
          data:
            name: "$: error.data.name"
            stack: "$: error.data.stack"
      # Deadline passed with nothing submitted: no evaluator running, or one died holding the
      # task. Unknowable from here, so the message does not pick the reassuring reading.
      - code: [external.timeout]
        raise:
          code: script_unknown
          message: "no evaluator answered within the budget"
    switch:
      - goto: end

  # The budget is the caller's, so name it — "too slow" without the number sends whoever
  # reads this to the wrong file.
  - id: timed_out
    switch:
      - raise:
          code: script_timeout
          message: "the script ran past its ${input.timeout_ms}ms budget"
          data:
            budget_ms: "$: input.timeout_ms"

output: "$: outputs.eval_node"

$defs:
  # What a failure carries beside its code (the failure kind is the code itself).
  script_error:
    type: object
    properties:
      name: { type: string }
      stack: { type: string }
    required: [name]
