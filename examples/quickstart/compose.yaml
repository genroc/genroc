# genroc: engine, UI, a script worker, three example processes. NO AUTHENTICATION: fine for a
# laptop, wrong for anything others can reach (examples/auth and examples/ui add it).
#   docker compose -f examples/quickstart/compose.yaml up --build
#   open http://localhost:8448

name: genroc-quickstart

services:
  # SQLite, so there is no database to configure. `-pg <dsn>` is the same image against Postgres.
  genroc:
    build: { context: ../.., dockerfile: Dockerfile }
    command: [-db, /data/genroc.db, -http, ":8448"]
    volumes: [data:/data]

  # Its own image, so a deployment embedding the server carries no UI (specs/ui-component.md §1).
  # No config means no login: requests are proxied as they arrive.
  genroc-ui:
    build: { context: ../.., dockerfile: ui/Dockerfile }
    command: [-server, "http://genroc:8448"]
    ports: ["8448:8448"]
    depends_on:
      genroc: { condition: service_started }

  # With auth off the worker needs no credential — the first thing that changes when you turn
  # auth on.
  evaluator:
    build: { context: ../.., dockerfile: eval-node/Dockerfile }
    environment:
      GENROC_SERVER: http://genroc:8448
      CONCURRENCY: "2"
      # Without a filter a worker claims EVERY external task, including another runtime's.
      TASK: eval_node
    restart: unless-stopped
    depends_on:
      genroc: { condition: service_started }

  # Registers the examples so the UI is not empty. on-failure covers genroc not being up yet.
  seed:
    # The server image carries genctl too, so there is no second image to build.
    build: { context: ../.., dockerfile: Dockerfile }
    entrypoint: [/usr/local/bin/genctl]
    environment:
      GENROC_SERVER: http://genroc:8448
    command:
      - apply
      - -f
      - /examples/quickstart/script-node.genroc.yaml
      - -f
      - /examples/quickstart/hello-script.genroc.yaml
      - -f
      - /examples/expense-approval/approval.genroc.yaml
    # The whole tree, so definitions stay beside their own READMEs.
    volumes: [../:/examples:ro]
    restart: on-failure
    depends_on:
      genroc: { condition: service_started }

volumes:
  data:
