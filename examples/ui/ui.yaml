# genroc-ui (specs/ui-issued-tokens.md §5). Everything omitted defaults: listen :8448, issuer and
# audience matching the server, 60s tokens, derived callback URL, Secure cookies on HTTPS.

server: http://genroc:8448

login:
  # Passwords in a file: right for a demo; a deployment uses `providers:`.
  # Hash with: htpasswd -bnBC 10 "" <password> | tr -d ':\n'
  passwords:
    - email: alice@genroc.test        # password: demo
      hash: "$2a$10$QRz1D8GwpXluI19IzzkBmOHMMJDsfAKs3P9zCMOi6ElVbXybUD5Y2"
      groups: [genroc-admins]
    - email: carol@genroc.test        # password: s3cret
      hash: "$2a$10$IFo0TlOV4hw/SMshxaV/5eWGLyZonbvy4qcKojEqgdIBru0hGfa3y"
      groups: [genroc-operators]
    - email: bob@genroc.test          # password: demo
      hash: "$2a$10$QRz1D8GwpXluI19IzzkBmOHMMJDsfAKs3P9zCMOi6ElVbXybUD5Y2"
      groups: []                      # no group: falls through to the "*" rule

  # A deployment uses `providers:` instead: any OIDC provider, by its issuer. Non-OIDC ones
  # (GitHub, LDAP) need a broker such as Dex. One provider and no passwords skips the chooser
  # (specs/ui-component.md §5.1).
  #
  # providers:
  #   - id: google
  #     name: Google
  #     issuer: https://accounts.google.com
  #     client_id: ...
  #     client_secret: ...
  #     scopes: [openid, email, profile]   # Google refuses the default `groups` scope
  #
  # Google tokens carry no groups: grant by email under `users:`, or use a broker that supplies
  # them (Dex's Google connector reads Workspace groups).

token:
  # The one thing both components must agree on. Everything else about the token defaults.
  secret_file: /data/jwt-secret

# THE ROLE MAP lives here, not in the server: the token carries permissions, not groups.
roles:
  genroc-admins:    [admin]
  genroc-operators: [operate, read]
  "*":              [read]        # anyone who signed in at all
