# The genroc UI with a login (specs/ui-issued-tokens.md). A person gets a short-lived JWT with
# permissions from genroc-ui; the evaluator holds a `genroc_sk_*`. The server has no role map,
# so the embeddable binary carries no login code. Delete ./data (made on first run) to reset.
#
#   docker compose -f examples/ui/compose.yaml up --build
#   open http://localhost:8448                    -> alice / demo

name: genroc-ui-demo

services:
  # Generates what cannot be committed, once, into ./data, which every service mounts. FILES,
  # not env vars: an env credential shows in `docker inspect` and leaks to child processes.
  init:
    image: alpine:3
    command:
      - sh
      - -c
      - |
        set -e
        rand() { head -c 32 /dev/urandom | base64 | tr -d '=+/' | cut -c1-43; }
        if [ ! -s /data/jwt-secret ]; then
          rand > /data/jwt-secret
          echo "generated /data/jwt-secret"
        fi
        if [ ! -s /data/worker-token ]; then
          # The format genroc validates: the prefix makes a leaked credential greppable, and the
          # body has to carry enough entropy to be worth having. Nothing about it needs genctl.
          printf 'genroc_sk_%s' "$(rand)" > /data/worker-token
          echo "generated /data/worker-token"
        fi
        # What --seed-tokens-file reads: label=perms=secret. Rewritten every start so it always
        # matches the token file, which is the only thing that has to be preserved.
        printf 'evaluator=worker=%s' "$(cat /data/worker-token)" > /data/seed-tokens
        # 65532 is distroless's `nonroot`, which genroc and genroc-ui both run as. Written by
        # root and left that way, a 0600 file is unreadable by the processes that need it --
        # which fails as "permission denied" at startup, not as anything about auth.
        chown 65532:65532 /data /data/jwt-secret /data/worker-token /data/seed-tokens
        chmod 600 /data/jwt-secret /data/worker-token /data/seed-tokens
    volumes: [./data:/data]

  genroc:
    build: { context: ../.., dockerfile: Dockerfile }
    # Environment rather than a command array: one key per line. Unnamed settings default.
    environment:
      GENROC_DB: /data/genroc.db
      # BOTH credential types: the secret accepts genroc-ui's JWTs for people, token mode the
      # evaluator's opaque credential; each declines what is not its own.
      GENROC_JWT_SECRET_FILE: /data/jwt-secret
      GENROC_AUTH: token
      # Generated in ./data, not by genroc, so no secret originates in the server or its logs.
      # Stored if absent, ignored if present.
      GENROC_SEED_TOKENS_FILE: /data/seed-tokens
    volumes:
      - ./data:/data
    # Unpublished: the only way in from the host is genroc-ui. A machine inside the network
    # still reaches it directly, which is how the evaluator works.
    depends_on:
      init: { condition: service_completed_successfully }
    restart: unless-stopped

  genroc-ui:
    build: { context: ../.., dockerfile: ui/Dockerfile }
    environment:
      GENROC_UI_CONFIG: /etc/genroc/ui.yaml
    ports: ["8448:8448"]
    volumes:
      - ./ui.yaml:/etc/genroc/ui.yaml:ro
      # Read-only: genroc-ui needs the key, it does not own it.
      - ./data:/data:ro
    depends_on:
      init: { condition: service_completed_successfully }
      genroc: { condition: service_started }
    restart: unless-stopped

  # The script-task worker: it claims `external` tasks off genroc's queue, so it needs only
  # outbound access.
  evaluator:
    build: { context: ../.., dockerfile: eval-node/Dockerfile }
    environment:
      GENROC_SERVER: http://genroc:8448
      GENROC_TOKEN_FILE: /data/worker-token
      CONCURRENCY: "2"
    volumes: [./data:/data:ro]
    restart: unless-stopped
    depends_on:
      init: { condition: service_completed_successfully }
      genroc: { condition: service_started }

