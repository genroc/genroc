# genroc with token auth (specs/api-auth.md): an operator token that can deploy, and a worker
# token that can only claim script tasks. SSO for humans (`header` mode) is not shown; see README.
#
#   ./examples/auth/gen-env.sh                      # once: mints the WORKER credential
#   docker compose -f examples/auth/compose.yaml up --build
#   genctl definitions                              # from the host, on :8448

name: genroc-auth-demo

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: genroc
      POSTGRES_PASSWORD: genroc
      POSTGRES_DB: genroc
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genroc -d genroc"]
      interval: 2s
      retries: 15
    # Named and load-bearing: the admin credential is deleted from .env after the first start,
    # so losing the volume orphans your token. `down -v` is the reset; `down` is a restart.
    volumes: [pgdata:/var/lib/postgresql/data]

  genroc:
    build: { context: ../.., dockerfile: Dockerfile }
    command:
      - -pg
      - postgres://genroc:genroc@postgres:5432/genroc?sslmode=disable
      - -http
      - :8448
      - -auth
      - token
    environment:
      # Stored if absent, ignored if present, so a restart is a no-op. ADMIN_TOKEN may be empty:
      # it is needed for the first start only, then deleted from .env.
      GENROC_SEED_TOKENS: "evaluator=worker=${WORKER_TOKEN:?run examples/auth/gen-env.sh first},admin=admin=${ADMIN_TOKEN:-}"
    ports: ["8448:8448"]
    depends_on:
      postgres: { condition: service_healthy }

  evaluator:
    build: { context: ../.., dockerfile: eval-node/Dockerfile }
    environment:
      GENROC_SERVER: http://genroc:8448
      GENROC_TOKEN: ${WORKER_TOKEN:?run examples/auth/gen-env.sh first}
      CONCURRENCY: "2"
    # The worker tolerates genroc being briefly unreachable, so it needs no healthcheck (the
    # distroless image has no shell to run one).
    restart: unless-stopped
    depends_on:
      genroc: { condition: service_started }

  # Not started; for one-shot DB commands. Mints the admin credential to YOUR terminal only,
  # never a file or container env (then, on the host: genctl config set token <value>):
  #   docker compose -f examples/auth/compose.yaml run --rm tools \
  #     token create -pg "$PG" --perms admin --label admin
  tools:
    # The same image as the server; it carries both binaries.
    build: { context: ../.., dockerfile: Dockerfile }
    profiles: [tools]
    entrypoint: ["/usr/local/bin/genroc"]
    environment:
      PG: postgres://genroc:genroc@postgres:5432/genroc?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
