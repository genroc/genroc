# genroc with authentication on. specs/api-auth.md.
#
# What this shows: `--auth token`, and credentials SCOPED to what each caller needs — an
# operator token that can deploy, and a worker token that can claim script tasks and nothing
# else. A leaked worker credential here cannot read a definition, list an instance, or mint
# another token, which is the whole point of the split.
#
# What this does NOT show: SSO for humans. `jwt` and `header` modes are not built yet, so there
# is no path for a browser behind an identity provider. Machines are served; people are not.
#
#   ./examples/auth/gen-env.sh                      # once: mints the WORKER credential
#   docker compose -f examples/auth/compose.yaml up --build
#   genctl definitions                              # from the host, on :8448

name: genroc-auth-demo

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: genroc
      POSTGRES_PASSWORD: genroc
      POSTGRES_DB: genroc
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genroc -d genroc"]
      interval: 2s
      retries: 15
    # Named, and load-bearing rather than tidiness: the admin credential is deleted from .env
    # after the first start, so if the database goes with a `down`, that row goes with it and
    # the token you stored stops working — while genroc, finding no admin, mints a fresh one
    # and prints it to the log. `down -v` is therefore the reset, and `down` is a restart.
    volumes: [pgdata:/var/lib/postgresql/data]

  genroc:
    build: { context: ../.., dockerfile: Dockerfile }
    command:
      - -pg
      - postgres://genroc:genroc@postgres:5432/genroc?sslmode=disable
      - -http
      - :8448
      - -auth
      - token
    environment:
      # Both credentials are stored if absent and ignored if present, so a restart is a no-op.
      # They were generated by gen-env.sh, so genroc never mints or prints a secret.
      # ADMIN_TOKEN is optional on purpose: it is needed for the FIRST start and then deleted
      # from .env, so an empty value here is a no-op rather than an error.
      GENROC_SEED_TOKENS: "evaluator=worker=${WORKER_TOKEN:?run examples/auth/gen-env.sh first},admin=admin=${ADMIN_TOKEN:-}"
    ports: ["8448:8448"]
    depends_on:
      postgres: { condition: service_healthy }

  evaluator:
    build: { context: ../.., dockerfile: examples/auth/Dockerfile.evaluator }
    environment:
      GENROC_SERVER: http://genroc:8448
      GENROC_TOKEN: ${WORKER_TOKEN:?run examples/auth/gen-env.sh first}
      CONCURRENCY: "2"
    # The worker survives genroc being briefly unreachable (a network error is a reply, not a
    # crash), so it starts alongside rather than waiting on a healthcheck the distroless image
    # has no shell to run. restart covers the rest.
    restart: unless-stopped
    depends_on:
      genroc: { condition: service_started }

  # Not started: `docker compose run --rm tools …` for one-shot commands against the DATABASE.
  # This is how the admin credential is minted — printed to YOUR terminal, hashed into the DB,
  # and never placed in a file compose reads or in any container's environment:
  #
  #   docker compose -f examples/auth/compose.yaml run --rm tools \
  #     token create -pg "$PG" --perms admin --label admin
  #
  # Then use genctl from the host: genctl config set token <that value>
  tools:
    # The same image as the server; it carries both binaries.
    build: { context: ../.., dockerfile: Dockerfile }
    profiles: [tools]
    entrypoint: ["/usr/local/bin/genroc"]
    environment:
      PG: postgres://genroc:genroc@postgres:5432/genroc?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
