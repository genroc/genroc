# Child: sends one invoice. One instance per element of the parent's `over` array.
#
# This child shows the two different things a fan-out child can do when something goes
# wrong, and they are not interchangeable:
#
#   a per-invoice problem  → COMPLETE with { ok: false, reason }. It is a RESULT. Every
#                            sibling still runs and the parent collects all of them.
#   a run-wide problem     → RAISE. It is CONTROL FLOW. The parent's on_error routes on
#                            the first raise in slot order and the batch is abandoned.
#
# Getting this backwards is the common mistake: a child that raises on a bad invoice
# throws away the other 49 results to report something the parent could have read.
name: send-invoice
input_schema:
  type: object
  properties:
    base_url: { type: string }
    period: { type: string }
    invoice_id: { type: string }
    customer: { type: string }
    amount_cents: { type: integer }
  required: [base_url, period, invoice_id, customer, amount_cents]

tasks:
  - id: send
    action:
      type: fetch
      url: "${ input.base_url }/invoices/send"
      body:
        invoice_id: "$: input.invoice_id"
        customer: "$: input.customer"
        amount_cents: "$: input.amount_cents"
        period: "$: input.period"
      responses:
        200:
          type: object
          properties:
            delivery_id: { type: string }
          required: [delivery_id]
    timeout: 5000
    on_error:
      # Permanently unsendable (no billing address, invalid customer). Retrying cannot
      # help and no sibling is affected — so it becomes this child's result.
      - code: [http.422]
        goto: $unsendable
      # Transient. Retry inside the child; `retry` is not available on the parent's
      # child_list task, which is why per-item retry policy belongs here.
      - code: [http.500, http.503]
        retry: 2
        goto: $unsendable
      # The billing period is locked. Every sibling is about to hit the same wall, so
      # this is the one condition worth aborting the whole run for.
      - code: [http.423]
        raise:
          code: period_closed
          message: "billing period is locked; no invoice in this run can be sent"
    output:
      ok: true
      delivery_id: "$: self.result.delivery_id"
      reason: ""
    switch: end

  - id: unsendable
    output:
      ok: false
      delivery_id: ""
      reason: "$: last_error.code"
    switch: end

# Exactly one of `send` / `unsendable` ran, so each slot reads both. These infer as
# non-null: the two tasks are the process's only terminals, so between them they cover
# every way of ending, and the inferencer types the output per terminal rather than
# against one collapsed context. Add a third terminal that sets neither and they go back
# to nullable, correctly. See specs/path-sensitive-output.md.
output:
  invoice_id: "$: input.invoice_id"
  ok: "$: outputs.send.ok ?? outputs.unsendable.ok"
  delivery_id: "$: outputs.send.delivery_id ?? outputs.unsendable.delivery_id"
  reason: "$: outputs.send.reason ?? outputs.unsendable.reason"
