# Child: sends one invoice, one instance per element of the parent's `over`. A per-invoice
# problem COMPLETES with { ok: false, reason } (a result; siblings run on); a run-wide one
# RAISES (control flow; the batch is abandoned). Raising on one bad invoice discards 49 results.
name: send-invoice
input_schema:
  type: object
  properties:
    base_url: { type: string }
    period: { type: string }
    invoice_id: { type: string }
    customer: { type: string }
    amount_cents: { type: integer }
  required: [base_url, period, invoice_id, customer, amount_cents]

tasks:
  - id: send
    action:
      type: fetch
      method: post
      url: "${ input.base_url }/invoices/send"
      body:
        invoice_id: "$: input.invoice_id"
        customer: "$: input.customer"
        amount_cents: "$: input.amount_cents"
        period: "$: input.period"
      responses:
        200:
          type: object
          properties:
            delivery_id: { type: string }
          required: [delivery_id]
      timeout: 5000
    on_error:
      # Permanently unsendable (no billing address, invalid customer). Retrying cannot
      # help and no sibling is affected — so it becomes this child's result.
      - code: [http.422]
        goto: $unsendable
      # Transient. Retry inside the child; `retry` is not available on the parent's
      # child_list task, which is why per-item retry policy belongs here.
      - code: [http.500, http.503]
        retry: 2
        goto: $unsendable
      # The billing period is locked. Every sibling is about to hit the same wall, so
      # this is the one condition worth aborting the whole run for.
      - code: [http.423]
        raise:
          code: period_closed
          message: "billing period is locked; no invoice in this run can be sent"
    output:
      ok: true
      delivery_id: "$: self.result.delivery_id"
      reason: ""
    switch: end

  - id: unsendable
    output:
      ok: false
      delivery_id: ""
      reason: "$: last_error.code"
    switch: end

# Each slot reads both terminals. They infer non-null because the output is typed per terminal
# and `send`/`unsendable` cover every ending (specs/path-sensitive-output.md).
output:
  invoice_id: "$: input.invoice_id"
  ok: "$: outputs.send.ok ?? outputs.unsendable.ok"
  delivery_id: "$: outputs.send.delivery_id ?? outputs.unsendable.delivery_id"
  reason: "$: outputs.send.reason ?? outputs.unsendable.reason"
