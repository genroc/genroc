# Parent: runs the poller as a child, narrows the opaque payload it returns, and catches
# what it raises. It owns the connection details (url + headers) and — knowing which job
# it started — the answer's shape.
name: polling-example
input_schema:
  type: object
  properties:
    url: { type: string }
    headers:
      type: object
      additionalProperties: { type: string }
    poll_interval_ms: { type: integer, default: 500 }
    max_attempts: { type: integer, default: 20 }
  required: [url, headers]
tasks:
  - id: run
    action:
      type: child
      name: poll-until-done
      input:
        url: "$: input.url"
        headers: "$: input.headers"
        poll_interval_ms: "$: input.poll_interval_ms"
        max_attempts: "$: input.max_attempts"
      # The narrowing point: `result` arrives unknown, and declaring its shape here is
      # what makes it readable. The engine conforms the child's output against this on
      # collect, so the type is checked, not assumed. `attempts` is already typed.
      result_schema:
        type: object
        properties:
          result:
            type: object
            properties:
              answer: { type: number }
            required: [answer]
          attempts: { type: integer }
        required: [result, attempts]
    on_error:
      - code: [poll_timeout]
        goto: $report
    output:
      answer: "$: self.result.result.answer"
      attempts: "$: self.result.attempts"
    switch: end

  - id: report
    output:
      outcome: "$: error.code"
      detail: "$: error.message"
    switch: end
