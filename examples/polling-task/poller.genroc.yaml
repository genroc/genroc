# Child: kicks off a remote job and polls it until it's done, looping check → backoff.
# Works for ANY job: the payload is left unknown (`{}`) for the parent to narrow.
# Raises `poll_timeout` when the attempt budget runs out. See README.md.
name: poll-until-done
input_schema:
  type: object
  properties:
    url: { type: string }
    headers:
      type: object
      additionalProperties: { type: string }
    poll_interval_ms: { type: integer, default: 500 }
    max_attempts: { type: integer, default: 20 }
  required: [url, headers]
tasks:
  - id: kickstart
    action:
      type: fetch
      url: "${ input.url }/jobs"
      headers: "$: input.headers"
      body:
        command: compute-answer
      result_schema:
        type: object
        properties:
          job_id: { type: string }
        required: [job_id]
    output: "$: self.result"
    timeout_ms: 2000
    switch: next

  - id: check
    action:
      type: fetch
      url: "${ input.url }/status"
      headers: "$: input.headers"
      body:
        job_id: "$: outputs.kickstart.job_id"
      result_schema:
        type: object
        properties:
          status: { type: string }        # read to drive the loop → typed
          result:                         # only carried → unknown
            description: "opaque job payload — the caller narrows this"
        required: [status]
    output:
      result: "$: self.result.result"
      attempt: "$: (self.previous.attempt ?? 0) + 1"
    timeout_ms: 2000
    switch:
      - case: "self.result.status == 'done'"
        goto: end
      - case: "(outputs.check.attempt ?? 0) >= input.max_attempts"
        raise:
          code: poll_timeout
          message: "gave up after max_attempts polls"
      - goto: $backoff

  - id: backoff
    action:
      type: delay
      ms: "$: input.poll_interval_ms"
    switch: $check

output:
  result: "$: outputs.check.result"
  attempts: "$: outputs.check.attempt"
