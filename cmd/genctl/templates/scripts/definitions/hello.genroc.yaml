# Runs greet.ts as a child of script-node.genroc.yaml; apply both.
name: hello
input_schema:
  type: object
  properties:
    who: { type: string, default: "world" }
tasks:
  - id: greet
    action:
      type: child
      # `name`, `input_schema` and `raises` come from the child; a key written here still wins.
      <<: "$process: ./script-node.genroc.yaml"
      input:
        code: "$import: ./greet.ts"
        input:
          who: "$: input.who"
      # script-node forwards the top type; this narrowing is the script's `Output`.
      result_schema:
        type: object
        properties:
          greeting: { type: string }
          at: { type: string }
        required: [greeting]
    output: "$: self.result"
    switch:
      - goto: end

output: "$: outputs.greet"
