# Runs a script through the eval-node worker. Apply it beside your own definitions; a caller
# spreads it with `$process` and narrows `result_schema` to what its script returns.
name: script-node
config_schema:
  type: object
  properties: {}
input_schema:
  type: object
  properties:
    code: { type: string }
    input:
      description: "what the script is called with; the caller types it"
    timeout_ms: { type: integer, default: 5000 }
  required: [code]
tasks:
  - id: eval_node
    action:
      # Parked until a worker claims it off the queue; nothing here names a URL.
      type: external
      input:
        code: "$: input.code"
        input: "$: input.input"
        timeout_ms: "$: input.timeout_ms"
      result_schema: {}
      # The codes a worker may answer with (eval-node/eval.ts); any other is refused.
      raises:
        threw: { $ref: "#/$defs/script_error" }
        timeout: { $ref: "#/$defs/script_error" }
        compile_error: { $ref: "#/$defs/script_error" }
        nonserializable: { $ref: "#/$defs/script_error" }
        exited: { $ref: "#/$defs/script_error" }
      # Above the worker's own budget, so an overrun comes back as `timeout`, never external.timeout.
      timeout: 30s
    output: "$: self.result"
    on_error:
      - code: [threw]
        raise:
          code: script_threw
          message: "script threw (${error.data.name}): ${error.message}"
          data:
            name: "$: error.data.name"
            stack: "$: error.data.stack"
      - code: [timeout]
        goto: $timed_out
      # Fixed by editing the script, so nobody catches these.
      - code: [compile_error, nonserializable, exited]
        panic:
          code: script_broken
          message: "the script is broken (${error.code}): ${error.message}"
          data:
            name: "$: error.data.name"
            stack: "$: error.data.stack"
      # No worker answered: none is running, or one died holding the task.
      - code: [external.timeout]
        raise:
          code: script_unknown
          message: "no evaluator answered within the budget"
    switch:
      - goto: end

  - id: timed_out
    switch:
      - raise:
          code: script_timeout
          message: "the script ran past its ${input.timeout_ms}ms budget"
          data:
            budget_ms: "$: input.timeout_ms"

output: "$: outputs.eval_node"

$defs:
  script_error:
    type: object
    properties:
      name: { type: string }
      stack: { type: string }
    required: [name]
