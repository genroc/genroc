# A genroc to develop against.
#
#   docker compose up -d
{{if and .Auth .UI}}#   open http://localhost:8448, sign in, and mint a token in the tokens tab
#   genctl config set token genroc_sk_...   &&   genctl apply
#
# The signing key in ./data/jwt-secret was generated by `genctl init`. Both containers read it
# at startup, so rotate it with both, which signs everyone out:
#   openssl rand -base64 32 > data/jwt-secret && docker compose restart genroc genroc-ui
{{else if .Auth}}#   docker compose run --rm genroc token create --perms admin --label admin
#   genctl config set token genroc_sk_...   &&   genctl apply
#
# The first admin token is created against the database (GENROC_DB/GENROC_PG below); the API
# needs one to make any.
{{else}}#   genctl apply
#
# NO AUTHENTICATION: every caller is an operator, and `PUT /definitions` stores code the
# engine runs. Fine on a laptop, not on anything anyone else can reach.
{{end -}}
services:
{{- if .Postgres}}
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: genroc
      POSTGRES_PASSWORD: genroc
      POSTGRES_DB: genroc
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genroc -d genroc"]
      interval: 2s
      retries: 15
    # Under ./data like everything that persists. Postgres owns it, so a reset is
    # `sudo rm -rf data/postgres` on Linux.
    volumes: [./data/postgres:/var/lib/postgresql/data]
{{- end}}

  genroc:
    image: {{.Image}}
    # Past --shutdown-grace (15s), so running work finishes before Docker's kill; its default is 10s.
    stop_grace_period: 20s
    # In the environment, not `command:`, so `docker compose run genroc token ...` finds it too.
    environment:
{{- if .Postgres}}
      GENROC_PG: "postgres://genroc:genroc@postgres:5432/genroc?sslmode=disable"
{{- else}}
      # SQLite; GENROC_PG=<dsn> is the same image against PostgreSQL.
      GENROC_DB: /data/genroc.db
{{- end}}
{{- if .Auth}}
      GENROC_AUTH: "true"
{{- if .UI}}
      # The secret verifies what genroc-ui mints for a person; a machine brings its own token.
      GENROC_JWT_SECRET_FILE: /data/jwt-secret
{{- end}}
{{- if .EvalNode}}
      # The worker's credential, generated by genctl: a worker cannot log in.
      GENROC_SEED_TOKENS_FILE: /data/seed-tokens
{{- end}}
{{- end}}
    # genctl init made ./data writable for genroc (uid 65532); on Linux a folder Docker creates is
    # root's. After a fresh clone, `mkdir -m 777 data`; to reset, delete files in it, never the folder.
    volumes: [./data:/data]
{{- if .UI}}
    # No ports: the only way in from the host is genroc-ui.
{{- else}}
    # --ui puts genroc-ui on this port instead.
    ports: ["8448:8448"]
{{- end}}
{{- if .Postgres}}
    depends_on:
      postgres: { condition: service_healthy }
{{- end}}
{{- if .UI}}
{{- if .Auth}}

  # Authenticates the person, maps their groups through ui.yaml's roles, and mints the token.
{{- else}}

  # With no config it runs without a login, proxying requests as they arrive.
{{- end}}
  genroc-ui:
    image: {{.UIImage}}
{{- if .Auth}}
    environment:
      GENROC_UI_CONFIG: /etc/genroc/ui.yaml
{{- else}}
    command: [--server, "http://genroc:8448"]
{{- end}}
    ports: ["8448:8448"]
{{- if .Auth}}
    volumes:
      - ./ui.yaml:/etc/genroc/ui.yaml:ro
      # The key alone: genroc-ui has no business reading the database or the worker's credential.
      - ./data/jwt-secret:/data/jwt-secret:ro
{{- end}}
    restart: unless-stopped
    depends_on: [genroc]
{{- end}}
{{- if .EvalNode}}

  # Claims parked script tasks off the queue; genroc never calls it.
  eval-node:
    image: {{.WorkerImage}}
    environment:
      GENROC_SERVER: http://genroc:8448
{{- if .Auth}}
      # A file, not a variable: the environment shows in `docker inspect` and in every child process.
      GENROC_TOKEN_FILE: /data/worker-token
    volumes:
      - ./data/worker-token:/data/worker-token:ro
{{- end}}
    restart: unless-stopped
    depends_on: [genroc]
{{- end}}
