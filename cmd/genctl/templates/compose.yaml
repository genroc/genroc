# A genroc to develop against.
#
#   docker compose up -d
{{if .Auth}}#   open http://localhost:8448, sign in, and mint a token in the tokens tab
#   genctl config set token genroc_sk_...   &&   genctl apply
#
# The signing key in ./data was generated by `genctl init`. Delete ./data and re-run it to
# start over, which signs every session out.
{{else}}#   genctl apply
#
# NO AUTHENTICATION (--auth adds a login): every caller is an operator, and `PUT /definitions`
# stores code the engine runs. Fine on a laptop, not on anything anyone else can reach.
{{end -}}
services:
{{- if .Postgres}}
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: genroc
      POSTGRES_PASSWORD: genroc
      POSTGRES_DB: genroc
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genroc -d genroc"]
      interval: 2s
      retries: 15
    # Under ./data like everything that persists, so deleting ./data is the whole reset.
    volumes: [./data/postgres:/var/lib/postgresql/data]
{{- end}}

  genroc:
    image: {{.Image}}
{{- if .Postgres}}
    command: [-pg, "postgres://genroc:genroc@postgres:5432/genroc?sslmode=disable", -http, ":8448"]
{{- else}}
    # SQLite; `-pg <dsn>` is the same image against PostgreSQL.
    command: [-db, /data/genroc.db, -http, ":8448"]
{{- end}}
{{- if .Auth}}
    environment:
      # The secret verifies what genroc-ui mints for a person; token mode takes a machine's own.
      GENROC_JWT_SECRET_FILE: /data/jwt-secret
      GENROC_AUTH: token
{{- if .EvalNode}}
      # The worker's credential, generated by genctl: a worker cannot log in.
      GENROC_SEED_TOKENS_FILE: /data/seed-tokens
{{- end}}
{{- end}}
    volumes: [./data:/data]
    # No ports: the only way in from the host is genroc-ui.
{{- if .Postgres}}
    depends_on:
      postgres: { condition: service_healthy }
{{- end}}
{{- if .Auth}}

  # Authenticates the person, maps their groups through ui.yaml's roles, and mints the token.
{{- else}}

  # With no config it runs without a login, proxying requests as they arrive.
{{- end}}
  genroc-ui:
    image: {{.UIImage}}
{{- if .Auth}}
    environment:
      GENROC_UI_CONFIG: /etc/genroc/ui.yaml
{{- else}}
    command: [-server, "http://genroc:8448"]
{{- end}}
    ports: ["8448:8448"]
{{- if .Auth}}
    volumes:
      - ./ui.yaml:/etc/genroc/ui.yaml:ro
      # The key alone: genroc-ui has no business reading the database or the worker's credential.
      - ./data/jwt-secret:/data/jwt-secret:ro
{{- end}}
    restart: unless-stopped
    depends_on: [genroc]
{{- if .EvalNode}}

  # Claims parked script tasks off the queue; genroc never calls it.
  eval-node:
    image: {{.WorkerImage}}
    environment:
      GENROC_SERVER: http://genroc:8448
      # Without a filter a worker claims EVERY external task, including another runtime's.
      TASK: eval_node
{{- if .Auth}}
      # A file, not a variable: the environment shows in `docker inspect` and in every child process.
      GENROC_TOKEN_FILE: /data/worker-token
    volumes:
      - ./data/worker-token:/data/worker-token:ro
{{- end}}
    restart: unless-stopped
    depends_on: [genroc]
{{- end}}
