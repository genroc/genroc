# genroc-ui: the login, the UI, and the proxy that turns a session into a token.
# Everything omitted has a default; what is left is what a deployment has to decide.

server: http://genroc:8448

login:
  # Passwords in a file: right for a laptop, wrong for anything else (see `providers:` below).
  # Add a user, or replace a lost password, with:  genctl init password <email>
  passwords:
    - email: {{.Email}}
      hash: "{{.Hash}}"
      groups: [admins]

  # An identity provider instead. `google` needs only a client; anything else is a generic
  # `oidc` entry with an issuer, and a provider that is not OIDC (GitHub, LDAP, SAML) needs a
  # broker such as Dex in front, used as a plain `oidc` entry.
  #
  # providers:
  #   - id: google
  #     type: google
  #     name: Google
  #     client_id: ...
  #     client_secret: ...
  #
  # A Google ID token carries no groups, so genroc-ui reads Workspace membership at login: grant
  # the client `cloud-identity.groups.readonly` and key `roles:` on the group's email.

token:
  # The one thing genroc and genroc-ui must agree on.
  secret_file: /data/jwt-secret

# Groups in, permissions out. The token carries the answer; the server has no role map.
roles:
  admins: [admin]
  # "*": [read]      # anyone who signed in at all

# Permissions by subject, for a provider that carries no groups. Unioned with `roles`.
# users:
#   ada@example.com: [admin]
