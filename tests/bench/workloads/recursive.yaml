# A full binary tree (2^(ttl+1)-1 nodes), wide and shallow: saturates the worker pool to find
# the concurrent claim/advance ceiling. The root reports its subtree size via count_field.
#   make bench-recursive   (POSTGRES_DSN=… to also compare Postgres)

bench:
  input: { ttl: 12 }
  roots: 1
  count_field: processes
  poll_ms: 10
  runs: 1
  # Concurrency per engine: SQLite's single writer overwhelms past ~20, while
  # Postgres' concurrent workers keep scaling — this wide tree feeds them well.
  sqlite:
    concurrency: 20
  postgres:
    concurrency: 200

process:
  name: recursive
  input_schema:
    type: object
    properties:
      ttl: { type: integer }
    required: [ttl]
  tasks:
    - id: recursion_condition
      switch:
        - case: "input.ttl > 0"
          goto: $recursion
        - goto: end
    - id: recursion
      action:
        type: child_map
        children:
          first:
            name: recursive
            input: { ttl: "$: input.ttl - 1" }
            result_schema:
              type: object
              properties:
                processes: { type: number }
              required: [processes]
          second:
            name: recursive
            input: { ttl: "$: input.ttl - 1" }
            result_schema:
              type: object
              properties:
                processes: { type: number }
              required: [processes]
      output: "$: self.result"
      switch:
        - goto: end
  output:
    processes: "$: (outputs.recursion.first.processes ?? 0) + (outputs.recursion.second.processes ?? 0) + 1"
