# A narrow, tall tree: splits every 12 levels (countdown `c`, since `%` needs integers and JSON
# inputs are floats), so depth ≈ ttl. Probes per-spawn cost by DEPTH; recursive covers width.
#   make bench-deep   (POSTGRES_DSN=… to also compare Postgres)

bench:
  # ~3060 nodes. Split 12 keeps this the slow bench (~20s local SQLite) under the CI timeout;
  # split 10 makes 8182 nodes, which SQLite's single writer crawls through in 137s.
  input: { ttl: 95, c: 12 }
  roots: 1
  count_field: processes
  poll_ms: 10
  runs: 1
  # This shape is mostly 1-2 instances wide, so concurrency rarely binds here.
  sqlite:
    concurrency: 20
  postgres:
    concurrency: 200

process:
  name: deep
  input_schema:
    type: object
    properties:
      ttl: { type: integer }
      c: { type: integer }
    required: [ttl, c]
  tasks:
    - id: recursion_condition
      switch:
        - case: "input.ttl <= 0"
          goto: end
        - case: "input.c <= 1"
          goto: $split
        - goto: $descend
    - id: split
      action:
        type: child_map
        children:
          first:
            name: deep
            input: { ttl: "$: input.ttl - 1", c: "$: 12" }
            result_schema:
              type: object
              properties:
                processes: { type: number }
              required: [processes]
          second:
            name: deep
            input: { ttl: "$: input.ttl - 1", c: "$: 12" }
            result_schema:
              type: object
              properties:
                processes: { type: number }
              required: [processes]
      output: "$: self.result"
      switch:
        - goto: end
    - id: descend
      action:
        type: child_map
        children:
          out:
            name: deep
            input: { ttl: "$: input.ttl - 1", c: "$: input.c - 1" }
            result_schema:
              type: object
              properties:
                processes: { type: number }
              required: [processes]
      output: "$: self.result.out"
      switch:
        - goto: end
  output:
    processes: "$: (outputs.split.first.processes ?? 0) + (outputs.split.second.processes ?? 0) + (outputs.descend.processes ?? 0) + 1"
