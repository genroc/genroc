# A backlog of independent childless roots, all runnable from the first tick and preloaded
# untimed: pure queue throughput, one claim + one terminal write per instance.
#   make bench-drain   (POSTGRES_DSN=… to also compare Postgres)

bench:
  roots: 5000            # backlog size to preload (independent root instances)
  load_concurrency: 64   # parallel inserts during the (untimed) load phase
  input: { n: 1 }
  poll_ms: 10
  runs: 1
  sqlite:
    concurrency: 20
  postgres:
    concurrency: 200

process:
  name: drain
  input_schema:
    type: object
    properties:
      n: { type: integer }
  tasks:
    - id: start
      switch:
        - goto: $finish
    - id: finish
      switch:
        - goto: end
  output:
    n: "$: input.n ?? 0"
