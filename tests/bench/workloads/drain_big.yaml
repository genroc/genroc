# `drain` with a ~16 KiB input echoed to the output, both over the 2 KiB object-store threshold:
# compared with drain, it isolates object-store overhead. Only the blob's size matters.
#   make bench-drain-big   (POSTGRES_DSN=… to also compare Postgres)

