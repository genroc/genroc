# The playground bug, reduced: a handler reads `error.data`, then concludes with a `panic`
# declaring no `data`. That clause must not clear the slot the handler just read, or the failed
# state refuses the upgrade that ships the fix. Versions differ by one optional input.
apply:
  - definitions:
      - name: raiser
        tasks:
          - id: go
            switch:
              - raise: {code: boom, message: "kaboom", data: {name: '$: "UpstreamError"'}}
      - name: catcher
        input_schema:
          type: object
          properties: {n: {type: number}}
          required: [n]
        tasks:
          - id: call
            action:
              type: child
              name: raiser
              raises:
                boom: {$ref: "#/$defs/payload"}
            on_error:
              - code: [boom]
                goto: $classify
            switch: end
          - id: classify
            switch:
              - case: 'last_error.data.name == "Transient"'
                goto: end
              - panic: {code: upstream_broken, message: 'upstream said ${last_error.data.name}'}
        $defs:
          payload:
            type: object
            properties: {name: {type: string}}
            required: [name]
  - definitions:
      - name: raiser
        tasks:
          - id: go
            switch:
              - raise: {code: boom, message: "kaboom", data: {name: '$: "UpstreamError"'}}
      - name: catcher
        input_schema:
          type: object
          properties: {n: {type: number}, note: {type: [string, "null"]}}
          required: [n]
        tasks:
          - id: call
            action:
              type: child
              name: raiser
              raises:
                boom: {$ref: "#/$defs/payload"}
            on_error:
              - code: [boom]
                goto: $classify
            switch: end
          - id: classify
            switch:
              - case: 'last_error.data.name == "Transient"'
                goto: end
              - panic: {code: upstream_broken, message: 'upstream said ${last_error.data.name}'}
        $defs:
          payload:
            type: object
            properties: {name: {type: string}}
            required: [name]
resting: {task: classify, status: failed}
after: {task: classify, status: failed}
start: {process: catcher, input: {n: 1}, ticks: 4}
run: [catcher, --from, "1", --to, "2"]
