# `classify` is reachable only through on_error, so `error` is guaranteed there; the instance is
# upgraded resting at the handler, before it runs. Versions differ by one optional input.
apply:
  - definitions:
      - name: raiser
        tasks:
          - id: go
            switch:
              - raise: {code: boom, message: "kaboom", data: {name: '$: "UpstreamError"'}}
      - name: catcher
        input_schema:
          type: object
          properties: {n: {type: number}}
          required: [n]
        tasks:
          - id: call
            action:
              type: child
              name: raiser
              raises:
                boom: {$ref: "#/$defs/payload"}
            on_error:
              - code: [boom]
                goto: $classify
            switch: end
          - id: classify
            output: {saw: '$: last_error.data.name'}
            switch:
              - goto: $wait
          - id: wait
            action: {type: delay, for: 1}
            switch:
              - goto: $call
        $defs:
          payload:
            type: object
            properties: {name: {type: string}}
            required: [name]
  - definitions:
      - name: raiser
        tasks:
          - id: go
            switch:
              - raise: {code: boom, message: "kaboom", data: {name: '$: "UpstreamError"'}}
      - name: catcher
        input_schema:
          type: object
          properties: {n: {type: number}, note: {type: [string, "null"]}}
          required: [n]
        tasks:
          - id: call
            action:
              type: child
              name: raiser
              raises:
                boom: {$ref: "#/$defs/payload"}
            on_error:
              - code: [boom]
                goto: $classify
            switch: end
          - id: classify
            output: {saw: '$: last_error.data.name'}
            switch:
              - goto: $wait
          - id: wait
            action: {type: delay, for: 1}
            switch:
              - goto: $call
        $defs:
          payload:
            type: object
            properties: {name: {type: string}}
            required: [name]
resting: {task: classify, status: running}
after: {task: classify, status: running}
start: {process: catcher, input: {n: 1}, ticks: 3}
run: [catcher, --from, "1", --to, "2"]
