# Upgrading a tree. The operator names only the ROOT; which version its live child moves to is
# read from the parent's TARGET definition, where it was pinned at registration.
#
# The child's v2 is what differs, and only in a task it has not reached yet, so the finished
# output names the version that actually executed: 20 if the child moved with its parent, 4 if
# it was left behind on the version it was spawned from. Nothing shallower can tell those apart
# — the tree looks identical either way while the child is still parked.
apply:
  - definitions:
      - name: leaf
        input_schema:
          type: object
          properties: {k: {type: number}}
          required: [k]
        tasks:
          - id: go
            output: {v: '$: input.k * 2'}
            switch: end
        output: '$: outputs.go.v'
      - name: root
        input_schema:
          type: object
          properties: {n: {type: number}}
          required: [n]
        tasks:
          - id: call
            action:
              type: child
              name: leaf
              input: {k: '$: input.n'}
              result_schema: {type: number}
            output: {v: '$: self.result'}
            switch: end
        output: {got: '$: outputs.call.v'}
  - definitions:
      - name: leaf
        input_schema:
          type: object
          properties: {k: {type: number}}
          required: [k]
        tasks:
          - id: go
            output: {v: '$: input.k * 10'}
            switch: end
        output: '$: outputs.go.v'
      - name: root
        input_schema:
          type: object
          properties: {n: {type: number}}
          required: [n]
        tasks:
          - id: call
            action:
              type: child
              name: leaf
              input: {k: '$: input.n'}
              result_schema: {type: number}
            output: {v: '$: self.result'}
            switch: end
        output: {got: '$: outputs.call.v'}
# Three live positions, and they are the three states the in-flight reasoning distinguishes:
# nothing spawned yet, a child RUNNING, and a child that has COMPLETED but not been collected.
# The finished output says which leaf version actually ran, so each position asserts its own —
# and the third differs, which is the whole point of sweeping this case:
#
#   tick 0  nothing spawned   the parent spawns leaf v2 after the move       -> 20
#   tick 1  child running     it moves with its parent and finishes on v2    -> 20
#   tick 2  child completed   terminal descendants STAY PUT, so its v1 output
#                             is what the parent collects                    -> 4
#
# That last line is the behaviour worth pinning end to end: an upgrade does not rewrite history,
# and a result already produced belongs to the version that produced it.
start: {process: root, input: {n: 2}, advance_ms: 0}
at:
  - {ticks: 0, resting: {task: call, wait_state: ""},           finish: {status: completed, output: {got: 20}}}
  - {ticks: 1, resting: {task: call, wait_state: waiting},      finish: {status: completed, output: {got: 20}}}
  - {ticks: 2, resting: {task: call, wait_state: collecting},   finish: {status: completed, output: {got: 4}}}
after: {version: 2}
run: [root, --from, "1", --to, "2"]
