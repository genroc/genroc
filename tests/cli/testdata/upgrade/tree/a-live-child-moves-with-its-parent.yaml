# Only the root is named; the live child's version comes from the parent's TARGET definition.
# The child's v2 differs in a task not yet reached: 20 if it moved, 4 if left behind.
apply:
  - definitions:
      - name: leaf
        input_schema:
          type: object
          properties: {k: {type: number}}
          required: [k]
        tasks:
          - id: go
            output: {v: '$: input.k * 2'}
            switch: end
        output: '$: outputs.go.v'
      - name: root
        input_schema:
          type: object
          properties: {n: {type: number}}
          required: [n]
        tasks:
          - id: call
            action:
              type: child
              name: leaf
              input: {k: '$: input.n'}
              result_schema: {type: number}
            output: {v: '$: self.result'}
            switch: end
        output: {got: '$: outputs.call.v'}
  - definitions:
      - name: leaf
        input_schema:
          type: object
          properties: {k: {type: number}}
          required: [k]
        tasks:
          - id: go
            output: {v: '$: input.k * 10'}
            switch: end
        output: '$: outputs.go.v'
      - name: root
        input_schema:
          type: object
          properties: {n: {type: number}}
          required: [n]
        tasks:
          - id: call
            action:
              type: child
              name: leaf
              input: {k: '$: input.n'}
              result_schema: {type: number}
            output: {v: '$: self.result'}
            switch: end
        output: {got: '$: outputs.call.v'}
# tick 0: nothing spawned, leaf v2 is spawned after the move (20). tick 1: the running child
# moves (20). tick 2: the completed child stays put and its v1 output is collected (4): an
# upgrade does not rewrite history.
start: {process: root, input: {n: 2}, advance_ms: 0}
at:
  - {ticks: 0, resting: {task: call, phase: ""},           finish: {status: completed, output: {got: 20}}}
  - {ticks: 1, resting: {task: call, phase: children},      finish: {status: completed, output: {got: 20}}}
  - {ticks: 2, resting: {task: call, phase: collecting},   finish: {status: completed, output: {got: 4}}}
after: {version: 2}
run: [root, --from, "1", --to, "2"]
