# Each child carries `_spawn_child_key`, which the plan reads to find its entry. `slow` decuples
# in v2 and `fast` is untouched, so the collected object says per key which definition ran.
apply:
  - definitions:
      - name: slow
        input_schema: {type: object, properties: {k: {type: number}}, required: [k]}
        tasks:
          - id: go
            output: {v: '$: input.k * 2'}
            switch: end
        output: '$: outputs.go.v'
      - name: fast
        input_schema: {type: object, properties: {k: {type: number}}, required: [k]}
        tasks:
          - id: go
            output: {v: '$: input.k + 100'}
            switch: end
        output: '$: outputs.go.v'
      - name: boss
        input_schema: {type: object, properties: {n: {type: number}}, required: [n]}
        tasks:
          - id: call
            action:
              type: child_map
              children:
                a: {name: slow, input: {k: '$: input.n'}, result_schema: {type: number}}
                b: {name: fast, input: {k: '$: input.n'}, result_schema: {type: number}}
            output: {v: '$: self.result'}
            switch: end
        output: {got: '$: outputs.call.v'}
  - definitions:
      - name: slow
        input_schema: {type: object, properties: {k: {type: number}}, required: [k]}
        tasks:
          - id: go
            output: {v: '$: input.k * 10'}
            switch: end
        output: '$: outputs.go.v'
      - name: fast
        input_schema: {type: object, properties: {k: {type: number}}, required: [k]}
        tasks:
          - id: go
            output: {v: '$: input.k + 100'}
            switch: end
        output: '$: outputs.go.v'
      - name: boss
        input_schema: {type: object, properties: {n: {type: number}}, required: [n]}
        tasks:
          - id: call
            action:
              type: child_map
              children:
                a: {name: slow, input: {k: '$: input.n'}, result_schema: {type: number}}
                b: {name: fast, input: {k: '$: input.n'}, result_schema: {type: number}}
            output: {v: '$: self.result'}
            switch: end
        output: {got: '$: outputs.call.v'}
start: {process: boss, input: {n: 3}}
at:
  - {ticks: 0, resting: {task: call, phase: ""},         finish: {status: completed, output: {got: {a: 30, b: 103}}}}
  - {ticks: 1, resting: {task: call, phase: children},    finish: {status: completed, output: {got: {a: 30, b: 103}}}}
  - {ticks: 2, resting: {task: call, phase: collecting}, finish: {status: completed, output: {got: {a: 6, b: 103}}}}
after: {version: 2}
run: [boss, --from, "1", --to, "2"]
