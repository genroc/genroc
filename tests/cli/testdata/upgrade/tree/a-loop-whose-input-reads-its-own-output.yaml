# `self.previous` in an action slot: the child's input is built from the task's own output, so a
# migration that reshaped outputs.acc sends 1 again and the loop times out short of 3. v2 adds a
# nullable slot to that output, so the migration has real work on it.
apply:
  - definitions:
      - name: echo
        input_schema:
          type: object
          properties: {x: {type: number}}
          required: [x]
        tasks:
          - id: e
            output: '$: input.x'
            switch: end
        output: '$: outputs.e'
      - name: acc
        tasks:
          - id: step
            action:
              type: child
              name: echo
              # The slot under test.
              input: {x: '$: (self.previous.i ?? 0) + 1'}
              result_schema: {type: number}
            output: {i: '$: self.result'}
            switch:
              - case: 'self.output.i < 3'
                goto: $step
              - goto: end
        output: {i: '$: outputs.step.i'}
  - definitions:
      - name: echo
        input_schema:
          type: object
          properties: {x: {type: number}}
          required: [x]
        tasks:
          - id: e
            output: '$: input.x'
            switch: end
        output: '$: outputs.e'
      - name: acc
        tasks:
          - id: step
            action:
              type: child
              name: echo
              input: {x: '$: (self.previous.i ?? 0) + 1'}
              result_schema: {type: number}
            # `note` is absent on every row v1 wrote and nullable on v2, so the migration has
            # to fill it — on the very output the input above reads.
            output: {i: '$: self.result', note: '$: null'}
            switch:
              - case: 'self.output.i < 3'
                goto: $step
              - goto: end
        output: {i: '$: outputs.step.i'}
start: {process: acc, input: {}, ticks: 6}
run: [acc, --from, "1", --to, "2"]
# Before the first spawn, and mid-loop at i=2 of 3, so a whole iteration still runs on v2.
at:
  - ticks: 0
    resting: {task: step, status: running, outputs: []}
    after: {task: step, status: running, version: 2}
  - ticks: 6
    resting: {task: step, status: running, outputs: [step], values: {"outputs.step.i": 2}}
    after: {task: step, status: running, version: 2, values: {"outputs.step.note": null}}
finish: {status: completed, output: {i: 3}, ticks: 60}
