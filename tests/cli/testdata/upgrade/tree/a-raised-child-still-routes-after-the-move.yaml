# A raised child stays on v1 like a completed one, but its payload is conformed against the
# parent's raises[code] and routed by on_error. Position 2 (raised, uncollected) is the one
# worth having. Versions differ by one optional input.
apply:
  - definitions:
      - name: kid
        input_schema: {type: object, properties: {k: {type: number}}, required: [k]}
        tasks:
          - id: go
            switch:
              - raise: {code: declined, message: "no", data: {why: "card"}}
      - name: boss
        input_schema: {type: object, properties: {n: {type: number}}, required: [n]}
        tasks:
          - id: call
            action:
              type: child
              name: kid
              input: {k: '$: input.n'}
              result_schema: {}
              raises:
                declined: {type: object, properties: {why: {type: string}}}
            on_error: [{code: [declined], goto: $explain}]
            output: {v: '$: self.result'}
            switch: end
          - id: explain
            output: {saw: '$: last_error.data.why'}
            switch: end
        output: {got: '$: outputs.explain.saw'}
  - definitions:
      - name: kid
        input_schema: {type: object, properties: {k: {type: number}}, required: [k]}
        tasks:
          - id: go
            switch:
              - raise: {code: declined, message: "no", data: {why: "card"}}
      - name: boss
        input_schema:
          type: object
          properties: {n: {type: number}, note: {type: [string, "null"]}}
          required: [n]
        tasks:
          - id: call
            action:
              type: child
              name: kid
              input: {k: '$: input.n'}
              result_schema: {}
              raises:
                declined: {type: object, properties: {why: {type: string}}}
            on_error: [{code: [declined], goto: $explain}]
            output: {v: '$: self.result'}
            switch: end
          - id: explain
            output: {saw: '$: last_error.data.why'}
            switch: end
        output: {got: '$: outputs.explain.saw'}
start: {process: boss, input: {n: 1}}
at:
  - {ticks: 0, resting: {task: call, phase: ""}}
  - {ticks: 1, resting: {task: call, phase: children}}
  # Raised and uncollected: the payload is on the child's row, produced under v1.
  - {ticks: 2, resting: {task: call, phase: collecting}}
  # Already routed: the payload has reached the handler and is in the parent's own error slot.
  - {ticks: 3, resting: {task: explain, phase: ""}}
after: {version: 2}
finish: {status: completed, output: {got: card}}
run: [boss, --from, "1", --to, "2"]
