# One batch: `fast` completed under v1 (stays, contributes 2), `slow` is parked (moves to v2).
# Nothing submits `slow`, so the state after the move is asserted rather than an output.
apply:
  - definitions:
      - name: quick
        input_schema: {type: object, properties: {k: {type: number}}, required: [k]}
        tasks:
          - id: go
            output: {v: '$: input.k * 2'}
            switch: end
        output: '$: outputs.go.v'
      - name: slowp
        input_schema: {type: object, properties: {k: {type: number}}, required: [k]}
        tasks:
          - id: park
            action: {type: external, input: {}, result_schema: {type: number}}
            output: {r: '$: self.result'}
            switch: end
        output: '$: outputs.park.r'
      - name: boss
        input_schema: {type: object, properties: {n: {type: number}}, required: [n]}
        tasks:
          - id: call
            action:
              type: child_map
              children:
                fast: {name: quick, input: {k: '$: input.n'}, result_schema: {type: number}}
                slow: {name: slowp, input: {k: '$: input.n'}, result_schema: {type: number}}
            output: {v: '$: self.result'}
            switch: end
        output: {got: '$: outputs.call.v'}
  - definitions:
      - name: quick
        input_schema: {type: object, properties: {k: {type: number}}, required: [k]}
        tasks:
          - id: go
            output: {v: '$: input.k * 10'}
            switch: end
        output: '$: outputs.go.v'
      - name: slowp
        input_schema: {type: object, properties: {k: {type: number}}, required: [k]}
        tasks:
          - id: park
            action: {type: external, input: {}, result_schema: {type: number}}
            output: {r: '$: self.result'}
            switch: end
        output: '$: outputs.park.r'
      - name: boss
        input_schema: {type: object, properties: {n: {type: number}}, required: [n]}
        tasks:
          - id: call
            action:
              type: child_map
              children:
                fast: {name: quick, input: {k: '$: input.n'}, result_schema: {type: number}}
                slow: {name: slowp, input: {k: '$: input.n'}, result_schema: {type: number}}
            output: {v: '$: self.result'}
            switch: end
        output: {got: '$: outputs.call.v'}
start: {process: boss, input: {n: 1}}
at:
  # Both children live: the whole batch moves.
  - {ticks: 1, resting: {task: call, phase: children}}
  # `fast` has completed and `slow` has not: the batch splits, and the move still succeeds.
  - {ticks: 2, resting: {task: call, phase: children}}
after: {task: call, status: running, phase: children, version: 2}
run: [boss, --from, "1", --to, "2"]
