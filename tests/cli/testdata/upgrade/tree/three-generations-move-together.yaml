# A grandchild is reached only through its parent's TARGET definition, so a walk stopping at
# the first generation leaves it behind: 10 if gc moved, 2 if not. At tick 3 gc has already
# finished under v1 and stays.
apply:
  - definitions:
      - name: gc
        input_schema: {type: object, properties: {k: {type: number}}, required: [k]}
        tasks:
          - id: go
            output: {v: '$: input.k * 2'}
            switch: end
        output: '$: outputs.go.v'
      - name: mid
        input_schema: {type: object, properties: {k: {type: number}}, required: [k]}
        tasks:
          - id: down
            action: {type: child, name: gc, input: {k: '$: input.k'}, result_schema: {type: number}}
            output: {v: '$: self.result'}
            switch: end
        output: '$: outputs.down.v'
      - name: top
        input_schema: {type: object, properties: {n: {type: number}}, required: [n]}
        tasks:
          - id: call
            action: {type: child, name: mid, input: {k: '$: input.n'}, result_schema: {type: number}}
            output: {v: '$: self.result'}
            switch: end
        output: {got: '$: outputs.call.v'}
  - definitions:
      - name: gc
        input_schema: {type: object, properties: {k: {type: number}}, required: [k]}
        tasks:
          - id: go
            output: {v: '$: input.k * 10'}
            switch: end
        output: '$: outputs.go.v'
      - name: mid
        input_schema: {type: object, properties: {k: {type: number}}, required: [k]}
        tasks:
          - id: down
            action: {type: child, name: gc, input: {k: '$: input.k'}, result_schema: {type: number}}
            output: {v: '$: self.result'}
            switch: end
        output: '$: outputs.down.v'
      - name: top
        input_schema: {type: object, properties: {n: {type: number}}, required: [n]}
        tasks:
          - id: call
            action: {type: child, name: mid, input: {k: '$: input.n'}, result_schema: {type: number}}
            output: {v: '$: self.result'}
            switch: end
        output: {got: '$: outputs.call.v'}
start: {process: top, input: {n: 1}}
at:
  # Nothing spawned: the whole tree is built after the move, so every level is v2.
  - {ticks: 0, resting: {task: call, phase: ""},         finish: {status: completed, output: {got: 10}}}
  # mid exists, gc not yet — the grandchild is spawned by a parent that has already moved.
  - {ticks: 1, resting: {task: call, phase: children},    finish: {status: completed, output: {got: 10}}}
  # All three live: the walk has to reach the bottom generation to move it.
  - {ticks: 2, resting: {task: call, phase: children},    finish: {status: completed, output: {got: 10}}}
  # gc has COMPLETED under v1: terminal, so it stays, and its number is what comes back up.
  - {ticks: 3, resting: {task: call, phase: children},    finish: {status: completed, output: {got: 2}}}
after: {version: 2}
run: [top, --from, "1", --to, "2"]
