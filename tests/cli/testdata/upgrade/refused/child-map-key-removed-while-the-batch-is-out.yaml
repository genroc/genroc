# `_spawn_child_key` on the live child records which slot it holds and is derivable from neither
# definition, so removing that key leaves no plan. The refusal still names the child and the
# reason, not an internal error.
apply:
  - definitions:
      - name: leaf
        input_schema:
          type: object
          properties: {k: {type: number}}
          required: [k]
        tasks:
          - id: park
            action: {type: external, input: {}, result_schema: {}}
            output: {r: '$: self.result'}
            switch: end
        output: '$: outputs.park.r'
      - name: boss
        input_schema:
          type: object
          properties: {n: {type: number}}
          required: [n]
        tasks:
          - id: call
            action:
              type: child_map
              children:
                a: {name: leaf, input: {k: 1}, result_schema: {}}
                b: {name: leaf, input: {k: 2}, result_schema: {}}
            output: {v: '$: self.result'}
            switch: end
  - definitions:
      - name: leaf
        input_schema:
          type: object
          properties: {k: {type: number}}
          required: [k]
        tasks:
          - id: park
            action: {type: external, input: {}, result_schema: {}}
            output: {r: '$: self.result'}
            switch: end
        output: '$: outputs.park.r'
      - name: boss
        input_schema:
          type: object
          properties: {n: {type: number}}
          required: [n]
        tasks:
          - id: call
            action:
              type: child_map
              children:
                a: {name: leaf, input: {k: 1}, result_schema: {}}
            output: {v: '$: self.result'}
            switch: end
start: {process: boss, input: {n: 1}, ticks: 2}
resting: {task: call, status: running, phase: children, version: 1}
after: {task: call, status: running, phase: children, version: 1}
run: [boss, --from, "1", --to, "2"]
refused: {says: 'occupies slot "b"'}
