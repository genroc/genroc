# Parked on a task v2 deleted: refused outright, with nowhere to resume. `after` pins that the
# refusal wrote nothing (the row stays on v1).
apply:
  - definitions:
      - name: goneproc
        input_schema:
          type: object
          properties: {n: {type: number}}
          required: [n]
        tasks:
          - id: first
            action: {type: delay, for: 1}
            output: {v: '$: input.n'}
            switch: next
          - id: doomed
            output: {w: '$: outputs.first.v'}
            switch: end
  - definitions:
      - name: goneproc
        input_schema:
          type: object
          properties: {n: {type: number}}
          required: [n]
        tasks:
          - id: first
            action: {type: delay, for: 1}
            output: {v: '$: input.n'}
            switch: end
start: {process: goneproc, input: {n: 2}, ticks: 2, advance_ms: 1000}
resting: {task: doomed, status: running, version: 1}
after: {task: doomed, status: running, version: 1}
run: [goneproc, --from, "1", --to, "2"]
refused: {says: 'does not exist'}
