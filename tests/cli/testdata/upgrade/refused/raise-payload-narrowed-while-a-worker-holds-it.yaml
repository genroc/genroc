# A worker's failure `data` is conformed against raises[code], so a narrowing is compared per
# code, strictly (old ⊆ new): the answer comes from outside and no migration repairs it.
apply:
  - definitions:
      - name: raiseproc
        input_schema:
          type: object
          properties: {n: {type: number}}
          required: [n]
        tasks:
          - id: hold
            action:
              type: external
              input: {n: '$: input.n'}
              result_schema: {}
              raises:
                boom:
                  type: object
                  properties: {why: {type: string}}
            on_error:
              - code: [boom]
                goto: end
            output: {r: '$: self.result'}
            switch: end
  - definitions:
      - name: raiseproc
        input_schema:
          type: object
          properties: {n: {type: number}}
          required: [n]
        tasks:
          - id: hold
            action:
              type: external
              input: {n: '$: input.n'}
              result_schema: {}
              # `why` becomes required: a failure the old version accepted without it is refused.
              raises:
                boom:
                  type: object
                  properties: {why: {type: string}}
                  required: [why]
            on_error:
              - code: [boom]
                goto: end
            output: {r: '$: self.result'}
            switch: end
start: {process: raiseproc, input: {n: 1}}
at:
  - ticks: 0
    resting: {task: hold, phase: "", version: 1}
    after: {task: hold, phase: "", version: 2}
    refused: false
  - ticks: 1
    resting: {task: hold, phase: external, version: 1}
    after: {task: hold, phase: external, version: 1}
    refused: {says: 'raises.boom'}
run: [raiseproc, --from, "1", --to, "2"]
