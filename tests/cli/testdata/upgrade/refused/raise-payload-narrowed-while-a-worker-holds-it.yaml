# The error channel is the same promise as the result, and it escaped the same gate.
#
# A worker answers a failure with {code, message, data}, and `data` is conformed against
# raises[code]. Narrowing that payload refuses a submission the old version entitled the worker
# to make — and until this was compared, an external task got no warning at all: the upgrade
# allowed it and compat reported `upgrade: compatible`, listing raises only as a slot that had
# CHANGED. A child call was luckier for the wrong reason: its handler task reads `error.data`,
# so the layer comparison caught the narrowing indirectly, and coverage depended on a handler
# happening to exist.
#
# Compared per code and strictly, `old ⊆ new`, for the reason the result is: the answer comes
# from OUTSIDE and no migration repairs it.
apply:
  - definitions:
      - name: raiseproc
        input_schema:
          type: object
          properties: {n: {type: number}}
          required: [n]
        tasks:
          - id: hold
            action:
              type: external
              input: {n: '$: input.n'}
              result_schema: {}
              raises:
                boom:
                  type: object
                  properties: {why: {type: string}}
            on_error:
              - code: [boom]
                goto: end
            output: {r: '$: self.result'}
            switch: end
  - definitions:
      - name: raiseproc
        input_schema:
          type: object
          properties: {n: {type: number}}
          required: [n]
        tasks:
          - id: hold
            action:
              type: external
              input: {n: '$: input.n'}
              result_schema: {}
              # `why` becomes required: a failure the old version accepted without it is refused.
              raises:
                boom:
                  type: object
                  properties: {why: {type: string}}
                  required: [why]
            on_error:
              - code: [boom]
                goto: end
            output: {r: '$: self.result'}
            switch: end
start: {process: raiseproc, input: {n: 1}}
at:
  - ticks: 0
    resting: {task: hold, wait_state: "", version: 1}
    after: {task: hold, wait_state: "", version: 2}
    refused: false
  - ticks: 1
    resting: {task: hold, wait_state: external, version: 1}
    after: {task: hold, wait_state: external, version: 1}
    refused: {says: 'raises.boom'}
run: [raiseproc, --from, "1", --to, "2"]
