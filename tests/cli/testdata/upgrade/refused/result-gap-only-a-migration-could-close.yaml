# A pending result is not on the row, so the upgrade compares old promise to new, strictly:
# `a` optional → required-and-nullable is closable as stored state but refused at the
# boundary. result-narrowed-while-a-worker-holds-it breaks under both, so cannot tell them apart.
apply:
  - definitions:
      - name: gapproc
        input_schema:
          type: object
          properties: {n: {type: number}}
          required: [n]
        tasks:
          - id: hold
            action:
              type: external
              input: {asked: '$: input.n'}
              result_schema:
                type: object
                properties: {a: {type: string}}
            output: {r: '$: self.result'}
            switch: end
  - definitions:
      - name: gapproc
        input_schema:
          type: object
          properties: {n: {type: number}}
          required: [n]
        tasks:
          - id: hold
            action:
              type: external
              input: {asked: '$: input.n'}
              result_schema:
                type: object
                properties: {a: {type: [string, "null"]}}
                required: [a]
            output: {r: '$: self.result'}
            switch: end
start: {process: gapproc, input: {n: 1}, ticks: 1}
resting: {task: hold, status: running, phase: external, version: 1}
after: {task: hold, status: running, phase: external, version: 1}
run: [gapproc, --from, "1", --to, "2"]
refused: {says: 'newly required field'}
