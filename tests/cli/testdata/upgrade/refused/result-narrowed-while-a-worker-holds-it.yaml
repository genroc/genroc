# Parked on an external: state migrates cleanly, but the worker's in-flight result would meet a
# narrowed schema (number → integer). Only the result is guaranteed, never that the worker was
# asked the right question: `input` is already in its hands.
apply:
  - definitions:
      - name: waitproc
        input_schema:
          type: object
          properties: {n: {type: number}}
          required: [n]
        tasks:
          - id: hold
            action:
              type: external
              input: {asked: '$: input.n'}
              result_schema: {type: number}
            output: {r: '$: self.result'}
            switch: end
  - definitions:
      - name: waitproc
        input_schema:
          type: object
          properties: {n: {type: number}}
          required: [n]
        tasks:
          - id: hold
            action:
              type: external
              input: {asked: '$: input.n'}
              result_schema: {type: integer}
            output: {r: '$: self.result'}
            switch: end
# One pair of definitions, both sides of the boundary: the gate asks whether this row has work
# outstanding, not whether the task kind could.
start: {process: waitproc, input: {n: 1}}
at:
  # Sitting ON the task, nothing asked. No promise has been made, so the narrowing is free.
  - ticks: 0
    resting: {task: hold, phase: "", version: 1}
    after: {task: hold, phase: "", version: 2}
    refused: false
  # Armed: a worker holds the old contract, so the move is refused.
  - ticks: 1
    resting: {task: hold, phase: external, version: 1}
    after: {task: hold, phase: external, version: 1}
    refused: {says: 'waiting on a result promised by v1'}
run: [waitproc, --from, "1", --to, "2"]
