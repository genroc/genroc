# The parent conforms its children's output against its own result_schema at collect, on the
# version it is on then, and a completed child stays on its old version. Registration plus
# old ⊆ new is what keeps that chain intact, so a narrowing is refused.
apply:
  - definitions:
      - name: kid
        input_schema:
          type: object
          properties: {k: {type: number}}
          required: [k]
        tasks:
          - id: work
            output: {v: '$: input.k'}
            switch: end
        output: {v: '$: outputs.work.v'}
      - name: boss
        input_schema:
          type: object
          properties: {n: {type: number}}
          required: [n]
        tasks:
          - id: call
            action:
              type: child
              name: kid
              input: {k: '$: input.n'}
              result_schema:
                type: object
                properties: {v: {type: number}}
            output: {r: '$: self.result'}
            switch: end
  - definitions:
      - name: kid
        input_schema:
          type: object
          properties: {k: {type: number}}
          required: [k]
        tasks:
          - id: work
            output: {v: '$: input.k'}
            switch: end
        output: {v: '$: outputs.work.v'}
      - name: boss
        input_schema:
          type: object
          properties: {n: {type: number}}
          required: [n]
        tasks:
          - id: call
            action:
              type: child
              name: kid
              input: {k: '$: input.n'}
              # `v` becomes required: a result the old promise allowed without it is refused.
              result_schema:
                type: object
                properties: {v: {type: number}}
                required: [v]
            output: {r: '$: self.result'}
            switch: end
# tick 0: nothing spawned, free. tick 1: child running, knowingly over-refused (it moves to a
# registration-checked version; version-compatibility.md §5.8 keeps the coarse relation).
# tick 2: child completed and stays on v1, so the refusal is earned.
start: {process: boss, input: {n: 1}}
at:
  - ticks: 0
    resting: {task: call, phase: "", version: 1}
    after: {task: call, phase: "", version: 2}
    refused: false
  - ticks: 1
    resting: {task: call, phase: children, version: 1}
    after: {task: call, phase: children, version: 1}
    refused: {says: 'waiting on a result promised by v1'}
  - ticks: 2
    resting: {task: call, phase: collecting, version: 1}
    after: {task: call, phase: collecting, version: 1}
    refused: {says: 'waiting on a result promised by v1'}
run: [boss, --from, "1", --to, "2"]
