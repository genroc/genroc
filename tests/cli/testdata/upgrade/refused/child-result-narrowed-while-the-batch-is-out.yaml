# The same in-flight question, asked of a child task instead of an external one — and it is the
# same question, because the parent conforms whatever its children produce against ITS OWN
# result_schema at collect time, using the version it is on THEN.
#
# The parent is parked with its batch out. Its stored state migrates cleanly; what does not is
# the promise it made about the result. A child that already completed stays on the version it
# ran (terminal descendants do not move), so its output was produced under the old contract and
# would be conformed under the new one.
#
# Safety here is transitive rather than direct: registration guarantees a child's output fits
# the parent's result_schema, so `old ⊆ new` on that schema carries the guarantee across the
# move. Refusing when it does not is what keeps the chain intact.
apply:
  - definitions:
      - name: kid
        input_schema:
          type: object
          properties: {k: {type: number}}
          required: [k]
        tasks:
          - id: work
            output: {v: '$: input.k'}
            switch: end
        output: {v: '$: outputs.work.v'}
      - name: boss
        input_schema:
          type: object
          properties: {n: {type: number}}
          required: [n]
        tasks:
          - id: call
            action:
              type: child
              name: kid
              input: {k: '$: input.n'}
              result_schema:
                type: object
                properties: {v: {type: number}}
            output: {r: '$: self.result'}
            switch: end
  - definitions:
      - name: kid
        input_schema:
          type: object
          properties: {k: {type: number}}
          required: [k]
        tasks:
          - id: work
            output: {v: '$: input.k'}
            switch: end
        output: {v: '$: outputs.work.v'}
      - name: boss
        input_schema:
          type: object
          properties: {n: {type: number}}
          required: [n]
        tasks:
          - id: call
            action:
              type: child
              name: kid
              input: {k: '$: input.n'}
              # `v` becomes required: a result the old promise allowed without it is refused.
              result_schema:
                type: object
                properties: {v: {type: number}}
                required: [v]
            output: {r: '$: self.result'}
            switch: end
# All three positions, and they say where the gate's boundary falls for a child batch:
#
#   tick 0  nothing spawned    no promise made, so the narrowing is free
#   tick 1  child RUNNING      refused — and knowingly over-refused: this child moves to the
#                              version the parent's target names, which registration already
#                              checked, so nothing it can produce would break. §5.8 of
#                              specs/version-compatibility.md keeps the coarse relation anyway.
#   tick 2  child COMPLETED    refused, and here it is earned: a terminal descendant stays on
#                              the version that ran it, so its stored output would be conformed
#                              under a schema that never promised to accept it.
start: {process: boss, input: {n: 1}}
at:
  - ticks: 0
    resting: {task: call, wait_state: "", version: 1}
    after: {task: call, wait_state: "", version: 2}
    refused: false
  - ticks: 1
    resting: {task: call, wait_state: waiting, version: 1}
    after: {task: call, wait_state: waiting, version: 1}
    refused: {says: 'waiting on a result promised by v1'}
  - ticks: 2
    resting: {task: call, wait_state: collecting, version: 1}
    after: {task: call, wait_state: collecting, version: 1}
    refused: {says: 'waiting on a result promised by v1'}
run: [boss, --from, "1", --to, "2"]
