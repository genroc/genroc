# `why` optional → required-and-nullable: closable for stored state, but a worker's failure
# arrives from outside and is conformed once (`data: {}` is refused), so it is judged strictly.
apply:
  - definitions:
      - name: raisegap
        input_schema:
          type: object
          properties: {n: {type: number}}
          required: [n]
        tasks:
          - id: hold
            action:
              type: external
              input: {n: '$: input.n'}
              result_schema: {}
              raises:
                boom:
                  type: object
                  properties: {why: {type: string}}
            on_error:
              - code: [boom]
                goto: end
            output: {r: '$: self.result'}
            switch: end
  - definitions:
      - name: raisegap
        input_schema:
          type: object
          properties: {n: {type: number}}
          required: [n]
        tasks:
          - id: hold
            action:
              type: external
              input: {n: '$: input.n'}
              result_schema: {}
              # `why` becomes required: a failure the old version accepted without it is refused.
              raises:
                boom:
                  type: object
                  properties: {why: {type: [string, "null"]}}
                  required: [why]
            on_error:
              - code: [boom]
                goto: end
            output: {r: '$: self.result'}
            switch: end
start: {process: raisegap, input: {n: 1}}
at:
  - ticks: 0
    resting: {task: hold, phase: "", version: 1}
    after: {task: hold, phase: "", version: 2}
    refused: false
  - ticks: 1
    resting: {task: hold, phase: external, version: 1}
    after: {task: hold, phase: external, version: 1}
    refused: {says: 'raises.boom'}
run: [raisegap, --from, "1", --to, "2"]
