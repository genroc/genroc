# Structurally identical definitions, but `n` became a string while the instance carries the
# number it started with: only the validator sees it, and migrating would break input_schema.
apply:
  - definitions:
      - name: narrowproc
        input_schema:
          type: object
          properties: {n: {type: number}}
          required: [n]
        tasks:
          - id: first
            action: {type: delay, for: 1}
            output: {v: '$: input.n'}
            switch: next
          - id: second
            output: {w: '$: input.n'}
            switch: end
  - definitions:
      - name: narrowproc
        input_schema:
          type: object
          properties: {n: {type: string}}
          required: [n]
        tasks:
          - id: first
            action: {type: delay, for: 1}
            output: {v: '$: input.n'}
            switch: next
          - id: second
            output: {w: '$: input.n'}
            switch: end
start: {process: narrowproc, input: {n: 2}, ticks: 2, advance_ms: 1000}
resting: {task: second, status: running, version: 1}
after: {task: second, status: running, version: 1}
run: [narrowproc, --from, "1", --to, "2"]
refused: {says: 'at "second": input.n: expected type string'}
