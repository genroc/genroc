# Parked on an external: the arming survives, since both versions promise a holding worker the
# same result contract. `external_input` is bookkeeping no definition declares, so a migration
# that strips what it does not recognise would unpark the row.
apply:
  - definitions:
      - name: parkedproc
        input_schema:
          type: object
          properties: {n: {type: number}}
          required: [n]
        tasks:
          - id: hold
            action: {type: external}
            switch: end
  - definitions:
      - name: parkedproc
        input_schema:
          type: object
          properties: {n: {type: number}, note: {type: [string, "null"]}}
          required: [n]
        tasks:
          - id: hold
            action: {type: external}
            switch: end
# The two positions an external has: on the task with nothing asked, and armed with the
# question out (`external_input` appears).
start: {process: parkedproc, input: {n: 3}}
at:
  - {ticks: 0, resting: {task: hold, phase: ""},         after: {phase: "", state_keys: [input, last_error, outputs]}}
  - {ticks: 1, resting: {task: hold, phase: external},   after: {phase: external, state_keys: [external_input, input, last_error, outputs]}}
after: {task: hold, status: running, version: 2}
run: [parkedproc, --from, "1", --to, "2"]
