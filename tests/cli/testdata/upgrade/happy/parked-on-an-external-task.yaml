# Parked waiting for an outside caller: the state an upgrade is most likely to meet in
# production, because it is the one instances sit in for days.
#
# The arming SURVIVES, and that is the point. A worker may already hold this task, and these two
# versions promise it the same result contract — so what it answers will still be accepted, and
# disturbing it would throw away work for nothing. The sibling case
# refused/result-narrowed-while-a-worker-holds-it is the same state where that does not hold.
#
# The state carries `_external`, engine bookkeeping no definition declares, so this is also what
# would catch a migration that strips what it does not recognise and silently unparks the row.
apply:
  - definitions:
      - name: parkedproc
        input_schema:
          type: object
          properties: {n: {type: number}}
          required: [n]
        tasks:
          - id: hold
            action: {type: external}
            switch: end
  - definitions:
      - name: parkedproc
        input_schema:
          type: object
          properties: {n: {type: number}, note: {type: [string, "null"]}}
          required: [n]
        tasks:
          - id: hold
            action: {type: external}
            switch: end
start: {process: parkedproc, input: {n: 3}, ticks: 1}
resting: {task: hold, status: running, wait_state: external, state_keys: [_external, error, input, outputs]}
after: {task: hold, status: running, wait_state: external, state_keys: [_external, error, input, outputs]}
run: [parkedproc, --from, "1", --to, "2"]
