# Fresh instance, nothing run: the only state the create path builds rather than the engine,
# so a slot it forgot surfaces here. The versions differ by one optional input property.
apply:
  - definitions:
      - name: entryproc
        input_schema:
          type: object
          properties: {n: {type: number}}
          required: [n]
        tasks:
          - id: first
            output: {v: '$: input.n'}
            switch: end
        output: {v: '$: outputs.first.v'}
  - definitions:
      - name: entryproc
        input_schema:
          type: object
          properties: {n: {type: number}, note: {type: [string, "null"]}}
          required: [n]
        tasks:
          - id: first
            output: {v: '$: input.n'}
            switch: end
        output: {v: '$: outputs.first.v'}
start: {process: entryproc, input: {n: 1}, ticks: 0}
resting: {task: first, status: running, phase: "", outputs: [], state_keys: [input, last_error, outputs]}
after: {task: first, status: running, outputs: [], state_keys: [input, last_error, outputs]}
run: [entryproc, --from, "1", --to, "2"]
finish: {status: completed, output: {v: 1}}
