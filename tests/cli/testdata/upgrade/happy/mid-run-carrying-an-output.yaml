# The first state that is the engine's own: `first` ran and projected an output. A document
# comparison cannot tell it from at-entry, hence a real instance.
apply:
  - definitions:
      - name: midproc
        input_schema:
          type: object
          properties: {n: {type: number}}
          required: [n]
        tasks:
          - id: first
            action: {type: delay, for: 1}
            output: {v: '$: input.n'}
            switch: next
          - id: second
            output: {w: '$: outputs.first.v'}
            switch: end
        output: {carried: '$: outputs.first.v'}
  - definitions:
      - name: midproc
        input_schema:
          type: object
          properties: {n: {type: number}, note: {type: [string, "null"]}}
          required: [n]
        tasks:
          - id: first
            action: {type: delay, for: 1}
            output: {v: '$: input.n'}
            switch: next
          - id: second
            output: {w: '$: outputs.first.v'}
            switch: end
        output: {carried: '$: outputs.first.v'}
# Two ticks with the clock moved: the first arms the delay, the second lets it fire.
start: {process: midproc, input: {n: 2}, ticks: 2, advance_ms: 1000}
resting: {task: second, status: running, outputs: [first], state_keys: [input, outputs]}
after: {task: second, status: running, outputs: [first], state_keys: [input, outputs]}
run: [midproc, --from, "1", --to, "2"]
# `first`'s v1 output is the process result, so a migration that dropped it shows a hole here.
finish: {status: completed, output: {carried: 2}}
