# The same move from every state the process passes through. It must transform state: absent
# `note` becomes a required nullable, so the migration writes null, and `values` compares JSON
# (null is not a missing key). Task logic is identical in both versions on purpose.
apply:
  - definitions:
      - name: nullproc
        input_schema:
          type: object
          properties:
            n: {type: number}
            note: {type: string}
          required: [n]
        tasks:
          - id: first
            action: {type: delay, for: 1}
            output: {v: '$: input.n'}
            switch: next
          - id: second
            output: {w: '$: outputs.first.v * 3'}
            switch: next
          - id: third
            action: {type: delay, for: 1}
            output: {z: '$: outputs.second.w + 1'}
            switch: next
          - id: fourth
            output: {q: '$: outputs.third.z * 2'}
            switch: end
        output: {result: '$: outputs.fourth.q'}
  - definitions:
      - name: nullproc
        input_schema:
          type: object
          properties:
            n: {type: number}
            note: {type: [string, "null"]}
          required: [n, note]
        tasks:
          - id: first
            action: {type: delay, for: 1}
            output: {v: '$: input.n'}
            switch: next
          - id: second
            output: {w: '$: outputs.first.v * 3'}
            switch: next
          - id: third
            action: {type: delay, for: 1}
            output: {z: '$: outputs.second.w + 1'}
            switch: next
          - id: fourth
            output: {q: '$: outputs.third.z * 2'}
            switch: end
        output: {result: '$: outputs.fourth.q'}
start: {process: nullproc, input: {n: 2}, advance_ms: 1000}
# Ticks 0 and 1 are both `first` but different states (nothing run vs delay armed); it
# completes at 5, so 4 is the last live position. The `after` below is shared by all.
at:
  - {ticks: 0, resting: {task: first, phase: ""}, after: {outputs: []}}
  - {ticks: 1, resting: {task: first}, after: {outputs: []}}
  - {ticks: 2, resting: {task: second}, after: {outputs: [first]}}
  - {ticks: 3, resting: {task: third}, after: {outputs: [first, second]}}
  - {ticks: 4, resting: {task: fourth}, after: {outputs: [first, second, third]}}
after: {version: 2, values: {input.note: null, input.n: 2}}
finish: {status: completed, output: {result: 14}}
run: [nullproc, --from, "1", --to, "2"]
