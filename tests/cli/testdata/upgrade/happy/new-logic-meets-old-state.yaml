# `second` doubles in v1 and decuples in v2, so the output says which definition ran on state
# that predates it: an upgrade that left the row on v1 passes up to `after` and finishes 4.
apply:
  - definitions:
      - name: laterproc
        input_schema:
          type: object
          properties: {n: {type: number}}
          required: [n]
        tasks:
          - id: first
            action: {type: delay, for: 1}
            output: {v: '$: input.n'}
            switch: next
          - id: second
            output: {w: '$: outputs.first.v * 2'}
            switch: end
        output: {w: '$: outputs.second.w'}
  - definitions:
      - name: laterproc
        input_schema:
          type: object
          properties: {n: {type: number}}
          required: [n]
        tasks:
          - id: first
            action: {type: delay, for: 1}
            output: {v: '$: input.n'}
            switch: next
          - id: second
            output: {w: '$: outputs.first.v * 10'}
            switch: end
        output: {w: '$: outputs.second.w'}
start: {process: laterproc, input: {n: 2}, ticks: 2, advance_ms: 1000}
resting: {task: second, status: running, outputs: [first]}
after: {task: second, status: running, outputs: [first]}
run: [laterproc, --from, "1", --to, "2"]
finish: {status: completed, output: {w: 20}}
