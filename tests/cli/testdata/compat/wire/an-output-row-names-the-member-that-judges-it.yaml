# A task's output bears on the upgrade (later tasks read it), the process's on the contract
# (callers read it). Both `output_schema`s are judged too. The member shows only on the wire.
apply:
  - channel: outrow_a
    definitions:
      - name: outrow_proc
        tasks:
          - id: calc
            output: {n: '$: 1'}
            output_schema: {type: object, properties: {n: {type: number}}, required: [n]}
            switch: end
        output: '$: outputs.calc.n'
        output_schema: {type: number}
  - channel: outrow_b
    definitions:
      - name: outrow_proc
        tasks:
          - id: calc
            output: {n: '$: 1'}
            output_schema: {type: object, properties: {n: {type: number, description: count}}, required: [n]}
            switch: end
        output: '$: outputs.calc.n * 1'
        output_schema: {type: number, description: count}
run: [--from, outrow_a, --to, outrow_b, --json]
expect: |
  {
    "compatible": true,
    "passes": true,
    "processes": [
      {
        "name": "outrow_proc",
        "status": "compared",
        "from": 1,
        "to": 2,
        "upgrade": {
          "compatible": true
        },
        "contract": {
          "compatible": true
        },
        "changed": [
          {
            "address": "output",
            "affects": [
              "contract"
            ]
          },
          {
            "address": "output_schema",
            "affects": [
              "contract"
            ]
          },
          {
            "address": "calc:output_schema",
            "task": "calc",
            "affects": [
              "upgrade"
            ]
          }
        ]
      }
    ]
  }

  exit 0
