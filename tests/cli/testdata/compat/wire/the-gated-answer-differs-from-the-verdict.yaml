# §8: `compatible` (conjunction over everything compared) stays false while `passes` (the
# gated answer) is true and the run exits 0. Per-member verdicts derive from the issues
# (§6c): `upgrade.compatible` true beside `contract.compatible` false.
apply:
  - channel: wiregate_a
    definitions:
      - name: wiregate_proc
        tasks:
          - id: charge
            action:
              type: fetch
              method: post
              url: http://x/charge
              responses:
                200: {type: object, properties: {amount: {type: number}}, required: [amount]}
            output: {amount: '$: self.result.amount'}
            switch: end
        output: {total: '$: outputs.charge.amount'}
  - channel: wiregate_b
    definitions:
      - name: wiregate_proc
        tasks:
          - id: charge
            action:
              type: fetch
              method: post
              url: http://x/charge
              responses:
                200: {type: object, properties: {amount: {type: string}}, required: [amount]}
            output: {amount: '$: self.result.amount'}
            switch: end
        output: {total: '$: outputs.charge.amount'}
run: [--from, wiregate_a, --to, wiregate_b, --ignore, contract, --json]
expect: |
  {
    "compatible": false,
    "passes": true,
    "processes": [
      {
        "name": "wiregate_proc",
        "status": "compared",
        "from": 1,
        "to": 2,
        "upgrade": {
          "compatible": true
        },
        "contract": {
          "compatible": false
        },
        "issues": [
          {
            "member": "contract",
            "address": "charge:fetch.result",
            "task": "charge",
            "path": "amount",
            "message": "number → string",
            "gating": false
          },
          {
            "member": "contract",
            "address": "output",
            "path": "total",
            "message": "number → string",
            "gating": false
          }
        ]
      }
    ]
  }

  exit 0
