# Pins the `--json` wire format (§6d): one edit reaching issues, verdicts, a changed slot and
# an added task. A broken slot is not also in `changed` (§6b, applied as the report is built),
# and `--json` is a rendering, not a mode: the exit code is still 1.
apply:
  - channel: wirefull_a
    definitions:
      - name: wirefull_proc
        tasks:
          - id: charge
            action:
              type: fetch
              method: post
              url: http://x/charge
              responses:
                200: {type: object, properties: {fee: {type: number}}, required: [fee]}
            output: {fee: '$: self.result.fee'}
            switch: next
          - id: settle
            action: {type: fetch, method: post, url: http://x/settle}
            switch: end
  - channel: wirefull_b
    definitions:
      - name: wirefull_proc
        tasks:
          - id: charge
            action:
              type: fetch
              method: post
              url: http://y/charge
              responses:
                200: {type: object, properties: {fee: {type: string}}, required: [fee]}
            output: {fee: '$: self.result.fee'}
            switch: next
          - id: audit
            action: {type: fetch, method: post, url: http://x/audit}
            switch: next
          - id: settle
            action: {type: fetch, method: post, url: http://x/settle}
            switch: end
run: [--from, wirefull_a, --to, wirefull_b, --json]
expect: |
  {
    "compatible": false,
    "passes": false,
    "processes": [
      {
        "name": "wirefull_proc",
        "status": "compared",
        "from": 1,
        "to": 2,
        "upgrade": {
          "compatible": false
        },
        "contract": {
          "compatible": false
        },
        "changed": [
          {
            "address": "charge:fetch.url",
            "task": "charge"
          }
        ],
        "added": [
          "audit"
        ],
        "issues": [
          {
            "member": "contract",
            "address": "charge:fetch.result",
            "task": "charge",
            "path": "fee",
            "message": "number → string",
            "gating": true
          },
          {
            "member": "upgrade",
            "address": "settle",
            "task": "settle",
            "path": "outputs.charge.fee",
            "message": "number → string",
            "gating": true
          }
        ]
      }
    ]
  }

  exit 1
