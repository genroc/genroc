# `--json` prints the report the CLI renders from, and until now nothing asserted it: the
# generated client is typechecked, which proves the shape compiles, not that any field
# carries what it claims. Everything §6d fixes about the wire format is only true if
# something reads it — a finding arrives ADDRESSED, `address` and `path` answer different
# levels and stay separate fields, a verdict is `{compatible}` alone and carries no issues,
# and an `affects` entry is what separates `(ok)` from `(not judged)`.
#
# One edit reaching all four collections at once: two issues from one narrowing (the contract
# at the result schema, the upgrade at the task that reads it — two findings, because they
# gate separately), a changed slot no check covers, and an added task.
#
# Two properties of the payload that only a fixture at this level can hold down.
#
# `charge:fetch.result` broke, so it is NOT in `changed` — §6b's rule is applied where the
# report is built rather than by whoever renders it. `changed` is what is left over, the same
# list in both renderings, and a consumer printing it verbatim cannot end up calling a slot
# merely changed beside the break its own edit produced.
#
# **The exit code is 1**, because `passes` is false. `--json` is a rendering and not a mode:
# the flag that captures the findings must not be the flag that stops failing on them.
apply:
  - channel: wirefull_a
    definitions:
      - name: wirefull_proc
        tasks:
          - id: charge
            action:
              type: fetch
              url: http://x/charge
              result_schema: {type: object, properties: {fee: {type: number}}, required: [fee]}
            output: {fee: '$: self.result.fee'}
            switch: next
          - id: settle
            action: {type: fetch, url: http://x/settle}
            switch: end
  - channel: wirefull_b
    definitions:
      - name: wirefull_proc
        tasks:
          - id: charge
            action:
              type: fetch
              url: http://y/charge
              result_schema: {type: object, properties: {fee: {type: string}}, required: [fee]}
            output: {fee: '$: self.result.fee'}
            switch: next
          - id: audit
            action: {type: fetch, url: http://x/audit}
            switch: next
          - id: settle
            action: {type: fetch, url: http://x/settle}
            switch: end
run: [--from, wirefull_a, --to, wirefull_b, --json]
expect: |
  {
    "compatible": false,
    "passes": false,
    "processes": [
      {
        "name": "wirefull_proc",
        "status": "compared",
        "from": 1,
        "to": 2,
        "upgrade": {
          "compatible": false
        },
        "contract": {
          "compatible": false
        },
        "changed": [
          {
            "address": "charge:fetch.url",
            "task": "charge"
          }
        ],
        "added": [
          "audit"
        ],
        "issues": [
          {
            "member": "contract",
            "address": "charge:fetch.result",
            "task": "charge",
            "path": "fee",
            "message": "number → string",
            "gating": true
          },
          {
            "member": "upgrade",
            "address": "settle",
            "task": "settle",
            "path": "outputs.charge.fee",
            "message": "number → string",
            "gating": true
          }
        ]
      }
    ]
  }

  exit 1
