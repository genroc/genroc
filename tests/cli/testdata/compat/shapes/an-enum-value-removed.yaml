# The message names the removed value, not both pools: a capped list cannot show an absence
# (both truncate to the same five entries here).
apply:
  - channel: enumrm_a
    definitions:
      - name: enumrm_proc
        input_schema:
          type: object
          properties:
            code: {type: string, enum: [aa, bb, cc, dd, ee, ff, gg, hh]}
          required: [code]
        tasks:
          - id: go
            action: {type: fetch, method: post, url: http://x/go}
            switch: end
  - channel: enumrm_b
    definitions:
      - name: enumrm_proc
        input_schema:
          type: object
          properties:
            code: {type: string, enum: [aa, bb, cc, dd, ee, ff, gg]}
          required: [code]
        tasks:
          - id: go
            action: {type: fetch, method: post, url: http://x/go}
            switch: end
run: [--from, enumrm_a, --to, enumrm_b]

expect: |
  enumrm_proc  v1 → v2  breaking: upgrade, contract
    input  (breaking: upgrade, contract)
      code: allows ["hh"] → enum ["aa", "bb", "cc", "dd", "ee", +2 more]

  exit 1
