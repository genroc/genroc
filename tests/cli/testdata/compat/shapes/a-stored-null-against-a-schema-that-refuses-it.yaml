# §2d's second row, and the refusal beside it. The relaxation is a pair — `IsSubsetAsStored`
# decides a gap is closable and the conform closes it — and the gap runs BOTH ways: a version
# change can leave a row holding a null the new schema will not take, not only a key the new
# schema now demands. nullable-input-added.yaml is the demand direction; this is the other,
# which no fixture reached.
#
#   keepnull  `note` is OPTIONAL on the new side, so the null in the row has somewhere to go:
#             the conform removes the key, and absence is valid there. Upgradable. The
#             contract still breaks, because a caller may still send the null and
#             ValidateInput is strict — the same schema answering two questions (§3b).
#   holdnull  `tag` is REQUIRED and non-nullable, so the stored null can be neither kept nor
#             removed. There is no reconciliation to promise, so the relation must refuse it.
#             A relation that tolerated this would report an upgrade that then failed at the
#             conform, which is the failure mode the pair exists to prevent.
#
# One property each, in two processes, because the explainer names one break per schema: put
# both on one input and whichever came first would be the whole report and the other case
# would be pinned by nothing. Two processes with findings is also the only place block
# ordering between non-trivial blocks is asserted.
apply:
  - channel: nullpair_a
    definitions:
      - name: nullpair_keepnull
        input_schema: {type: object, properties: {note: {type: [string, "null"]}}}
        tasks:
          - id: go
            action: {type: fetch, url: http://x/go}
            switch: end
      - name: nullpair_holdnull
        input_schema: {type: object, properties: {tag: {type: [string, "null"]}}, required: [tag]}
        tasks:
          - id: go
            action: {type: fetch, url: http://x/go}
            switch: end
  - channel: nullpair_b
    definitions:
      - name: nullpair_keepnull
        input_schema: {type: object, properties: {note: {type: string}}}
        tasks:
          - id: go
            action: {type: fetch, url: http://x/go}
            switch: end
      - name: nullpair_holdnull
        input_schema: {type: object, properties: {tag: {type: string}}, required: [tag]}
        tasks:
          - id: go
            action: {type: fetch, url: http://x/go}
            switch: end
run: [--from, nullpair_a, --to, nullpair_b]
expect: |
  nullpair_holdnull  v1 → v2  breaking: upgrade, contract
    input  (breaking: upgrade, contract)
      tag: string|null → string

  nullpair_keepnull  v1 → v2  breaking: contract; upgradable
    input  (breaking: contract)
      note: string|null → string

  exit 1
