# Two independent breaks under one address, and both are lines. Neither is discovered by
# fixing the other, so a report naming one sends an operator round the loop once per
# difference — a release each to learn what one comparison already knew.
#
# The relation stops at the first failure when it is answering a bool and keeps walking when
# it is explaining, which is what makes this affordable: nothing pays for the second break
# except the run that is already going to print it.
#
# The two are of different KINDS on purpose — a new requirement and a type change — so a
# block that merged them could not render both. Their ORDER is the walk's and not the
# document's: `required` is checked before the properties, and the properties are taken in
# sorted order, so the list does not move when a schema is reformatted.
apply:
  - channel: twobreak_a
    definitions:
      - name: twobreak_proc
        input_schema:
          type: object
          properties:
            amount: {type: number}
            currency: {type: string}
          required: [amount]
        tasks:
          - id: go
            action: {type: fetch, url: http://x/go}
            switch: end
  - channel: twobreak_b
    definitions:
      - name: twobreak_proc
        input_schema:
          type: object
          properties:
            amount: {type: string}
            currency: {type: string}
          required: [amount, currency]
        tasks:
          - id: go
            action: {type: fetch, url: http://x/go}
            switch: end
run: [--from, twobreak_a, --to, twobreak_b]
expect: |
  twobreak_proc  v1 → v2  breaking: upgrade, contract
    input  (breaking: upgrade, contract)
      currency: newly required field
      amount: number → string

  exit 1
