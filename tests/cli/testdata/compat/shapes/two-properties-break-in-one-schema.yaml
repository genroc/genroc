# Two independent breaks under one address both print. They differ in kind on purpose, and
# their order is the walk's (`required` first, then properties sorted), not the document's.
apply:
  - channel: twobreak_a
    definitions:
      - name: twobreak_proc
        input_schema:
          type: object
          properties:
            amount: {type: number}
            currency: {type: string}
          required: [amount]
        tasks:
          - id: go
            action: {type: fetch, method: post, url: http://x/go}
            switch: end
  - channel: twobreak_b
    definitions:
      - name: twobreak_proc
        input_schema:
          type: object
          properties:
            amount: {type: string}
            currency: {type: string}
          required: [amount, currency]
        tasks:
          - id: go
            action: {type: fetch, method: post, url: http://x/go}
            switch: end
run: [--from, twobreak_a, --to, twobreak_b]
expect: |
  twobreak_proc  v1 → v2  breaking: upgrade, contract
    input  (breaking: upgrade, contract)
      currency: newly required field
      amount: number → string

  exit 1
