# Refused by the server, so every consumer of the endpoint gets the same answer.
apply:
  - channel: noignore_a
    definitions:
      - name: noignore_proc
        tasks:
          - id: go
            action: {type: fetch, method: post, url: http://x/go}
            switch: end
run: [--from, noignore_a, --to, noignore_a, --ignore, upgrade]

expect: |
  --- stderr ---
  genctl: server: cannot ignore "upgrade"; the only member that may be excused is "contract" — the upgrade check answers for rows this deployment already owns

  exit 1
