# A fetch produces one value, so status-set edits are judged as the merged union under
# `<task>:fetch.result`, never per status: an added bodyless 202 widens to `T | null`, and
# 200 restated as 2xx changes nothing but the slot.
apply:
  - channel: statusset_a
    definitions:
      - name: statusset_proc
        tasks:
          - id: go
            action:
              type: fetch
              method: post
              url: http://x/go
              responses:
                200: {type: object, properties: {fee: {type: number}}, required: [fee]}
            output: {fee: "$: self.result.fee"}
            switch: end
  - channel: statusset_b
    definitions:
      - name: statusset_proc
        tasks:
          - id: go
            action:
              type: fetch
              method: post
              url: http://x/go
              responses:
                "2xx": {type: object, properties: {fee: {type: number}}, required: [fee]}
                202: null
            # self.result is now `T | null` (the bodyless 202), so the projection handles the null arm.
            output: {fee: "$: (self.result ?? {fee: 0}).fee"}
            switch: end
run: [--from, statusset_a, --to, statusset_b]
expect: |
  statusset_proc  v1 → v2  upgradable, compatible
    go:output        (ok)
    go:fetch.result  (ok)

  exit 0
