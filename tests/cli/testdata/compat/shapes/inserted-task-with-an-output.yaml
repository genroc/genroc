# The documented false alarm, pinned as EXPECTED: a new main-line output is required at every
# later task even if unread. The fix (demand-pruning) needs to know where an instance sits.
apply:
  - channel: insert_a
    definitions:
      - name: insert_proc
        tasks:
          - id: charge
            action:
              type: fetch
              method: post
              url: http://x/charge
            switch: next
          - id: ship
            action:
              type: fetch
              method: post
              url: http://x/ship
            switch: end
  - channel: insert_b
    definitions:
      - name: insert_proc
        tasks:
          - id: charge
            action:
              type: fetch
              method: post
              url: http://x/charge
            switch: next
          - id: audit
            action:
              type: fetch
              method: post
              url: http://x/audit
            output: {seen: '$: true'}
            switch: next
          - id: ship
            action:
              type: fetch
              method: post
              url: http://x/ship
            switch: end
run: [--from, insert_a, --to, insert_b]

expect: |
  insert_proc  v1 → v2  breaking: upgrade; compatible
    ship   (breaking: upgrade)
      outputs.audit: newly required field
    audit  (added)

  exit 1
