# A narrowing that leaves the type alone must name the constraint (the enum), not print
# `tier: string → string`. Only the first break is named.
apply:
  - channel: narrowc_a
    definitions:
      - name: narrowc_proc
        input_schema: {type: object, properties: {tier: {type: string}}, required: [tier]}
        tasks:
          - id: go
            action: {type: fetch, method: post, url: http://x/go}
            output: {t: '$: input.tier'}
            switch: end
  - channel: narrowc_b
    definitions:
      - name: narrowc_proc
        input_schema: {type: object, properties: {tier: {type: string, enum: [free, paid]}}, required: [tier]}
        tasks:
          - id: go
            action: {type: fetch, method: post, url: http://x/go}
            output: {t: '$: input.tier'}
            switch: end
run: [--from, narrowc_a, --to, narrowc_b]

expect: |
  narrowc_proc  v1 → v2  breaking: upgrade, contract
    input  (breaking: upgrade, contract)
      tier: any string → enum ["free", "paid"]

  exit 1
