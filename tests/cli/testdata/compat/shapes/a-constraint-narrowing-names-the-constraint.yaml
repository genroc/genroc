# A narrowing that does not move the TYPE must still say what narrowed. This block used to
# read `tier: string → string` — a line asserting nothing changed, about a change that breaks
# both questions — because the message came from a walk beside the relation that could only
# render type names. The relation reports the constraint it rejected, so the enum appears.
#
# `maximum` and `minLength` travel the same path; only the first break is named, so one
# property is still the whole report.
apply:
  - channel: narrowc_a
    definitions:
      - name: narrowc_proc
        input_schema: {type: object, properties: {tier: {type: string}}, required: [tier]}
        tasks:
          - id: go
            action: {type: fetch, url: http://x/go}
            output: {t: '$: input.tier'}
            switch: end
  - channel: narrowc_b
    definitions:
      - name: narrowc_proc
        input_schema: {type: object, properties: {tier: {type: string, enum: [free, paid]}}, required: [tier]}
        tasks:
          - id: go
            action: {type: fetch, url: http://x/go}
            output: {t: '$: input.tier'}
            switch: end
run: [--from, narrowc_a, --to, narrowc_b]

expect: |
  PROCESS       UPGRADE   CONTRACT
  narrowc_proc  breaking  breaking

  narrowc_proc v1 → v2
    input  (breaking upgrade and contract)
      tier: any string → enum ["free", "paid"]

  exit 1
