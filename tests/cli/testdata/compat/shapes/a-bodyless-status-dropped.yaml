# Dropping `202: null` narrows the merged union `T | null` to `T`: a remote answering 202 with
# no body stops conforming. Compared per status this is a removed key, reported nowhere; as
# the union it is a plain narrowing under `<task>:fetch.result`.
apply:
  - channel: dropbodyless_a
    definitions:
      - name: dropbodyless_proc
        tasks:
          - id: go
            action:
              type: fetch
              method: post
              url: http://x/go
              responses:
                200: {type: object, properties: {fee: {type: number}}, required: [fee]}
                202: null
            output: {fee: "$: (self.result ?? {fee: 0}).fee"}
            switch: end
  - channel: dropbodyless_b
    definitions:
      - name: dropbodyless_proc
        tasks:
          - id: go
            action:
              type: fetch
              method: post
              url: http://x/go
              responses:
                200: {type: object, properties: {fee: {type: number}}, required: [fee]}
            output: {fee: "$: (self.result ?? {fee: 0}).fee"}
            switch: end
run: [--from, dropbodyless_a, --to, dropbodyless_b]
expect: |
  dropbodyless_proc  v1 → v2  breaking: contract; upgradable
    go:fetch.result  (breaking: contract)
      null is not accepted where object is expected

  exit 1
