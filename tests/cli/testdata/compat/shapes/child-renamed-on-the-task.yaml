# A task now calling a different process needs no rule: the result schema did not move, and
# it is what both registration and collect conform the in-flight child against.
apply:
  - channel: swap_a
    definitions:
      - name: swap_kid
        tasks:
          - id: run
            action:
              type: fetch
              method: post
              url: http://x
              responses:
                200: {type: object, properties: {id: {type: string}}, required: [id]}
            output: {id: '$: self.result.id'}
            switch: end
        output: {id: '$: outputs.run.id'}
      - name: swap_other
        tasks:
          - id: run
            action:
              type: fetch
              method: post
              url: http://z
              responses:
                200: {type: object, properties: {id: {type: string}}, required: [id]}
            output: {id: '$: self.result.id'}
            switch: end
        output: {id: '$: outputs.run.id'}
      - name: swap_boss
        tasks:
          - id: work
            action:
              type: child
              name: swap_kid
              result_schema: {type: object, properties: {id: {type: string}}, required: [id]}
            switch: end
  - channel: swap_b
    definitions:
      - name: swap_kid
        tasks:
          - id: run
            action:
              type: fetch
              method: post
              url: http://x
              responses:
                200: {type: object, properties: {id: {type: string}}, required: [id]}
            output: {id: '$: self.result.id'}
            switch: end
        output: {id: '$: outputs.run.id'}
      - name: swap_other
        tasks:
          - id: run
            action:
              type: fetch
              method: post
              url: http://z
              responses:
                200: {type: object, properties: {id: {type: string}}, required: [id]}
            output: {id: '$: self.result.id'}
            switch: end
        output: {id: '$: outputs.run.id'}
      - name: swap_boss
        tasks:
          - id: work
            action:
              type: child
              name: swap_other
              result_schema: {type: object, properties: {id: {type: string}}, required: [id]}
            switch: end
run: [--from, swap_a, --to, swap_b]

expect: |
  swap_boss   v1 → v2  upgradable, compatible
    work:child.name  (not judged)

  swap_kid    v1       unchanged
  swap_other  v1       unchanged

  exit 0
