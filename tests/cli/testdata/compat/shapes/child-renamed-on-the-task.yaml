# A task that now calls a different process is a different call entirely — and the check
# still needs no rule for it, because the result schema did not move. A parent parked in
# `waiting` holds an instance of `swap_kid`, whose output registration established fits that
# schema; the same schema is what collect will conform it against. Nothing changed for the
# child in flight.
#
# a-renamed-call-is-still-compared.yaml is the same edit with the schema narrowed, where the
# narrowing IS reported. Between them: the name is never the finding, the schema always is.
apply:
  - channel: swap_a
    definitions:
      - name: swap_kid
        tasks:
          - id: run
            action:
              type: fetch
              url: http://x
              result_schema: {type: object, properties: {id: {type: string}}, required: [id]}
            output: {id: '$: self.result.id'}
            switch: end
        output: {id: '$: outputs.run.id'}
      - name: swap_other
        tasks:
          - id: run
            action:
              type: fetch
              url: http://z
              result_schema: {type: object, properties: {id: {type: string}}, required: [id]}
            output: {id: '$: self.result.id'}
            switch: end
        output: {id: '$: outputs.run.id'}
      - name: swap_boss
        tasks:
          - id: work
            action:
              type: child
              name: swap_kid
              result_schema: {type: object, properties: {id: {type: string}}, required: [id]}
            switch: end
  - channel: swap_b
    definitions:
      - name: swap_kid
        tasks:
          - id: run
            action:
              type: fetch
              url: http://x
              result_schema: {type: object, properties: {id: {type: string}}, required: [id]}
            output: {id: '$: self.result.id'}
            switch: end
        output: {id: '$: outputs.run.id'}
      - name: swap_other
        tasks:
          - id: run
            action:
              type: fetch
              url: http://z
              result_schema: {type: object, properties: {id: {type: string}}, required: [id]}
            output: {id: '$: self.result.id'}
            switch: end
        output: {id: '$: outputs.run.id'}
      - name: swap_boss
        tasks:
          - id: work
            action:
              type: child
              name: swap_other
              result_schema: {type: object, properties: {id: {type: string}}, required: [id]}
            switch: end
run: [--from, swap_a, --to, swap_b]

expect: |
  PROCESS     UPGRADE          CONTRACT
  swap_boss   upgradable       compatible
  swap_kid    nothing changed  nothing changed
  swap_other  nothing changed  nothing changed

  swap_boss v1 → v2
    work:child.name  (not judged)

  exit 0
