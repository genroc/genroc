# `config_schema` is judged by NOTHING and reported all the same, which are two decisions
# rather than one — and only the first was ever argued. No verdict covers it: config is
# re-resolved every tick, so nothing persisted corresponds to it, and where it does reach the
# data through `config.x`, step 1 type-checks that expression against the new schema and
# catches more than a comparison could. `region` below is that case and stays.
#
# `api_key` is the one nothing reads, so nothing above catches it — and while the slot was
# absent from the report entirely, dropping it took a `secret: true` off a field with no
# other trace anywhere: two verdicts reading as a pass, no block under them, and a redaction
# that had silently stopped applying. `(not judged)` is exactly the sentence for that, and
# the changed-slot channel exists to say it.
#
# What is NOT claimed by the row is as much of the point: no check looked at this schema, and
# the phrase says so. accepted-hazard-only-once-flipped.yaml is the other slot that carries
# a real consequence no verdict can express.
apply:
  - channel: secret_a
    definitions:
      - name: secret_proc
        config_schema:
          type: object
          properties:
            api_key: {type: string, secret: true}
            region: {type: string}
        tasks:
          - id: go
            action: {type: fetch, url: "http://x/${ config.region ?? 'eu' }"}
            switch: end
  - channel: secret_b
    definitions:
      - name: secret_proc
        config_schema:
          type: object
          properties:
            region: {type: string}
        tasks:
          - id: go
            action: {type: fetch, url: "http://x/${ config.region ?? 'eu' }"}
            switch: end
run: [--from, secret_a, --to, secret_b]
expect: |
  secret_proc  v1 → v2  upgradable, compatible
    config_schema  (not judged)

  exit 0
