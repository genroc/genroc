# config_schema is judged by nothing (re-resolved every tick; `config.x` reads are type-checked
# at step 1) but still reported: dropping the unread `api_key` silently removes a
# `secret: true` redaction, and `(not judged)` is its only trace.
apply:
  - channel: secret_a
    definitions:
      - name: secret_proc
        config_schema:
          type: object
          properties:
            api_key: {type: string, secret: true}
            region: {type: string}
        tasks:
          - id: go
            action: {type: fetch, method: post, url: "http://x/${ config.region ?? 'eu' }"}
            switch: end
  - channel: secret_b
    definitions:
      - name: secret_proc
        config_schema:
          type: object
          properties:
            region: {type: string}
        tasks:
          - id: go
            action: {type: fetch, method: post, url: "http://x/${ config.region ?? 'eu' }"}
            switch: end
run: [--from, secret_a, --to, secret_b]
expect: |
  secret_proc  v1 → v2  upgradable, compatible
    config_schema  (not judged)

  exit 0
