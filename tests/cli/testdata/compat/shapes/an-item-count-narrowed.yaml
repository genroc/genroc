# minItems/maxItems are part of IsSubset: capping an array breaks both questions. Unpinned,
# they were once ignored and the stored value failed at conform instead.
apply:
  - channel: itemc_a
    definitions:
      - name: itemc_proc
        input_schema:
          type: object
          properties:
            tags: {type: array, items: {type: string}}
          required: [tags]
        tasks:
          - id: go
            action: {type: fetch, method: post, url: http://x/go}
            switch: end
  - channel: itemc_b
    definitions:
      - name: itemc_proc
        input_schema:
          type: object
          properties:
            tags: {type: array, items: {type: string}, maxItems: 2}
          required: [tags]
        tasks:
          - id: go
            action: {type: fetch, method: post, url: http://x/go}
            switch: end
run: [--from, itemc_a, --to, itemc_b]

expect: |
  itemc_proc  v1 → v2  breaking: upgrade, contract
    input  (breaking: upgrade, contract)
      tags: no maxItems → maxItems 2

  exit 1
