# `--ignore contract` with no contract break must not print `(ignored)`: beside exit 0 it
# would claim the flag saved the run.
apply:
  - channel: idleign_a
    definitions:
      - name: idleign_proc
        tasks:
          - id: ship
            action: {type: fetch, method: post, url: http://x/ship}
            switch: end
  - channel: idleign_b
    definitions:
      - name: idleign_proc
        tasks:
          - id: ship
            action: {type: fetch, method: post, url: http://y/ship}
            switch: end
run: [--from, idleign_a, --to, idleign_b, --ignore, contract]
expect: |
  idleign_proc  v1 → v2  upgradable, compatible
    ship:fetch.url  (not judged)

  exit 0
