# `--ignore contract` on a run that has no contract break. The flag changes neither what is
# compared nor what is printed, so the only question is whether the report says it was
# applied — and it must not: an `(ignored)` beside an exit 0 that no excusal produced claims
# the flag saved the run, which is how an operator comes to believe a break exists somewhere
# they cannot see. The two fixtures that DO annotate both have a real break to excuse.
apply:
  - channel: idleign_a
    definitions:
      - name: idleign_proc
        tasks:
          - id: ship
            action: {type: fetch, url: http://x/ship}
            switch: end
  - channel: idleign_b
    definitions:
      - name: idleign_proc
        tasks:
          - id: ship
            action: {type: fetch, url: http://y/ship}
            switch: end
run: [--from, idleign_a, --to, idleign_b, --ignore, contract]
expect: |
  idleign_proc  v1 → v2  upgradable, compatible
    ship:fetch.url  (not judged)

  exit 0
