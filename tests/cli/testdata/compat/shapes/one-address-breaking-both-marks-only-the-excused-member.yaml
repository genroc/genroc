# One address failing both questions with only one excused: the row needs per-member clauses
# (§6b), since a single phrase carries one fate.
apply:
  - channel: bothign_a
    definitions:
      - name: bothign_proc
        input_schema: {type: object, properties: {age: {type: [integer, "null"]}}}
        tasks:
          - id: go
            action: {type: fetch, method: post, url: http://x/go}
            output: {a: '$: input.age'}
            switch: end
  - channel: bothign_b
    definitions:
      - name: bothign_proc
        input_schema: {type: object, properties: {age: {type: integer}}, required: [age]}
        tasks:
          - id: go
            action: {type: fetch, method: post, url: http://x/go}
            output: {a: '$: input.age'}
            switch: end
run: [--from, bothign_a, --to, bothign_b, --ignore, contract]

expect: |
  bothign_proc  v1 → v2  breaking: upgrade; ignored: contract
    input  (breaking: upgrade; ignored: contract)
      age: newly required field
      age: integer|null → integer

  exit 1
