# Byte-identical content dedupes on apply (v1 reused, no v2), so both sides resolve to the
# same version and there is nothing to compare.
apply:
  - channel: same_a
    definitions:
      - name: same_proc
        tasks:
          - id: ship
            action:
              type: fetch
              method: post
              url: http://x/ship
            switch: end
  - channel: same_b
    definitions:
      - name: same_proc
        tasks:
          - id: ship
            action:
              type: fetch
              method: post
              url: http://x/ship
            switch: end
run: [--from, same_a, --to, same_b]

expect: |
  same_proc  v1  unchanged

  exit 0
