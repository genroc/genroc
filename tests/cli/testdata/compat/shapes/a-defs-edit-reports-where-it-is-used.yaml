# `$defs` is never an address (§6a): the `User.age` edit is reported where Normalize bakes it
# in, under `input`. $defs is deliberately not in definitionSlots, so this row vanishes if the
# baking stops. `age` gets two lines: required and non-null are independent findings.
apply:
  - channel: defsuse_a
    definitions:
      - name: defsuse_proc
        $defs:
          User: {type: object, properties: {age: {type: [integer, "null"]}}}
        input_schema: {type: object, properties: {user: {$ref: '#/$defs/User'}}, required: [user]}
        tasks:
          - id: go
            action: {type: fetch, method: post, url: http://x/go}
            output: {u: '$: input.user'}
            switch: end
  - channel: defsuse_b
    definitions:
      - name: defsuse_proc
        $defs:
          User: {type: object, properties: {age: {type: integer}}, required: [age]}
        input_schema: {type: object, properties: {user: {$ref: '#/$defs/User'}}, required: [user]}
        tasks:
          - id: go
            action: {type: fetch, method: post, url: http://x/go}
            output: {u: '$: input.user'}
            switch: end
run: [--from, defsuse_a, --to, defsuse_b]

expect: |
  defsuse_proc  v1 → v2  breaking: upgrade, contract
    input  (breaking: upgrade, contract)
      user.age: newly required field
      user.age: integer|null → integer
    $defs  (not judged)

  exit 1
