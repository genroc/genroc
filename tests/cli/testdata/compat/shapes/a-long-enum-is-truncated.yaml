# A break is one line: a large enum pool is truncated, and the remainder count keeps it from
# reading as the whole pool.
apply:
  - channel: bigenum_a
    definitions:
      - name: bigenum_proc
        input_schema:
          type: object
          properties:
            code: {type: string}
          required: [code]
        tasks:
          - id: go
            action: {type: fetch, method: post, url: http://x/go}
            switch: end
  - channel: bigenum_b
    definitions:
      - name: bigenum_proc
        input_schema:
          type: object
          properties:
            code: {type: string, enum: [aa, bb, cc, dd, ee, ff, gg, hh]}
          required: [code]
        tasks:
          - id: go
            action: {type: fetch, method: post, url: http://x/go}
            switch: end
run: [--from, bigenum_a, --to, bigenum_b]

expect: |
  bigenum_proc  v1 → v2  breaking: upgrade, contract
    input  (breaking: upgrade, contract)
      code: any string → enum ["aa", "bb", "cc", "dd", "ee", +3 more]

  exit 1
