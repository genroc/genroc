# A $defs entry nothing references is reported `(not judged)`: no schema bakes it in, so no
# comparison sees it. The edit is a real narrowing on purpose: unjudged for lack of a reader,
# not because it is harmless.
apply:
  - channel: defsfree_a
    definitions:
      - name: defsfree_proc
        $defs:
          Retired: {type: object, properties: {code: {type: string}}}
        input_schema: {type: object, properties: {id: {type: string}}, required: [id]}
        tasks:
          - id: go
            action: {type: fetch, method: post, url: http://x/go}
            switch: end
  - channel: defsfree_b
    definitions:
      - name: defsfree_proc
        $defs:
          Retired: {type: object, properties: {code: {type: integer}}, required: [code]}
        input_schema: {type: object, properties: {id: {type: string}}, required: [id]}
        tasks:
          - id: go
            action: {type: fetch, method: post, url: http://x/go}
            switch: end
run: [--from, defsfree_a, --to, defsfree_b]
expect: |
  defsfree_proc  v1 → v2  upgradable, compatible
    $defs  (not judged)

  exit 0
