# An `--ignore` token naming nothing (a typo) is refused, by the server so every consumer
# agrees: a selection that matched nothing would read as an excusal.
apply:
  - channel: badtoken_a
    definitions:
      - name: badtoken_proc
        tasks:
          - id: go
            action: {type: fetch, method: post, url: http://x/go}
            switch: end
run: [--from, badtoken_a, --to, badtoken_a, --ignore, contarct]
expect: |
  --- stderr ---
  genctl: server: cannot ignore "contarct"; the only member that may be excused is "contract" — the upgrade check answers for rows this deployment already owns

  exit 1
