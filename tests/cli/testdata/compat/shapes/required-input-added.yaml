# An input property old instances never had: refused, naming the property, once at definition
# level rather than per task.
apply:
  - channel: reqin_a
    definitions:
      - name: reqin_proc
        input_schema: {type: object, properties: {order_id: {type: integer}}, required: [order_id]}
        tasks:
          - id: charge
            action:
              type: fetch
              method: post
              url: http://x/charge
            switch: next
          - id: ship
            action:
              type: fetch
              method: post
              url: http://x/ship
            switch: end
  - channel: reqin_b
    definitions:
      - name: reqin_proc
        input_schema: {type: object, properties: {order_id: {type: integer}, currency: {type: string}}, required: [order_id, currency]}
        tasks:
          - id: charge
            action:
              type: fetch
              method: post
              url: http://x/charge
            switch: next
          - id: ship
            action:
              type: fetch
              method: post
              url: http://x/ship
            switch: end
run: [--from, reqin_a, --to, reqin_b]

expect: |
  reqin_proc  v1 → v2  breaking: upgrade, contract
    input  (breaking: upgrade, contract)
      currency: newly required field

  exit 1
