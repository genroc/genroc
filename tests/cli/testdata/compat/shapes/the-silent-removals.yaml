# Removals that are correctly silent, each demanding less of the other party: input_schema,
# result_schema (a read of it would fail validation first, §4), and an input property
# (stripped: §5.1's blind spot). Only removing the process output breaks.
apply:
  - channel: silentrm_a
    definitions:
      - name: silentrm_proc
        input_schema: {type: object, properties: {a: {type: string}, b: {type: string}}, required: [a, b]}
        tasks:
          - id: go
            action:
              type: fetch
              method: post
              url: http://x/go
              responses:
                200: {type: object, properties: {fee: {type: number}}, required: [fee]}
            switch: end
  - channel: silentrm_b
    definitions:
      - name: silentrm_proc
        input_schema: {type: object, properties: {a: {type: string}}, required: [a]}
        tasks:
          - id: go
            action: {type: fetch, method: post, url: http://x/go}
            switch: end
run: [--from, silentrm_a, --to, silentrm_b]

expect: |
  silentrm_proc  v1 → v2  upgradable, compatible
    input            (ok)
    go:fetch.result  (ok)

  exit 0
