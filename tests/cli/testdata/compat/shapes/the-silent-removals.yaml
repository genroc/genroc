# The removals that are correctly silent, in one place so that a later change cannot make
# one of them start reporting without a fixture noticing. All three are the same shape of
# argument — we demand LESS of the other party than we did:
#
#   input_schema dropped   we accept any input now, so no caller is turned away, and a
#                          stored row still fits a schema that requires nothing
#   result_schema dropped  we conform the response less, so the service may send what it
#                          always sent. (A downstream `self.result.x` read would make the
#                          NEW definition invalid, which validation refuses before compat
#                          is reached — §4.)
#   an input property      undeclared imposes nothing, so a caller still sending it is
#   dropped                accepted; the value is stripped, which is §5.1's blind spot
#
# The one removal that does break is the process output — output-removed.yaml.
apply:
  - channel: silentrm_a
    definitions:
      - name: silentrm_proc
        input_schema: {type: object, properties: {a: {type: string}, b: {type: string}}, required: [a, b]}
        tasks:
          - id: go
            action:
              type: fetch
              url: http://x/go
              responses:
                200: {type: object, properties: {fee: {type: number}}, required: [fee]}
            switch: end
  - channel: silentrm_b
    definitions:
      - name: silentrm_proc
        input_schema: {type: object, properties: {a: {type: string}}, required: [a]}
        tasks:
          - id: go
            action: {type: fetch, url: http://x/go}
            switch: end
run: [--from, silentrm_a, --to, silentrm_b]

expect: |
  silentrm_proc  v1 → v2  upgradable, compatible
    input            (ok)
    go:fetch.result  (ok)

  exit 0
