# On re-entry a looping task's row holds its own prior output (`self.previous`), so poll's
# entry context includes `outputs.poll`. A required field added there breaks an instance
# parked at poll on its second lap.
apply:
  - channel: loopslice_a
    definitions:
      - name: loopslice_proc
        tasks:
          - id: poll
            action:
              type: fetch
              method: post
              url: http://x/poll
              responses:
                200: {type: object, properties: {done: {type: boolean}}, required: [done]}
            output:
              tries: '$: (self.previous.tries ?? 0) + 1'
              done: '$: self.result.done'
            switch:
              - {case: 'self.output.done == true', goto: $fin}
              - {goto: $poll}
          - id: fin
            action: {type: fetch, method: post, url: http://x/fin}
            switch: end
  - channel: loopslice_b
    definitions:
      - name: loopslice_proc
        tasks:
          - id: poll
            action:
              type: fetch
              method: post
              url: http://x/poll
              responses:
                200: {type: object, properties: {done: {type: boolean}, at: {type: string}}, required: [done, at]}
            output:
              tries: '$: (self.previous.tries ?? 0) + 1'
              done: '$: self.result.done'
              at: '$: self.result.at'
            switch:
              - {case: 'self.output.done == true', goto: $fin}
              - {goto: $poll}
          - id: fin
            action: {type: fetch, method: post, url: http://x/fin}
            switch: end
run: [--from, loopslice_a, --to, loopslice_b]

expect: |
  loopslice_proc  v1 → v2  breaking: upgrade, contract
    poll               (breaking: upgrade)
      outputs.poll.at: newly required field
    poll:fetch.result  (breaking: contract)
      at: newly required field
    poll:output        (ok)

  exit 1
