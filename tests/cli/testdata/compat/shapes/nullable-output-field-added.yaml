# An added, non-required output field is nullable: an old row lacking the key reads null
# either way. Two readers, one finding.
apply:
  - channel: nullfield_a
    definitions:
      - name: nullfield_proc
        tasks:
          - id: fetch
            action:
              type: fetch
              method: post
              url: http://x/w
              responses:
                200: {type: object, properties: {time: {type: string}}, required: [time]}
            output: {time: "$: self.result.time"}
            switch: next
          - id: report
            action: {type: fetch, method: post, url: http://x/r}
            output: {seen: "$: outputs.fetch.time"}
            switch: next
          - id: archive
            action: {type: fetch, method: post, url: http://x/a}
            switch: end
  - channel: nullfield_b
    definitions:
      - name: nullfield_proc
        tasks:
          - id: fetch
            action:
              type: fetch
              method: post
              url: http://x/w
              responses:
                200:
                  {type: object, properties: {time: {type: string}, extra: {type: number}}, required: [time]}
            output: {time: "$: self.result.time", extra: "$: self.result.extra"}
            switch: next
          - id: report
            action: {type: fetch, method: post, url: http://x/r}
            output: {seen: "$: outputs.fetch.time"}
            switch: next
          - id: archive
            action: {type: fetch, method: post, url: http://x/a}
            switch: end
run: [--from, nullfield_a, --to, nullfield_b]

expect: |
  nullfield_proc  v1 → v2  upgradable, compatible
    fetch:output        (ok)
    fetch:fetch.result  (ok)

  exit 0
