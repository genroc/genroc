# Adding a default narrows every read to non-null, but an old row lacking the key holds null
# (migration writes nulls, never defaults), so a default-only edit is correctly breaking.
apply:
  - channel: defadd_a
    definitions:
      - name: defadd_proc
        input_schema: {type: object, properties: {retries: {type: integer}}}
        tasks:
          - id: plan
            action: {type: fetch, method: post, url: http://x/plan}
            output: {retries: "$: input.retries"}
            switch: next
          - id: run
            action: {type: fetch, method: post, url: http://x/run}
            output: {seen: "$: outputs.plan.retries"}
            switch: end
  - channel: defadd_b
    definitions:
      - name: defadd_proc
        input_schema: {type: object, properties: {retries: {type: integer, default: 3}}}
        tasks:
          - id: plan
            action: {type: fetch, method: post, url: http://x/plan}
            output: {retries: "$: input.retries"}
            switch: next
          - id: run
            action: {type: fetch, method: post, url: http://x/run}
            output: {seen: "$: outputs.plan.retries"}
            switch: end
run: [--from, defadd_a, --to, defadd_b]
expect: |
  defadd_proc  v1 → v2  breaking: upgrade; compatible
    run    (breaking: upgrade)
      outputs.plan.retries: integer|null → integer
    input  (ok)

  exit 1
