# ACCEPTED: only the value moved, so no type did. Old instances keep their default, new ones
# take 5; the changed slot is all there is to report.
apply:
  - channel: defval_a
    definitions:
      - name: defval_proc
        input_schema: {type: object, properties: {retries: {type: integer, default: 3}}}
        tasks:
          - id: plan
            action: {type: fetch, method: post, url: http://x/plan}
            output: {retries: "$: input.retries"}
            switch: end
        output: {retries: "$: outputs.plan.retries"}
  - channel: defval_b
    definitions:
      - name: defval_proc
        input_schema: {type: object, properties: {retries: {type: integer, default: 5}}}
        tasks:
          - id: plan
            action: {type: fetch, method: post, url: http://x/plan}
            output: {retries: "$: input.retries"}
            switch: end
        output: {retries: "$: outputs.plan.retries"}
run: [--from, defval_a, --to, defval_b]
expect: |
  defval_proc  v1 → v2  upgradable, compatible
    input  (ok)

  exit 0
