# `switch: next` routes by position, so a swap reroutes both tasks while every field compares
# equal. Reported once at `tasks`, `(not judged)`. Must not fire for an insertion
# (an-added-task-may-pass.yaml), which shifts positions too.
apply:
  - channel: reorder_a
    definitions:
      - name: reorder_proc
        tasks:
          - id: start
            action: {type: fetch, method: post, url: http://x/start}
            switch: next
          - id: alpha
            action: {type: fetch, method: post, url: http://x/alpha}
            switch: next
          - id: beta
            action: {type: fetch, method: post, url: http://x/beta}
            switch: next
          - id: done
            action: {type: fetch, method: post, url: http://x/done}
            switch: end
  - channel: reorder_b
    definitions:
      - name: reorder_proc
        tasks:
          - id: start
            action: {type: fetch, method: post, url: http://x/start}
            switch: next
          - id: beta
            action: {type: fetch, method: post, url: http://x/beta}
            switch: next
          - id: alpha
            action: {type: fetch, method: post, url: http://x/alpha}
            switch: next
          - id: done
            action: {type: fetch, method: post, url: http://x/done}
            switch: end
run: [--from, reorder_a, --to, reorder_b]
expect: |
  reorder_proc  v1 → v2  upgradable, compatible
    tasks  (not judged)

  exit 0
