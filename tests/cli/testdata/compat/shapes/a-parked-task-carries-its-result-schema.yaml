# The same result narrowing under an `external` (parks: contract AND upgrade) and a `fetch`
# (cannot park: contract only). A difference failing both prints once, named for both.
apply:
  - channel: parked_a
    definitions:
      - name: parked_proc
        tasks:
          - id: call
            action:
              type: fetch
              method: post
              url: http://x/call
              responses:
                200: {type: object, properties: {a: {type: string}}}
            switch: next
          - id: approve
            action:
              type: external
              result_schema: {type: object, properties: {a: {type: string}}}
            switch: end
  - channel: parked_b
    definitions:
      - name: parked_proc
        tasks:
          - id: call
            action:
              type: fetch
              method: post
              url: http://x/call
              responses:
                200: {type: object, properties: {a: {type: string}, b: {type: integer}}, required: [b]}
            switch: next
          - id: approve
            action:
              type: external
              result_schema: {type: object, properties: {a: {type: string}, b: {type: integer}}, required: [b]}
            switch: end
run: [--from, parked_a, --to, parked_b]

expect: |
  parked_proc  v1 → v2  breaking: upgrade, contract
    call:fetch.result        (breaking: contract)
      b: newly required field
    approve:external.result  (breaking: upgrade, contract)
      b: newly required field

  exit 1
