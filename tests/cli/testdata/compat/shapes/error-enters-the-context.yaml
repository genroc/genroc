# Rerouting `handle` behind `go`'s on_error adds `error` to its context, which no stored row
# there holds. The break comes from must-analysis over routes, not a written schema; the
# routing slots themselves stay `(not judged)`.
apply:
  - channel: errctx_a
    definitions:
      - name: errctx_proc
        tasks:
          - id: go
            action: {type: fetch, method: post, url: http://x/go}
            switch: next
          - id: handle
            action: {type: fetch, method: post, url: http://x/handle}
            output: {n: '$: 1'}
            switch: end
  - channel: errctx_b
    definitions:
      - name: errctx_proc
        tasks:
          - id: go
            action: {type: fetch, method: post, url: http://x/go}
            on_error:
              - code: [http.%]
                goto: $handle
            switch: end
          - id: handle
            action: {type: fetch, method: post, url: http://x/handle}
            output: {n: '$: 1', code: '$: last_error.code'}
            switch: end
run: [--from, errctx_a, --to, errctx_b]

expect: |
  errctx_proc  v1 → v2  breaking: upgrade; compatible
    handle         (breaking: upgrade)
      last_error: newly required field
    go:switch      (not judged)
    go:on_error    (not judged)
    handle:output  (ok)

  exit 1
