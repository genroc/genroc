# The output contract gets no relaxation: a consumer's conform rejects an absent required key
# however nullable its type. Only the contract moves; the task keeps projecting `note`.
apply:
  - channel: nullout_a
    definitions:
      - name: nullout_proc
        tasks:
          - id: fetch
            action:
              type: fetch
              method: post
              url: http://x/w
              responses:
                200: {type: object, properties: {id: {type: string}, note: {type: string}}, required: [id]}
            output: {id: "$: self.result.id", note: "$: self.result.note"}
            switch: end
        output: {id: "$: outputs.fetch.id", note: "$: outputs.fetch.note"}
  - channel: nullout_b
    definitions:
      - name: nullout_proc
        tasks:
          - id: fetch
            action:
              type: fetch
              method: post
              url: http://x/w
              responses:
                200: {type: object, properties: {id: {type: string}, note: {type: string}}, required: [id]}
            output: {id: "$: self.result.id", note: "$: self.result.note"}
            switch: end
        output: {id: "$: outputs.fetch.id"}
run: [--from, nullout_a, --to, nullout_b]
expect: |
  nullout_proc  v1 → v2  breaking: contract; upgradable
    output  (breaking: contract)
      note: no longer guaranteed

  exit 1
