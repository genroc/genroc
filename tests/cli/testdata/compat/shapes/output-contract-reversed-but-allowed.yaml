# Excused: the verdict stays `breaking (ignored)`, the break still prints, and a trailing line
# names the flag. A selection moves only the exit code.
apply:
  - channel: allowed_a
    definitions:
      - name: allowed_proc
        tasks:
          - id: charge
            action:
              type: fetch
              method: post
              url: http://x/charge
              responses:
                200: {type: object, properties: {amount: {type: number}}, required: [amount]}
            output: {amount: '$: self.result.amount'}
            switch: end
        output: {total: '$: outputs.charge.amount'}
  - channel: allowed_b
    definitions:
      - name: allowed_proc
        tasks:
          - id: charge
            action:
              type: fetch
              method: post
              url: http://x/charge
              responses:
                200: {type: object, properties: {amount: {type: string}}, required: [amount]}
            output: {amount: '$: self.result.amount'}
            switch: end
        output: {total: '$: outputs.charge.amount'}
run: [--from, allowed_a, --to, allowed_b, --ignore, contract]

expect: |
  allowed_proc  v1 → v2  ignored: contract; upgradable
    charge:fetch.result  (ignored: contract)
      amount: number → string
    output               (ignored: contract)
      total: number → string

  exit 0
