# The same break, excused. `--ignore contract` is for an operator who has already dealt with
# the consumers — but the report does not become a different report: the verdict word stays
# `breaking`, carries `(ignored)` beside it so the column does not contradict `exit 0`, the
# break still prints, and a trailing line names the flag that let it pass. A selection moves
# the exit code and nothing else.
apply:
  - channel: allowed_a
    definitions:
      - name: allowed_proc
        tasks:
          - id: charge
            action:
              type: fetch
              url: http://x/charge
              result_schema: {type: object, properties: {amount: {type: number}}, required: [amount]}
            output: {amount: '$: self.result.amount'}
            switch: end
        output: {total: '$: outputs.charge.amount'}
  - channel: allowed_b
    definitions:
      - name: allowed_proc
        tasks:
          - id: charge
            action:
              type: fetch
              url: http://x/charge
              result_schema: {type: object, properties: {amount: {type: string}}, required: [amount]}
            output: {amount: '$: self.result.amount'}
            switch: end
        output: {total: '$: outputs.charge.amount'}
run: [--from, allowed_a, --to, allowed_b, --ignore, contract]

expect: |
  allowed_proc  v1 → v2  ignored: contract; upgradable
    charge:fetch.result  (ignored: contract)
      amount: number → string
    output               (ignored: contract)
      total: number → string

  exit 0
