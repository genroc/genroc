# A type change is judged on parking alone: ask (fetch → external) is fine, since a fetch never
# parks; wait (external → fetch) strands a parked instance. Consequent slots (the new `url`)
# are not listed beside their cause.
apply:
  - channel: typeswap_a
    definitions:
      - name: typeswap_proc
        tasks:
          - id: ask
            action:
              type: fetch
              method: post
              url: http://x/ask
              responses:
                200: {type: object, properties: {ok: {type: boolean}}, required: [ok]}
            output: {ok: '$: self.result.ok'}
            switch: next
          - id: wait
            action:
              type: external
              result_schema: {type: object, properties: {note: {type: string}}, required: [note]}
            output: {note: '$: self.result.note'}
            switch: end
  - channel: typeswap_b
    definitions:
      - name: typeswap_proc
        tasks:
          - id: ask
            action:
              type: external
              result_schema: {type: object, properties: {ok: {type: boolean}}, required: [ok]}
            output: {ok: '$: self.result.ok'}
            switch: next
          - id: wait
            action:
              type: fetch
              method: post
              url: http://x/wait
              responses:
                200: {type: object, properties: {note: {type: string}}, required: [note]}
            output: {note: '$: self.result.note'}
            switch: end
run: [--from, typeswap_a, --to, typeswap_b]

expect: |
  typeswap_proc  v1 → v2  breaking: upgrade; compatible
    wait:action.type  (breaking: upgrade)
      external → fetch; an instance sitting there was left by an action the new type cannot take over from
    ask:action.type   (not judged)

  exit 1
