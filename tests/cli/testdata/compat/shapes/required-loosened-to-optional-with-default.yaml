# Not a break: a defaulted optional is present after a conform, so reads stay non-null on
# both sides.
apply:
  - channel: reqloose_a
    definitions:
      - name: reqloose_proc
        input_schema: {type: object, properties: {retries: {type: integer}}, required: [retries]}
        tasks:
          - id: plan
            action: {type: fetch, method: post, url: http://x/plan}
            output: {retries: "$: input.retries"}
            switch: end
        output: {retries: "$: outputs.plan.retries"}
  - channel: reqloose_b
    definitions:
      - name: reqloose_proc
        input_schema: {type: object, properties: {retries: {type: integer, default: 3}}}
        tasks:
          - id: plan
            action: {type: fetch, method: post, url: http://x/plan}
            output: {retries: "$: input.retries"}
            switch: end
        output: {retries: "$: outputs.plan.retries"}
run: [--from, reqloose_a, --to, reqloose_b]
expect: |
  reqloose_proc  v1 → v2  upgradable, compatible
    input  (ok)

  exit 0
