# Made required, the projected field is non-null, which an old row lacking the key cannot
# satisfy. Reported once though two tasks see it: it is about the value, not the reader.
apply:
  - channel: reqfield_a
    definitions:
      - name: reqfield_proc
        tasks:
          - id: fetch
            action:
              type: fetch
              method: post
              url: http://x/w
              responses:
                200: {type: object, properties: {time: {type: string}}, required: [time]}
            output: {time: "$: self.result.time"}
            switch: next
          - id: report
            action: {type: fetch, method: post, url: http://x/r}
            output: {seen: "$: outputs.fetch.time"}
            switch: next
          - id: archive
            action: {type: fetch, method: post, url: http://x/a}
            switch: end
  - channel: reqfield_b
    definitions:
      - name: reqfield_proc
        tasks:
          - id: fetch
            action:
              type: fetch
              method: post
              url: http://x/w
              responses:
                200:
                  {type: object, properties: {time: {type: string}, extra: {type: number}}, required: [time, extra]}
            output: {time: "$: self.result.time", extra: "$: self.result.extra"}
            switch: next
          - id: report
            action: {type: fetch, method: post, url: http://x/r}
            output: {seen: "$: outputs.fetch.time"}
            switch: next
          - id: archive
            action: {type: fetch, method: post, url: http://x/a}
            switch: end
run: [--from, reqfield_a, --to, reqfield_b]

expect: |
  reqfield_proc  v1 → v2  breaking: upgrade, contract
    fetch:fetch.result  (breaking: contract)
      extra: newly required field
    report              (breaking: upgrade)
      outputs.fetch.extra: newly required field
    fetch:output        (ok)

  exit 1
