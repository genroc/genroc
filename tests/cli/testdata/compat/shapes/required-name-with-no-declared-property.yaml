# A `required` name with no declared property has no type to call nullable, so the gap is
# unclosable and refused. It once panicked the handler; schematest pins the relation, this
# pins the endpoint.
apply:
  - channel: ghost_a
    definitions:
      - name: ghost_proc
        input_schema: {type: object, properties: {a: {type: string}}, required: [a]}
        tasks:
          - id: ship
            action: {type: fetch, method: post, url: http://x}
            switch: end
  - channel: ghost_b
    definitions:
      - name: ghost_proc
        input_schema: {type: object, properties: {a: {type: string}}, required: [a, ghost]}
        tasks:
          - id: ship
            action: {type: fetch, method: post, url: http://x}
            switch: end
run: [--from, ghost_a, --to, ghost_b]

expect: |
  ghost_proc  v1 → v2  breaking: upgrade, contract
    input  (breaking: upgrade, contract)
      ghost: newly required field

  exit 1
