# A renamed call needs no rule of its own: registration proved the old child fits the old
# schema and old ⊆ new carries it across (§2f), so only the narrowing is reported. Refusing
# renames would be an unexcusable break: there is no `--ignore upgrade`.
apply:
  - channel: renamed_a
    definitions:
      - name: renamed_one
        tasks:
          - id: run
            action:
              type: fetch
              method: post
              url: http://x/one
              responses:
                200: {type: object, properties: {id: {type: string}, x: {type: integer}}, required: [id, x]}
            output: {id: '$: self.result.id', x: '$: self.result.x'}
            switch: end
        output: {id: '$: outputs.run.id', x: '$: outputs.run.x'}
      - name: renamed_two
        tasks:
          - id: run
            action:
              type: fetch
              method: post
              url: http://x/two
              responses:
                200: {type: object, properties: {id: {type: string}, x: {type: integer}}, required: [id, x]}
            output: {id: '$: self.result.id', x: '$: self.result.x'}
            switch: end
        output: {id: '$: outputs.run.id', x: '$: outputs.run.x'}
      - name: renamed_boss
        tasks:
          - id: each
            action:
              type: child_list
              name: renamed_one
              over: '$: [1, 2]'
              result_schema: {type: object, properties: {id: {type: string}}}
            switch: next
          - id: fan
            action:
              type: child_map
              children:
                a: {name: renamed_one, result_schema: {type: object, properties: {id: {type: string}}}}
            switch: end
  - channel: renamed_b
    definitions:
      - name: renamed_one
        tasks:
          - id: run
            action:
              type: fetch
              method: post
              url: http://x/one
              responses:
                200: {type: object, properties: {id: {type: string}, x: {type: integer}}, required: [id, x]}
            output: {id: '$: self.result.id', x: '$: self.result.x'}
            switch: end
        output: {id: '$: outputs.run.id', x: '$: outputs.run.x'}
      - name: renamed_two
        tasks:
          - id: run
            action:
              type: fetch
              method: post
              url: http://x/two
              responses:
                200: {type: object, properties: {id: {type: string}, x: {type: integer}}, required: [id, x]}
            output: {id: '$: self.result.id', x: '$: self.result.x'}
            switch: end
        output: {id: '$: outputs.run.id', x: '$: outputs.run.x'}
      - name: renamed_boss
        tasks:
          - id: each
            action:
              type: child_list
              name: renamed_two
              over: '$: [1, 2]'
              result_schema: {type: object, properties: {id: {type: string}, x: {type: integer}}, required: [x]}
            switch: next
          - id: fan
            action:
              type: child_map
              children:
                a: {name: renamed_two, result_schema: {type: object, properties: {id: {type: string}, x: {type: integer}}, required: [x]}}
            switch: end
run: [--from, renamed_a, --to, renamed_b]

expect: |
  renamed_boss  v1 → v2  breaking: upgrade, contract
    each:child_list.result  (breaking: upgrade, contract)
      x: newly required field
    fan:child_map.a.result  (breaking: upgrade, contract)
      x: newly required field
    each:child_list.name    (not judged)
    fan:child_map.a.name    (not judged)

  renamed_one   v1       unchanged
  renamed_two   v1       unchanged

  exit 1
