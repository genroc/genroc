# Adding an input schema breaks both: a caller sending nothing is rejected (contract), and an
# old row holding no input cannot satisfy it (upgrade). An added output stays silent.
apply:
  - channel: inadd_a
    definitions:
      - name: inadd_proc
        tasks:
          - id: go
            action: {type: fetch, method: post, url: http://x/go}
            switch: end
  - channel: inadd_b
    definitions:
      - name: inadd_proc
        input_schema: {type: object, properties: {a: {type: string}}, required: [a]}
        tasks:
          - id: go
            action: {type: fetch, method: post, url: http://x/go}
            switch: end
run: [--from, inadd_a, --to, inadd_b]

expect: |
  inadd_proc  v1 → v2  breaking: upgrade, contract
    input  (breaking: upgrade, contract)
      newly required field

  exit 1
