# A KNOWN FALSE ALARM, pinned so that fixing it is a deliberate flip rather than a surprise.
# The reverse edit is refused — yet every stored input already carries the key, because
# creation conforms the input once and persists the filled default. The comparison reads two
# documents and never an instance, so it cannot see that. The new side cannot keep the default
# beside `required`: the pair is refused outright now (schema.CheckDoc), since a default there
# could never apply. internal/schema/CLAUDE.md argues the coordinated relation-and-fill change
# that would close this.
apply:
  - channel: reqtight_a
    definitions:
      - name: reqtight_proc
        input_schema: {type: object, properties: {retries: {type: integer, default: 3}}}
        tasks:
          - id: plan
            action: {type: fetch, method: post, url: http://x/plan}
            output: {retries: "$: input.retries"}
            switch: end
        output: {retries: "$: outputs.plan.retries"}
  - channel: reqtight_b
    definitions:
      - name: reqtight_proc
        input_schema:
          {type: object, properties: {retries: {type: integer}}, required: [retries]}
        tasks:
          - id: plan
            action: {type: fetch, method: post, url: http://x/plan}
            output: {retries: "$: input.retries"}
            switch: end
        output: {retries: "$: outputs.plan.retries"}
run: [--from, reqtight_a, --to, reqtight_b]
expect: |
  reqtight_proc  v1 → v2  breaking: contract; upgradable
    input  (breaking: contract)
      retries: newly required field

  exit 1
