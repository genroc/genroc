# KNOWN FALSE ALARM, pinned so a fix is a deliberate flip: every stored input already carries
# the defaulted key, but compat never reads an instance. The new side drops the default
# because CheckDoc refuses it beside `required`; internal/schema/CLAUDE.md has the fix.
apply:
  - channel: reqtight_a
    definitions:
      - name: reqtight_proc
        input_schema: {type: object, properties: {retries: {type: integer, default: 3}}}
        tasks:
          - id: plan
            action: {type: fetch, method: post, url: http://x/plan}
            output: {retries: "$: input.retries"}
            switch: end
        output: {retries: "$: outputs.plan.retries"}
  - channel: reqtight_b
    definitions:
      - name: reqtight_proc
        input_schema:
          {type: object, properties: {retries: {type: integer}}, required: [retries]}
        tasks:
          - id: plan
            action: {type: fetch, method: post, url: http://x/plan}
            output: {retries: "$: input.retries"}
            switch: end
        output: {retries: "$: outputs.plan.retries"}
run: [--from, reqtight_a, --to, reqtight_b]
expect: |
  reqtight_proc  v1 → v2  breaking: contract; upgradable
    input  (breaking: contract)
      retries: newly required field

  exit 1
