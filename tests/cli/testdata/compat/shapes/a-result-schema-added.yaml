# An added result schema has nothing to pair with, so it is reported directly (§3a), with no
# path: under an `external` (approve) it breaks both, under a fetch (call) only the contract.
# `result_schema: {}` is not an addition: it accepts everything (specs/unknown-type.md).
apply:
  - channel: addres_a
    definitions:
      - name: addres_proc
        tasks:
          - id: approve
            action: {type: external}
            switch: next
          - id: call
            action: {type: fetch, method: post, url: http://x/call}
            switch: next
          - id: note
            action: {type: external}
            switch: end
  - channel: addres_b
    definitions:
      - name: addres_proc
        tasks:
          - id: approve
            action:
              type: external
              result_schema: {type: object, properties: {ok: {type: boolean}}, required: [ok]}
            switch: next
          - id: call
            action:
              type: fetch
              method: post
              url: http://x/call
              responses:
                200: {type: object, properties: {fee: {type: number}}, required: [fee]}
            switch: next
          - id: note
            action:
              type: external
              result_schema: {}
            switch: end
run: [--from, addres_a, --to, addres_b]

expect: |
  addres_proc  v1 → v2  breaking: upgrade, contract
    approve:external.result  (breaking: upgrade, contract)
      added; a result written against the version that declared none may not satisfy it
    call:fetch.result        (breaking: contract)
      added; a result written against the version that declared none may not satisfy it
    note:external.result     (ok)

  exit 1
