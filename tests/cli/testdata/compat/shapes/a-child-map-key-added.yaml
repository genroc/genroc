# child_map keys do not mirror (compat-command.md §2b): added `c` is a guarantee a parent
# spawned before it cannot hold, reported directly; dropped `b` breaks nothing (its orphan
# output is stripped) but is a changed slot. Addressed per key: `fan:child_map.c`.
apply:
  - channel: mapkeys_a
    definitions:
      - name: mapkeys_kid
        tasks:
          - id: run
            action:
              type: fetch
              method: post
              url: http://x/kid
              responses:
                200: {type: object, properties: {id: {type: string}}, required: [id]}
            output: {id: '$: self.result.id'}
            switch: end
        output: {id: '$: outputs.run.id'}
      - name: mapkeys_proc
        tasks:
          - id: fan
            action:
              type: child_map
              children:
                a: {name: mapkeys_kid, result_schema: {type: object, properties: {id: {type: string}}}}
                b: {name: mapkeys_kid, result_schema: {type: object, properties: {id: {type: string}}}}
            switch: end
  - channel: mapkeys_b
    definitions:
      - name: mapkeys_kid
        tasks:
          - id: run
            action:
              type: fetch
              method: post
              url: http://x/kid
              responses:
                200: {type: object, properties: {id: {type: string}}, required: [id]}
            output: {id: '$: self.result.id'}
            switch: end
        output: {id: '$: outputs.run.id'}
      - name: mapkeys_proc
        tasks:
          - id: fan
            action:
              type: child_map
              children:
                a: {name: mapkeys_kid, result_schema: {type: object, properties: {id: {type: string}}}}
                c: {name: mapkeys_kid, result_schema: {type: object, properties: {id: {type: string}}, required: [id]}}
            switch: end
run: [--from, mapkeys_a, --to, mapkeys_b]

expect: |
  mapkeys_kid   v1       unchanged
  mapkeys_proc  v1 → v2  breaking: upgrade; compatible
    fan:child_map.c  (breaking: upgrade)
      added; a parent already collecting spawned no child for it
    fan:child_map.b  (not judged)

  exit 1
