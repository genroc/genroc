# `{}` → declared runs the pairing (`{}` is the top type, not absence): open breaks both
# members; close (declared → {}) is free. Treating `{}` as "nothing declared" would make open
# read as an addition, or silent.
apply:
  - channel: topnarrow_a
    definitions:
      - name: topnarrow_proc
        tasks:
          - id: open
            action: {type: external, result_schema: {}}
            switch: next
          - id: close
            action:
              type: external
              result_schema: {type: object, properties: {ok: {type: boolean}}, required: [ok]}
            switch: end
  - channel: topnarrow_b
    definitions:
      - name: topnarrow_proc
        tasks:
          - id: open
            action:
              type: external
              result_schema: {type: object, properties: {ok: {type: boolean}}, required: [ok]}
            switch: next
          - id: close
            action: {type: external, result_schema: {}}
            switch: end
run: [--from, topnarrow_a, --to, topnarrow_b]
expect: |
  topnarrow_proc  v1 → v2  breaking: upgrade, contract
    open:external.result   (breaking: upgrade, contract)
      unknown is not accepted where object is expected
    close:external.result  (ok)

  exit 1
