# self.status and self.headers are never persisted, so they have no upgrade surface.
# Widening accepted_status leaves both types unchanged, so only the slot is reported.
apply:
  - channel: respmeta_a
    definitions:
      - name: respmeta_proc
        tasks:
          - id: call
            action:
              type: fetch
              method: post
              url: http://x/call
              accepted_status: ["200"]
              responses:
                "2xx": {}
            output:
              code: "$: self.status"
              ctype: "$: self.headers['content-type']"
            switch: end
  - channel: respmeta_b
    definitions:
      - name: respmeta_proc
        tasks:
          - id: call
            action:
              type: fetch
              method: post
              url: http://x/call
              accepted_status: ["200", "202"]
              responses:
                "2xx": {}
            output:
              code: "$: self.status"
              ctype: "$: self.headers['content-type']"
            switch: end
run: [--from, respmeta_a, --to, respmeta_b]
expect: |
  respmeta_proc  v1 → v2  upgradable, compatible
    call:fetch.accepted_status  (not judged)

  exit 0
