# ACCEPTED, and the fixture §6b names as going with the decision to leave `config_schema`
# out of the check entirely. Both costs it records are here in one edit: a `secret: true`
# dropped from config is reported NOWHERE, and a document whose only change is its config
# comes back with no findings at all — true of everything compat judges, false of the
# document in front of the operator.
#
# What that looks like is the whole point of pinning it: two verdicts that read as a pass,
# and no block under them, from a comparison that never examined the thing that moved. Note
# it is `upgradable / compatible` rather than the `nothing changed` §6b predicts — the row
# WAS compared, and everything compat compares really is unchanged.
#
# The argument for accepting them is that the better check already runs earlier: config
# reaches the data only through `config.x`, and step 1 type-checks every expression against
# the new config schema, so dropping a field something READS is refused there, naming the
# task. `region` below is that field and stays; `api_key` is read by nothing, which is
# exactly the blind spot — a redaction that silently stopped applying.
#
# accepted-hazard-only-once-flipped.yaml is the sibling. Both exist so that closing the gap
# is a deliberate flip of a recorded expectation rather than a surprise in a diff.
apply:
  - channel: secret_a
    definitions:
      - name: secret_proc
        config_schema:
          type: object
          properties:
            api_key: {type: string, secret: true}
            region: {type: string}
        tasks:
          - id: go
            action: {type: fetch, url: "http://x/${ config.region ?? 'eu' }"}
            switch: end
  - channel: secret_b
    definitions:
      - name: secret_proc
        config_schema:
          type: object
          properties:
            region: {type: string}
        tasks:
          - id: go
            action: {type: fetch, url: "http://x/${ config.region ?? 'eu' }"}
            switch: end
run: [--from, secret_a, --to, secret_b]
expect: |
  PROCESS      UPGRADE     CONTRACT
  secret_proc  upgradable  compatible

  exit 0
