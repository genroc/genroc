# ACCEPTED, not a bug. isSubset never inspects `secret`, so a property that stops being
# secret compares equal and becomes visible over the API for data stored long before the
# change. The config_schema slot is the ONLY thing that reports it, which is what this
# case holds in place.
apply:
  - channel: secret_a
    definitions:
      - name: secret_proc
        config_schema: {type: object, properties: {e2e_token: {type: string, secret: true}}, required: [e2e_token]}
        tasks:
          - id: go
            action:
              type: fetch
              url: http://x/${ config.e2e_token }
            switch: end
  - channel: secret_b
    definitions:
      - name: secret_proc
        config_schema: {type: object, properties: {e2e_token: {type: string}}, required: [e2e_token]}
        tasks:
          - id: go
            action:
              type: fetch
              url: http://x/${ config.e2e_token }
            switch: end
run: [--from, secret_a, --to, secret_b]

expect: |
  PROCESS      VERDICT
  secret_proc  upgradable

  exit 0
