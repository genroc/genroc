# Removing the process output is the one removal that breaks, and it is not a schema
# comparison: there is no new schema to compare the old one against, so it is reported
# directly the way a removed task is. A waiting parent conforms this value against its own
# result_schema at collect and would now get nothing.
#
# Its mirror is free and stays silent — a process that produced nothing and now produces
# something breaks no consumer, because none could have been written against a value that
# was never there. The other removals are silent for the same shape of reason: dropping the
# input schema means we accept anything, dropping a result_schema means we conform less.
apply:
  - channel: outrm_a
    definitions:
      - name: outrm_proc
        tasks:
          - id: go
            action:
              type: fetch
              url: http://x/go
              result_schema: {type: object, properties: {fee: {type: number}}, required: [fee]}
            output: {fee: '$: self.result.fee'}
            switch: end
        output: {fee: '$: outputs.go.fee'}
  - channel: outrm_b
    definitions:
      - name: outrm_proc
        tasks:
          - id: go
            action:
              type: fetch
              url: http://x/go
              result_schema: {type: object, properties: {fee: {type: number}}, required: [fee]}
            output: {fee: '$: self.result.fee'}
            switch: end
run: [--from, outrm_a, --to, outrm_b]

expect: |
  outrm_proc  v1 → v2  breaking: contract; upgradable
    output  (breaking: contract)
      removed; consumers were written against it

  exit 1
