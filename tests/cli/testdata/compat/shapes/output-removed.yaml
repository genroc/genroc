# Removing the process output breaks (a waiting parent's collect now gets nothing) and is
# reported directly, with no new schema to compare. Adding one is silent: no consumer can
# have been written against a value never produced.
apply:
  - channel: outrm_a
    definitions:
      - name: outrm_proc
        tasks:
          - id: go
            action:
              type: fetch
              method: post
              url: http://x/go
              responses:
                200: {type: object, properties: {fee: {type: number}}, required: [fee]}
            output: {fee: '$: self.result.fee'}
            switch: end
        output: {fee: '$: outputs.go.fee'}
  - channel: outrm_b
    definitions:
      - name: outrm_proc
        tasks:
          - id: go
            action:
              type: fetch
              method: post
              url: http://x/go
              responses:
                200: {type: object, properties: {fee: {type: number}}, required: [fee]}
            output: {fee: '$: self.result.fee'}
            switch: end
run: [--from, outrm_a, --to, outrm_b]

expect: |
  outrm_proc  v1 → v2  breaking: contract; upgradable
    output  (breaking: contract)
      removed; consumers were written against it

  exit 1
