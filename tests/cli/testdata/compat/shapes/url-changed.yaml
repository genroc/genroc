# A URL change moves no shape in flight, so it stays compatible, but is reported as a changed
# slot: a typo fix and a different service look the same.
apply:
  - channel: url_a
    definitions:
      - name: url_proc
        tasks:
          - id: ship
            action:
              type: fetch
              method: post
              url: http://x/ship
            switch: end
  - channel: url_b
    definitions:
      - name: url_proc
        tasks:
          - id: ship
            action:
              type: fetch
              method: post
              url: http://y/ship
            switch: end
run: [--from, url_a, --to, url_b]

expect: |
  url_proc  v1 → v2  upgradable, compatible
    ship:fetch.url  (not judged)

  exit 0
