# A union losing a variant must name it (§2e), not print `object → object`: scalar drops from
# a `type` list, variant from a `oneOf` of objects, described by property list. Neither input
# is read by a task, so no context finding can be confused with these.
apply:
  - channel: union_a
    definitions:
      - name: union_scalar
        input_schema: {type: object, properties: {id: {type: [string, integer]}}, required: [id]}
        tasks:
          - id: go
            action: {type: fetch, method: post, url: http://x/go}
            switch: end
      - name: union_variant
        input_schema:
          type: object
          properties:
            event:
              oneOf:
                - {type: object, properties: {sent_at: {type: string}}, required: [sent_at]}
                - {type: object, properties: {failed_code: {type: integer}}, required: [failed_code]}
          required: [event]
        tasks:
          - id: go
            action: {type: fetch, method: post, url: http://x/go}
            switch: end
  - channel: union_b
    definitions:
      - name: union_scalar
        input_schema: {type: object, properties: {id: {type: string}}, required: [id]}
        tasks:
          - id: go
            action: {type: fetch, method: post, url: http://x/go}
            switch: end
      - name: union_variant
        input_schema:
          type: object
          properties:
            event:
              oneOf:
                - {type: object, properties: {sent_at: {type: string}}, required: [sent_at]}
          required: [event]
        tasks:
          - id: go
            action: {type: fetch, method: post, url: http://x/go}
            switch: end
run: [--from, union_a, --to, union_b]
expect: |
  union_scalar   v1 → v2  breaking: upgrade, contract
    input  (breaking: upgrade, contract)
      id: string|integer → string

  union_variant  v1 → v2  breaking: upgrade, contract
    input  (breaking: upgrade, contract)
      event: object {failed_code} → any of [object {sent_at}]

  exit 1
