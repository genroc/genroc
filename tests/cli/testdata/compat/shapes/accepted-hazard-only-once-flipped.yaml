# ACCEPTED: a flipped only_once is the author's policy, reported as a slot. Removal is the
# direction that bites: an interrupted attempt may re-run its side effect.
apply:
  - channel: once_a
    definitions:
      - name: once_proc
        tasks:
          - id: charge
            only_once: true
            action:
              type: fetch
              method: post
              url: http://x
            switch: end
  - channel: once_b
    definitions:
      - name: once_proc
        tasks:
          - id: charge
            action:
              type: fetch
              method: post
              url: http://x
            switch: end
run: [--from, once_a, --to, once_b]

expect: |
  once_proc  v1 → v2  upgradable, compatible
    charge:only_once  (not judged)

  exit 0
