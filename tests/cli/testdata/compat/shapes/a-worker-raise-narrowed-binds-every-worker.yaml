# Registration checks no worker, so narrowing an external's `raises` refuses future submissions
# too: both members, as for its `result_schema`.
apply:
  - channel: wraise_a
    definitions:
      - name: wraise_proc
        tasks:
          - id: hold
            action:
              type: external
              input: {}
              result_schema: {}
              raises:
                declined: {type: object, properties: {why: {type: string}}}
            switch: end
  - channel: wraise_b
    definitions:
      - name: wraise_proc
        tasks:
          - id: hold
            action:
              type: external
              input: {}
              result_schema: {}
              raises:
                declined: {type: object, properties: {why: {type: string}}, required: [why]}
            switch: end
run: [--from, wraise_a, --to, wraise_b]

expect: |
  wraise_proc  v1 → v2  breaking: upgrade, contract
    hold:external.raises  (breaking: upgrade, contract)
      declined.why: newly required field

  exit 1
