# An addition can pass (§2b): side is on a branch, so `outputs.side` is nullable and §2d's
# tolerance covers old rows; audit is on the main line but declares no output. The other
# `(added)` fixtures exit 1 for unrelated reasons.
apply:
  - channel: addok_a
    definitions:
      - name: addok_proc
        input_schema: {type: object, properties: {flag: {type: boolean}}, required: [flag]}
        tasks:
          - id: start
            action: {type: fetch, method: post, url: http://x/start}
            switch: next
          - id: finish
            action: {type: fetch, method: post, url: http://x/finish}
            switch: end
  - channel: addok_b
    definitions:
      - name: addok_proc
        input_schema: {type: object, properties: {flag: {type: boolean}}, required: [flag]}
        tasks:
          - id: start
            action: {type: fetch, method: post, url: http://x/start}
            switch:
              - {case: 'input.flag == true', goto: $side}
              - {goto: $audit}
          - id: side
            action: {type: fetch, method: post, url: http://x/side}
            output: {note: '$: 1'}
            switch: $audit
          - id: audit
            action: {type: fetch, method: post, url: http://x/audit}
            switch: next
          - id: finish
            action: {type: fetch, method: post, url: http://x/finish}
            switch: end
run: [--from, addok_a, --to, addok_b]
expect: |
  addok_proc  v1 → v2  upgradable, compatible
    start:switch  (not judged)
    side          (added)
    audit         (added)

  exit 0
