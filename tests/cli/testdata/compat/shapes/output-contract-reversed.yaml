# The output contract is judged apart from continuation: a number output turning string
# breaks the contract while the upgrade passes, which is why there are two columns.
apply:
  - channel: contract_a
    definitions:
      - name: contract_proc
        tasks:
          - id: charge
            action:
              type: fetch
              method: post
              url: http://x/charge
              responses:
                200: {type: object, properties: {amount: {type: number}}, required: [amount]}
            output: {amount: '$: self.result.amount'}
            switch: end
        output: {total: '$: outputs.charge.amount'}
  - channel: contract_b
    definitions:
      - name: contract_proc
        tasks:
          - id: charge
            action:
              type: fetch
              method: post
              url: http://x/charge
              responses:
                200: {type: object, properties: {amount: {type: string}}, required: [amount]}
            output: {amount: '$: self.result.amount'}
            switch: end
        output: {total: '$: outputs.charge.amount'}
run: [--from, contract_a, --to, contract_b]

expect: |
  contract_proc  v1 → v2  breaking: contract; upgradable
    charge:fetch.result  (breaking: contract)
      amount: number → string
    output               (breaking: contract)
      total: number → string

  exit 1
