# One edit breaks both; `--ignore contract` excuses one and the run still exits 1, since the
# upgrade check is not negotiable (§5). The selection moves only the exit code: `(ignored)`,
# every break and a trailing reason line all still print.
apply:
  - channel: mixedign_a
    definitions:
      - name: mixedign_proc
        tasks:
          - id: charge
            action:
              type: fetch
              method: post
              url: http://x/charge
              responses:
                200: {type: object, properties: {fee: {type: number}}, required: [fee]}
            output: {fee: '$: self.result.fee'}
            switch: next
          - id: settle
            action: {type: fetch, method: post, url: http://x/settle}
            switch: end
        output: {fee: '$: outputs.charge.fee'}
  - channel: mixedign_b
    definitions:
      - name: mixedign_proc
        tasks:
          - id: charge
            action:
              type: fetch
              method: post
              url: http://x/charge
              responses:
                200: {type: object, properties: {fee: {type: string}}, required: [fee]}
            output: {fee: '$: self.result.fee'}
            switch: next
          - id: settle
            action: {type: fetch, method: post, url: http://x/settle}
            switch: end
        output: {fee: '$: outputs.charge.fee'}
run: [--from, mixedign_a, --to, mixedign_b, --ignore, contract]

expect: |
  mixedign_proc  v1 → v2  breaking: upgrade; ignored: contract
    charge:fetch.result  (ignored: contract)
      fee: number → string
    settle               (breaking: upgrade)
      outputs.charge.fee: number → string
    output               (ignored: contract)
      fee: number → string

  exit 1
