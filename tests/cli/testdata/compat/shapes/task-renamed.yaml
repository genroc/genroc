# Tasks match by id, so a rename reads as one removal plus one addition.
apply:
  - channel: taskren_a
    definitions:
      - name: taskren_proc
        tasks:
          - id: ship
            action:
              type: fetch
              method: post
              url: http://x
            switch: end
  - channel: taskren_b
    definitions:
      - name: taskren_proc
        tasks:
          - id: dispatch
            action:
              type: fetch
              method: post
              url: http://x
            switch: end
run: [--from, taskren_a, --to, taskren_b]

expect: |
  taskren_proc  v1 → v2  breaking: upgrade; compatible
    ship      (breaking: upgrade)
      removed; an instance there has nowhere to continue
    dispatch  (added)

  exit 1
