# A self-referencing `$defs` cannot be baked away (§6a), so the comparison must walk the cycle
# and stop. Asserts it terminates and addresses the break at `input` by property path.
apply:
  - channel: recur_a
    definitions:
      - name: recur_proc
        $defs:
          Node:
            type: object
            properties:
              value: {type: string}
              next: {$ref: '#/$defs/Node'}
            required: [value]
        input_schema: {type: object, properties: {head: {$ref: '#/$defs/Node'}}, required: [head]}
        tasks:
          - id: go
            action: {type: fetch, method: post, url: http://x/go}
            switch: end
  - channel: recur_b
    definitions:
      - name: recur_proc
        $defs:
          Node:
            type: object
            properties:
              value: {type: integer}
              next: {$ref: '#/$defs/Node'}
            required: [value]
        input_schema: {type: object, properties: {head: {$ref: '#/$defs/Node'}}, required: [head]}
        tasks:
          - id: go
            action: {type: fetch, method: post, url: http://x/go}
            switch: end
run: [--from, recur_a, --to, recur_b]
expect: |
  recur_proc  v1 → v2  breaking: upgrade, contract
    input  (breaking: upgrade, contract)
      head.value: string → integer
    $defs  (not judged)

  exit 1
