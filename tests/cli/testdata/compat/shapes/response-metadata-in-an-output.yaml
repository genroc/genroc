# Projected metadata is judged as the output's type: `self.status` is an integer, a header
# read `string | null`. v2 swaps one for the other, breaking only upgrade: `call:output` is
# read by this process, not promised outside.
apply:
  - channel: metaout_a
    definitions:
      - name: metaout_proc
        tasks:
          - id: call
            action:
              type: fetch
              method: post
              url: http://x/call
              responses:
                "2xx": {}
            output:
              trace: "$: self.headers['x-trace']"
            switch: next
          - id: after
            output:
              seen: "$: outputs.call.trace"
            switch: end
  - channel: metaout_b
    definitions:
      - name: metaout_proc
        tasks:
          - id: call
            action:
              type: fetch
              method: post
              url: http://x/call
              responses:
                "2xx": {}
            output:
              trace: "$: self.status"
            switch: next
          - id: after
            output:
              seen: "$: outputs.call.trace"
            switch: end
run: [--from, metaout_a, --to, metaout_b]
expect: |
  metaout_proc  v1 → v2  breaking: upgrade; compatible
    after        (breaking: upgrade)
      outputs.call.trace: null|string → integer
    call:output  (ok)

  exit 1
