# Every remaining slot no verdict covers, edited at once: a slot wrongly claiming an `affects`
# entry would render `(ok)` and pass every other test. compat-command.md §2c, §3a and §8
# argue why each is unjudged.
apply:
  - channel: slots_a
    definitions:
      - name: slots_kid
        tasks:
          - id: run
            action: {type: fetch, method: post, url: http://x/kid}
            switch: end
        output: {id: '$: 1'}
      - name: slots_proc
        tasks:
          - id: call
            action:
              type: fetch
              url: http://x/call
              method: post
              headers: {trace: alpha}
              query: {page: '1'}
              body: {n: '$: 1'}
              accepted_status: ["4xx"]
              timeout: 30s
            switch: next
          - id: wake
            action: {type: delay, for: 1h, tz: UTC}
            switch: next
          - id: hand
            action: {type: external, input: {note: alpha}}
            switch: next
          - id: work
            action: {type: child, name: slots_kid, version: 1, input: {seed: '$: 1'}}
            switch: next
          - id: each
            action: {type: child_list, name: slots_kid, over: '$: [1, 2]'}
            switch: next
          - id: fan
            action:
              type: child_map
              children:
                a: {name: slots_kid, version: 1, input: {seed: '$: 1'}}
            switch: end
  - channel: slots_b
    definitions:
      - name: slots_kid
        tasks:
          - id: run
            action: {type: fetch, method: post, url: http://x/kid}
            switch: end
        output: {id: '$: 1'}
      - name: slots_proc
        tasks:
          - id: call
            action:
              type: fetch
              url: http://x/call
              method: put
              headers: {trace: beta}
              query: {page: '2'}
              body: {n: '$: 2'}
              accepted_status: ["4xx", "5xx"]
              timeout: 60s
            switch: next
          - id: wake
            action: {type: delay, for: 2h, tz: Europe/Prague}
            switch: next
          - id: hand
            action: {type: external, input: {note: beta}}
            switch: next
          - id: work
            action: {type: child, name: slots_kid, input: {seed: '$: 2'}}
            switch: next
          - id: each
            action: {type: child_list, name: slots_kid, over: '$: [1, 2, 3]'}
            switch: next
          - id: fan
            action:
              type: child_map
              children:
                a: {name: slots_kid, input: {seed: '$: 2'}}
            switch: end
run: [--from, slots_a, --to, slots_b]
expect: |
  slots_kid   v1       unchanged
  slots_proc  v1 → v2  upgradable, compatible
    call:fetch.method           (not judged)
    call:fetch.headers          (not judged)
    call:fetch.query            (not judged)
    call:fetch.accepted_status  (not judged)
    call:fetch.timeout          (not judged)
    call:fetch.body             (not judged)
    wake:delay.for              (not judged)
    wake:delay.tz               (not judged)
    hand:external.input         (not judged)
    work:child.input            (not judged)
    work:child.version          (not judged)
    each:child_list.over        (not judged)
    fan:child_map.a.version     (not judged)
    fan:child_map.a.input       (not judged)

  exit 0
