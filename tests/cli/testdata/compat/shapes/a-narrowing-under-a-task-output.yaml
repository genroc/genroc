# Inference carries constraints through navigation: `$: input.rows` puts the item bounds into
# `$defs[go_output]`, so the input narrowing surfaces again in a task's context, at its own path.
apply:
  - channel: deeppath_a
    definitions:
      - name: deeppath_proc
        input_schema:
          type: object
          properties:
            rows:
              type: array
              items:
                type: object
                properties: {id: {type: integer}}
                required: [id]
          required: [rows]
        tasks:
          - id: go
            action: {type: fetch, method: post, url: http://x/go}
            output: {picked: '$: input.rows'}
            switch: next
          - id: after
            action: {type: fetch, method: post, url: http://x/after}
            switch: end
  - channel: deeppath_b
    definitions:
      - name: deeppath_proc
        input_schema:
          type: object
          properties:
            rows:
              type: array
              items:
                type: object
                properties: {id: {type: integer, minimum: 1}}
                required: [id]
          required: [rows]
        tasks:
          - id: go
            action: {type: fetch, method: post, url: http://x/go}
            output: {picked: '$: input.rows'}
            switch: next
          - id: after
            action: {type: fetch, method: post, url: http://x/after}
            switch: end
run: [--from, deeppath_a, --to, deeppath_b]

expect: |
  deeppath_proc  v1 → v2  breaking: upgrade, contract
    input  (breaking: upgrade, contract)
      rows[].id: no minimum → minimum 1
    after  (breaking: upgrade)
      outputs.go.picked[].id: no minimum → minimum 1

  exit 1
