# The parking rule for the child family (`parksMidTask` reads `Holds().Result`): child,
# child_map (per key: `many:child_map.a.result`) and child_list. No leftover changed-slot row
# for `many`: it shares the break's address and §6b suppresses it.
apply:
  - channel: parkfam_a
    definitions:
      - name: parkfam_kid
        tasks:
          - id: run
            action:
              type: fetch
              method: post
              url: http://x/kid
              responses:
                200: {type: object, properties: {id: {type: string}, x: {type: integer}}, required: [id, x]}
            output: {id: '$: self.result.id', x: '$: self.result.x'}
            switch: end
        output: {id: '$: outputs.run.id', x: '$: outputs.run.x'}
      - name: parkfam_proc
        tasks:
          - id: one
            action:
              type: child
              name: parkfam_kid
              result_schema: {type: object, properties: {id: {type: string}}}
            switch: next
          - id: many
            action:
              type: child_map
              children:
                a: {name: parkfam_kid, result_schema: {type: object, properties: {id: {type: string}}}}
            switch: next
          - id: each
            action:
              type: child_list
              name: parkfam_kid
              over: '$: [1, 2]'
              result_schema: {type: object, properties: {id: {type: string}}}
            switch: end
  - channel: parkfam_b
    definitions:
      - name: parkfam_kid
        tasks:
          - id: run
            action:
              type: fetch
              method: post
              url: http://x/kid
              responses:
                200: {type: object, properties: {id: {type: string}, x: {type: integer}}, required: [id, x]}
            output: {id: '$: self.result.id', x: '$: self.result.x'}
            switch: end
        output: {id: '$: outputs.run.id', x: '$: outputs.run.x'}
      - name: parkfam_proc
        tasks:
          - id: one
            action:
              type: child
              name: parkfam_kid
              result_schema: {type: object, properties: {id: {type: string}, x: {type: integer}}, required: [x]}
            switch: next
          - id: many
            action:
              type: child_map
              children:
                a: {name: parkfam_kid, result_schema: {type: object, properties: {id: {type: string}, x: {type: integer}}, required: [x]}}
            switch: next
          - id: each
            action:
              type: child_list
              name: parkfam_kid
              over: '$: [1, 2]'
              result_schema: {type: object, properties: {id: {type: string}, x: {type: integer}}, required: [x]}
            switch: end
run: [--from, parkfam_a, --to, parkfam_b]

expect: |
  parkfam_kid   v1       unchanged
  parkfam_proc  v1 → v2  breaking: upgrade, contract
    one:child.result         (breaking: upgrade, contract)
      x: newly required field
    many:child_map.a.result  (breaking: upgrade, contract)
      x: newly required field
    each:child_list.result   (breaking: upgrade, contract)
      x: newly required field

  exit 1
