# A child that stops producing a field breaks its output contract the other way round. The
# output direction is reversed — we produce it, so it may only narrow — and the message says
# so from the reader's side: the old output guaranteed `note` and the new one does not. A
# parent that named it now reads null.
apply:
  - channel: unread_a
    definitions:
      - name: unread_kid
        tasks:
          - id: run
            action:
              type: fetch
              url: http://x
              result_schema: {type: object, properties: {id: {type: string}, note: {type: string}}, required: [id, note]}
            output: {id: '$: self.result.id', note: '$: self.result.note'}
            switch: end
        output: {id: '$: outputs.run.id', note: '$: outputs.run.note'}
      - name: unread_boss
        tasks:
          - id: work
            action:
              type: child
              name: unread_kid
              result_schema: {type: object, properties: {id: {type: string}}, required: [id]}
            switch: end
  - channel: unread_b
    definitions:
      - name: unread_kid
        tasks:
          - id: run
            action:
              type: fetch
              url: http://x
              result_schema: {type: object, properties: {id: {type: string}}, required: [id]}
            output: {id: '$: self.result.id'}
            switch: end
        output: {id: '$: outputs.run.id'}
run: [--from, unread_a, --to, unread_b]

expect: |
  PROCESS      UPGRADE          CONTRACT
  unread_boss  nothing changed  nothing changed
  unread_kid   upgradable       breaking

  unread_kid v1 → v2
    output            (breaking contract)
      note: no longer guaranteed
    run:output        (ok)
    run:fetch.result  (ok)

  exit 1
