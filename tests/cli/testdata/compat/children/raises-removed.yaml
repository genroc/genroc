# The declaration is what makes error.data readable, so DROPPING it takes the slot away from
# the handler. A definition that still read it could not register at all — the read is a
# registration error without the declaration — so the edit that reaches compat is the one that
# drops both, and the question is whether an instance parked in the child call can continue.
apply:
  - channel: dropped_a
    definitions:
      - name: dropped_kid
        tasks:
          - id: charge
            switch:
              - case: "true"
                raise: {code: declined, message: "no", data: {why: "card"}}
              - goto: end
      - name: dropped_boss
        tasks:
          - id: work
            action:
              type: child
              name: dropped_kid
              raises:
                declined: {type: object, properties: {why: {type: string}}, required: [why]}
            on_error:
              - code: [declined]
                goto: $explain
            switch: end
          - id: explain
            output: {why: '$: error.data.why'}
            switch: end
        output: {why: '$: outputs.explain.why'}
  - channel: dropped_b
    definitions:
      - name: dropped_kid
        tasks:
          - id: charge
            switch:
              - case: "true"
                raise: {code: declined, message: "no", data: {why: "card"}}
              - goto: end
      - name: dropped_boss
        tasks:
          - id: work
            action:
              type: child
              name: dropped_kid
            on_error:
              - code: [declined]
                goto: $explain
            switch: end
          - id: explain
            output: {why: '$: error.message'}
            switch: end
        output: {why: '$: outputs.explain.why'}
run: [--from, dropped_a, --to, dropped_b]

expect: |
  dropped_boss  v1 → v2  breaking: upgrade; compatible
    work:child.raises  (breaking: upgrade)
      declined: code no longer declared
    explain:output     (ok)

  dropped_kid   v1       unchanged

  exit 1
