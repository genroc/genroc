# Dropping `raises` takes last_error.data from the handler. A read of it cannot register
# without the declaration, so the edit compat sees drops both.
apply:
  - channel: dropped_a
    definitions:
      - name: dropped_kid
        tasks:
          - id: charge
            switch:
              - case: "true"
                raise: {code: declined, message: "no", data: {why: "card"}}
              - goto: end
      - name: dropped_boss
        tasks:
          - id: work
            action:
              type: child
              name: dropped_kid
              raises:
                declined: {type: object, properties: {why: {type: string}}, required: [why]}
            on_error:
              - code: [declined]
                goto: $explain
            switch: end
          - id: explain
            output: {why: '$: last_error.data.why'}
            switch: end
        output: {why: '$: outputs.explain.why'}
  - channel: dropped_b
    definitions:
      - name: dropped_kid
        tasks:
          - id: charge
            switch:
              - case: "true"
                raise: {code: declined, message: "no", data: {why: "card"}}
              - goto: end
      - name: dropped_boss
        tasks:
          - id: work
            action:
              type: child
              name: dropped_kid
            on_error:
              - code: [declined]
                goto: $explain
            switch: end
          - id: explain
            output: {why: '$: last_error.message'}
            switch: end
        output: {why: '$: outputs.explain.why'}
run: [--from, dropped_a, --to, dropped_b]

expect: |
  dropped_boss  v1 → v2  breaking: upgrade, contract
    work:child.raises  (breaking: upgrade, contract)
      declined: code no longer declared
    explain:output     (ok)

  dropped_kid   v1       unchanged

  exit 1
