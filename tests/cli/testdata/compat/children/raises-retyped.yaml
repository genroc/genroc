# The break lands on what the handler reads, not the edited slot, and reaches the contract
# because the handler projects it into the output. The kid's payload is opaque so both
# `raises` register: a typed one would refuse the retyped side before compat ran.
apply:
  - channel: retyped_a
    definitions:
      - name: retyped_kid
        input_schema: {type: object, properties: {why: {}}}
        tasks:
          - id: charge
            switch:
              - case: "true"
                raise: {code: declined, message: "no", data: {why: '$: input.why'}}
              - goto: end
      - name: retyped_boss
        tasks:
          - id: work
            action:
              type: child
              name: retyped_kid
              raises:
                declined: {type: object, properties: {why: {type: string}}, required: [why]}
            on_error:
              - code: [declined]
                goto: $explain
            switch: end
          - id: explain
            output: {why: '$: last_error.data.why'}
            switch: end
        output: {why: '$: outputs.explain.why'}
  - channel: retyped_b
    definitions:
      - name: retyped_kid
        input_schema: {type: object, properties: {why: {}}}
        tasks:
          - id: charge
            switch:
              - case: "true"
                raise: {code: declined, message: "no", data: {why: '$: input.why'}}
              - goto: end
      - name: retyped_boss
        tasks:
          - id: work
            action:
              type: child
              name: retyped_kid
              raises:
                declined: {type: object, properties: {why: {type: integer}}, required: [why]}
            on_error:
              - code: [declined]
                goto: $explain
            switch: end
          - id: explain
            output: {why: '$: last_error.data.why'}
            switch: end
        output: {why: '$: outputs.explain.why'}
run: [--from, retyped_a, --to, retyped_b]

expect: |
  retyped_boss  v1 → v2  breaking: upgrade, contract
    work:child.raises  (breaking: upgrade, contract)
      declined.why: string → integer
    explain            (breaking: upgrade)
      last_error.data.why: string → integer
    output             (breaking: contract)
      why: null|string → integer|null

  retyped_kid   v1       unchanged

  exit 1
