# The child's output is `{}` and the parent restates it in result_schema (collect conforms it
# at runtime), so changing the child must not report the parent's narrowing as a break.
apply:
  - channel: unknown_a
    definitions:
      - name: unknown_kid
        tasks:
          - id: run
            action:
              type: fetch
              method: post
              url: http://x
              responses:
                200: {}
            output: {payload: '$: self.result'}
            switch: end
        output: {payload: '$: outputs.run.payload'}
      - name: unknown_boss
        tasks:
          - id: work
            action:
              type: child
              name: unknown_kid
              result_schema: {type: object, properties: {payload: {type: object, properties: {ticket: {type: string}}, required: [ticket]}}, required: [payload]}
            switch: end
  - channel: unknown_b
    definitions:
      - name: unknown_kid
        tasks:
          - id: run
            action:
              type: fetch
              method: post
              url: http://y
              responses:
                200: {}
            output: {payload: '$: self.result'}
            switch: end
        output: {payload: '$: outputs.run.payload'}
run: [--from, unknown_a, --to, unknown_b]

expect: |
  unknown_boss  v1       unchanged
  unknown_kid   v1 → v2  upgradable, compatible
    run:fetch.url  (not judged)

  exit 0
