# A process only the from side carries is reported `unchanged`, not refused: a channel is a
# per-process pointer, so omitting one does not retire it, and reconcile pairs it v1 vs v1.
# The pin form refuses the same thing (explicit-name-with-no-target-is-an-error.yaml).
apply:
  - channel: gone_a
    definitions:
      - name: gone_stays
        tasks:
          - id: ship
            action: {type: fetch, method: post, url: http://x/ship}
            switch: end
      - name: gone_leaves
        tasks:
          - id: ship
            action: {type: fetch, method: post, url: http://x/leaves}
            switch: end
  - channel: gone_b
    definitions:
      - name: gone_stays
        tasks:
          - id: ship
            action: {type: fetch, method: post, url: http://y/ship}
            switch: end
run: [--from, gone_a, --to, gone_b]
expect: |
  gone_leaves  v1       unchanged
  gone_stays   v1 → v2  upgradable, compatible
    ship:fetch.url  (not judged)

  exit 0
