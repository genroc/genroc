# new-process.yaml pins the arrival: a process only the TO side carries is `new` and does not
# drag the roll-up down. This is the departure, and it is the one an operator meets by
# accident — a process dropped from the next channel while instances of it are still running.
#
# In pin form the same situation is a refusal (explicit-name-with-no-target-is-an-error.yaml),
# because a name written on one side and not the other is a question that was asked and not
# answered. A channel names nothing property by property, so there is no question to refuse —
# and the answer is not a special case either: `reconcile` carries an implicit entry over to
# the target at the version it already has, so the pair really is v1 against v1 and
# `nothing changed` is literally true. A channel is a per-process pointer, so `gone_b` not
# naming `gone_leaves` does not retire it; its instances keep running what they run.
#
# The same rendering with nothing behind it is the failure worth guarding, and it has its own
# case: a-channel-that-does-not-exist.yaml, where EVERY row reads this way because the target
# resolved to nothing at all. That one is refused. This one is a report.
apply:
  - channel: gone_a
    definitions:
      - name: gone_stays
        tasks:
          - id: ship
            action: {type: fetch, url: http://x/ship}
            switch: end
      - name: gone_leaves
        tasks:
          - id: ship
            action: {type: fetch, url: http://x/leaves}
            switch: end
  - channel: gone_b
    definitions:
      - name: gone_stays
        tasks:
          - id: ship
            action: {type: fetch, url: http://y/ship}
            switch: end
run: [--from, gone_a, --to, gone_b]
expect: |
  gone_leaves  v1       unchanged
  gone_stays   v1 → v2  upgradable, compatible
    ship:fetch.url  (not judged)

  exit 0
