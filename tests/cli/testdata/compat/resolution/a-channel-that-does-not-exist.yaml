# An empty target channel is refused: otherwise every row reads `unchanged`, indistinguishable
# from "checked, and fine". Only the target: an empty --from is the bootstrap case, where
# every process is legitimately `new`.
apply:
  - channel: nochan_a
    definitions:
      - name: nochan_proc
        tasks:
          - id: ship
            action: {type: fetch, method: post, url: http://x/ship}
            switch: end
run: [--from, nochan_a, --to, nochan_typo]
expect: |
  --- stderr ---
  genctl: server: to: channel "nochan_typo" carries no processes; there is nothing to compare against

  exit 1
