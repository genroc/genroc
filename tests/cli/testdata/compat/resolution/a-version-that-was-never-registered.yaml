# `@9` was never registered: refused, never resolved to the nearest version, or a pipeline
# pinning an unpublished version would be told its change is fine.
apply:
  - channel: novers_a
    definitions:
      - name: novers_proc
        tasks:
          - id: ship
            action: {type: fetch, method: post, url: http://x/ship}
            switch: end
run: [--from, novers_proc@1, --to, novers_proc@9]
expect: |
  --- stderr ---
  genctl: server: to: definition "novers_proc" v9: not found

  exit 1
