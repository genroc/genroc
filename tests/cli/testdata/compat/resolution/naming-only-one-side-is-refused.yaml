# Defaulting the other would hide which two documents were compared.
apply:
  - channel: oneside_a
    definitions:
      - name: oneside_proc
        tasks:
          - id: ship
            action:
              type: fetch
              url: http://x
            switch: end
run: [--from, oneside_a]

expect: |
  --- stderr ---
  genctl: usage: genctl compat --from <sel> [-f <path|glob> ...]
         genctl compat --from <sel> --to <sel> [--process <name>]
         genctl compat <instance-id> --to <version|channel>

  exit 1
