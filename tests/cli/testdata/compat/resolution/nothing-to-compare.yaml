    definitions:
      - name: noop_proc
        tasks:
          - id: ship
            action:
              type: fetch
              method: post
              url: http://x
            switch: end
run: [--from, noop_proc@1, --to, noop_proc@1]

expect: |
  noop_proc  v1  unchanged

  exit 0
