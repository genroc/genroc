# Naming a parent alone still pairs the child versions it was registered against; without
# them the report would have no pairing rows and read clean.
apply:
  - channel: closure_a
    definitions:
      - name: closure_kid
        tasks:
          - id: run
            action:
              type: fetch
              method: post
              url: http://x
              responses:
                200: {type: object, properties: {id: {type: string}}, required: [id]}
            output: {id: '$: self.result.id'}
            switch: end
        output: {id: '$: outputs.run.id'}
      - name: closure_boss
        tasks:
          - id: work
            action:
              type: child
              name: closure_kid
              result_schema: {type: object, properties: {id: {type: string}}, required: [id]}
            switch: end
  - channel: closure_b
    definitions:
      - name: closure_kid
        tasks:
          - id: run
            action:
              type: fetch
              method: post
              url: http://y
              responses:
                200: {type: object, properties: {id: {type: string}}, required: [id]}
            output: {id: '$: self.result.id'}
            switch: end
        output: {id: '$: outputs.run.id'}
      - name: closure_boss
        tasks:
          - id: work
            action:
              type: child
              name: closure_kid
              result_schema: {type: object, properties: {id: {type: string}}, required: [id]}
            switch: end
run: [--process, closure_boss, --from, closure_boss@1, --to, closure_boss@2]

expect: |
  closure_boss  v1 → v2  upgradable, compatible
  closure_kid   v1 → v2  upgradable, compatible
    run:fetch.url  (not judged)

  exit 0
