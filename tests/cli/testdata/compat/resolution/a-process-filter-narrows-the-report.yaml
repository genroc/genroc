# `--process` on a channel-wide comparison. Both processes moved, so a filter that did nothing
# prints two blocks; the filtered one has a child because its closure must stay in.
apply:
  - channel: filter_a
    definitions:
      - name: filter_kid
        tasks:
          - id: run
            action:
              type: fetch
              method: post
              url: http://x/kid
              responses:
                200: {type: object, properties: {id: {type: string}}, required: [id]}
            output: {id: '$: self.result.id'}
            switch: end
        output: {id: '$: outputs.run.id'}
      - name: filter_boss
        tasks:
          - id: work
            action:
              type: child
              name: filter_kid
              result_schema: {type: object, properties: {id: {type: string}}, required: [id]}
            switch: end
      - name: filter_other
        tasks:
          - id: ship
            action: {type: fetch, method: post, url: http://x/other}
            switch: end
  - channel: filter_b
    definitions:
      - name: filter_kid
        tasks:
          - id: run
            action:
              type: fetch
              method: post
              url: http://y/kid
              responses:
                200: {type: object, properties: {id: {type: string}}, required: [id]}
            output: {id: '$: self.result.id'}
            switch: end
        output: {id: '$: outputs.run.id'}
      - name: filter_boss
        tasks:
          - id: work
            action:
              type: child
              name: filter_kid
              result_schema: {type: object, properties: {id: {type: string}}, required: [id]}
            switch: end
      - name: filter_other
        tasks:
          - id: ship
            action: {type: fetch, method: post, url: http://y/other}
            switch: end
run: [--from, filter_a, --to, filter_b, --process, filter_boss]
expect: |
  filter_boss  v1 → v2  upgradable, compatible
  filter_kid   v1 → v2  upgradable, compatible
    run:fetch.url  (not judged)

  exit 0
