# A submitted document is validated before comparison; validate's error names the task and
# expression better than an "unanalysable" verdict could.
apply:
  - channel: badexpr_a
    definitions:
      - name: badexpr_proc
        tasks:
          - id: ship
            action: {type: fetch, method: post, url: http://x}
            switch: end
submit:
  - name: badexpr_proc
    tasks:
      - id: ship
        action: {type: fetch, method: post, url: "http://x/${ outputs.nope.v }"}
        switch: end
run: [--from, badexpr_a]

expect: |
  --- stderr ---
  genctl: server: badexpr_proc: task "ship" url: template expression " outputs.nope.v ": cannot access .nope: schema has no properties

  exit 1
