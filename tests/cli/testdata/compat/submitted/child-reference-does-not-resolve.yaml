# The parent calls a process in neither its bundle nor the registry: refused as validate
# refuses it, not compared against an empty resolution.
apply:
  - channel: badref_a
    definitions:
      - name: badref_boss
        tasks:
          - id: work
            action: {type: fetch, method: post, url: http://x}
            switch: end
submit:
  - name: badref_boss
    tasks:
      - id: work
        action: {type: child, name: badref_missing}
        switch: end
run: [--from, badref_a]

expect: |
  --- stderr ---
  genctl: server: badref_boss: task "work": child: no definitions found for "badref_missing": not found

  exit 1
