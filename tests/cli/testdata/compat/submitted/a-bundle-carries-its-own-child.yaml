# A child submitted alongside its parent is resolved from the bundle, not the registry. The
# child drops a field the parent's result_schema does not name, so the bundle validates and
# only the child's output contract breaks; the parent moves too, so both blocks print.
apply:
  - channel: pair_a
    definitions:
      - name: pair_kid
        input_schema: {type: object, properties: {seed: {type: integer}}}
        tasks:
          - id: run
            action:
              type: fetch
              method: post
              url: http://x/kid
              responses:
                200:
                  {type: object, properties: {id: {type: string}, note: {type: string}}, required: [id, note]}
            output: {id: '$: self.result.id', note: '$: self.result.note'}
            switch: end
        output: {id: '$: outputs.run.id', note: '$: outputs.run.note'}
      - name: pair_boss
        tasks:
          - id: work
            action:
              type: child
              name: pair_kid
              input: {seed: '$: 1'}
              result_schema: {type: object, properties: {id: {type: string}}, required: [id]}
            switch: end
submit:
  - name: pair_kid
    input_schema: {type: object, properties: {seed: {type: integer}}}
    tasks:
      - id: run
        action:
          type: fetch
          method: post
          url: http://x/kid
          responses:
            200: {type: object, properties: {id: {type: string}}, required: [id]}
        output: {id: '$: self.result.id'}
        switch: end
    output: {id: '$: outputs.run.id'}
  - name: pair_boss
    tasks:
      - id: work
        action:
          type: child
          name: pair_kid
          input: {seed: '$: 2'}
          result_schema: {type: object, properties: {id: {type: string}}, required: [id]}
        switch: end
run: [--from, pair_a]
expect: |
  pair_boss  v1 → (new)  upgradable, compatible
    work:child.input  (not judged)

  pair_kid   v1 → (new)  breaking: contract; upgradable
    output            (breaking: contract)
      note: no longer guaranteed
    run:output        (ok)
    run:fetch.result  (ok)

  exit 1
