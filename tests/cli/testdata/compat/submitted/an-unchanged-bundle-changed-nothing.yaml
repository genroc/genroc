# A submitted document has no version, so the documents themselves must answer whether it
# changed, or an unchanged bundle reads as an upgrade of nothing.
apply:
  - channel: nochange_a
    definitions:
      - name: nochange_proc
        tasks:
          - id: ship
            action: {type: fetch, method: post, url: http://x/ship}
            switch: end
submit:
  - name: nochange_proc
    tasks:
      - id: ship
        action: {type: fetch, method: post, url: http://x/ship}
        switch: end
run: [--from, nochange_a]

expect: |
  nochange_proc  v1  unchanged

  exit 0
