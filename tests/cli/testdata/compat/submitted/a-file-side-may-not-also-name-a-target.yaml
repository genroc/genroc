# `-f` is the target side, so `--to` beside it is refused, not resolved by precedence: either
# precedence silently answers about a pair the operator did not ask about.
apply:
  - channel: filetop_a
    definitions:
      - name: filetop_proc
        tasks:
          - id: ship
            action: {type: fetch, method: post, url: http://x/ship}
            switch: end
submit:
  - name: filetop_proc
    tasks:
      - id: ship
        action: {type: fetch, method: post, url: http://y/ship}
        switch: end
run: [--from, filetop_a, --to, filetop_a]
expect: |
  --- stderr ---
  genctl: -f already names the target side; drop --to

  exit 1
