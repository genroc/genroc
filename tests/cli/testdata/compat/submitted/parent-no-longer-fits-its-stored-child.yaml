# The child is resolved from the registry, so a parent tightening its result_schema past the
# stored child's output is caught by validation before any comparison.
apply:
  - channel: tighten_a
    definitions:
      - name: tighten_kid
        tasks:
          - id: run
            action:
              type: fetch
              method: post
              url: http://x
              responses:
                200: {type: object, properties: {id: {type: string}}, required: [id]}
            output: {id: '$: self.result.id'}
            switch: end
        output: {id: '$: outputs.run.id'}
      - name: tighten_boss
        tasks:
          - id: work
            action:
              type: child
              name: tighten_kid
              result_schema: {type: object, properties: {id: {type: string}}, required: [id]}
            switch: end
submit:
  - name: tighten_boss
    tasks:
      - id: work
        action:
          type: child
          name: tighten_kid
          result_schema: {type: object, properties: {id: {type: integer}}, required: [id]}
        switch: end
run: [--from, tighten_a]

expect: |
  --- stderr ---
  genctl: server: tighten_boss: task "work": child: the child's output type is not compatible with the declared result_schema: id: string → integer

  exit 1
