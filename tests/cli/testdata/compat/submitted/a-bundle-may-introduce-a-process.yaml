# A submitted process the from channel never had: no from version and no to version, and it
# must neither crash nor gate, or every first deploy fails the check.
apply:
  - channel: newsub_a
    definitions:
      - name: newsub_existing
        tasks:
          - id: ship
            action: {type: fetch, method: post, url: http://x/ship}
            switch: end
submit:
  - name: newsub_existing
    tasks:
      - id: ship
        action: {type: fetch, method: post, url: http://y/ship}
        switch: end
  - name: newsub_arrival
    tasks:
      - id: ship
        action: {type: fetch, method: post, url: http://z/ship}
        switch: end
run: [--from, newsub_a]
expect: |
  newsub_arrival   (new)       new
  newsub_existing  v1 → (new)  upgradable, compatible
    ship:fetch.url  (not judged)

  exit 0
