# yaml-language-server: $schema=https://genroc.org/process-schema.json
name: weather-logger
input_schema:
  type: object
  properties:
    script_url: { type: string, default: "http://localhost:3010" }
    place: { type: string, default: "Praha" }
    ticks:
      type: integer
      default: 0
      description: "kolik mereni udelat; 0 = bezet donekonecna"
tasks:
  - id: geocode
    action:
      type: fetch
      url: "https://geocoding-api.open-meteo.com/v1/search"
      method: GET
      query:
        name: "$: input.place"
        count: 1
        format: json
      responses:
        200:
          $ref: "#/$defs/geo_response"

    timeout: 15s
    output: "$: self.result.results[0]"
    switch:
      # An unknown place is not a 404 here — geocoding answers 200 with no `results` key at
      # all, so an empty array is the only evidence, and indexing it gives null.
      - case: "self.output == null"
        raise:
          code: unknown_place
          message: "geocoding knows no such place"
      - goto: $wait

  # Parks the instance until the next whole 10 seconds, holding no worker.
  - id: wait
    action:
      type: delay
      until: "*:*:0/10"
      tz: "Europe/Prague"
    switch: next

  # The whole measurement, as a child call. The code lives in reading.ts
  - id: reading
    action:
      type: child
      name: script
      input:
        runner_url: "$: input.script_url"
        code: "$import: ./reading.ts"
        timeout_ms: 20000
        input:
          geo: "$: outputs.geocode"
      result_schema:
        type: object
        properties:
          time: { type: string }
          condition: { type: string }
          temperature_c: { type: number }
          summary: { type: string }
        required: [time, condition, temperature_c, summary]
    output:
      result: "$: self.result"
      count: "$: (self.previous.count ?? 0) + 1"
    on_error:
      - code: ["script_threw", "script_timeout"]
        raise:
          code: reading_failed
          message: "no reading for ${outputs.geocode.name ?? input.place}: ${error.message}"
    switch:
      - case: "input.ticks > 0 && self.output.count >= input.ticks"
        goto: end
      - goto: $wait

$defs:
  geo_response:
    type: object
    properties:
      results:
        type: array
        items:
          type: object
          properties:
            latitude: { type: number }
            longitude: { type: number }
            name: { type: string }
            country: { type: string }
          required: [latitude, longitude, name]
