# yaml-language-server: $schema=https://genroc.org/process-schema.json
name: weather-logger
input_schema:
  type: object
  properties:
    place: { type: string, default: "Praha" }
tasks:
  - id: location
    action:
      type: child
      name: script-node
      input:
        code: "$import: ./location.ts"
        input:
          place: "$: input.place"
      result_schema:
        $ref: "#/$defs/geo_response"
    output: "$: self.result"
    switch: next

  # Parks the instance until the next whole 10 seconds, holding no worker.
  - id: wait
    action:
      type: delay
      until: "*:*:0/10"
    switch: next

  # The whole measurement, as a child call. The code lives in reading.ts
  - id: reading
    action:
      type: child
      name: script-node
      input:
        code: "$import: ./reading.ts"
        # The script's own budget. script.yaml waits 30s on top of it, so an overrun
        # arrives here as script_timeout rather than an unknowable http.timeout.
        timeout_ms: 20000
        input:
          prev: "$: self.previous.array ?? []"
          geo: "$: outputs.location"
      result_schema:
        type: array
        items:
          $ref: "#/$defs/reading"
      # What this caller needs of a throw. `script` is generic and cannot mint a code for
      # reading.ts's refusals (R2), so `name` would die at the process boundary; declaring the
      # shape here is what carries it across, exactly as result_schema carries the output.
      raises:
        script_threw:
          $ref: "#/$defs/script_throw"
    output:
      count: "$: (self.previous.count ?? 0) + 1"
      array: "$: self.result"
    on_error:
      # A reading that may or may not have happened is a reason to look again at the next
      # window — reading.ts pins nothing, so a rerun is free. There is no "evaluator down"
      # code to handle any more: a runner that faults releases its claim and the task waits on
      # the queue, so only a spent DEADLINE reaches here, as script_unknown.
      - code: ["script_timeout", "script_unknown"]
        goto: $wait
      # The sky refusing is transient; anything else reading.ts throws is a bug in it, and
      # looping on a bug would hide it forever behind a process that never finishes. Deciding
      # at the rule keeps the instance on `reading`, which is what a retry can still reach.
      - code: ["script_threw"]
        case: 'error.data.name == "UpstreamError"'
        goto: $wait

    switch:
      - goto: $wait

$defs:
  # Only the two fields this process reads: the conform narrows the forwarded payload to
  # exactly what was declared, so kind and stack stay where they were produced.
  script_throw:
    type: object
    properties:
      name: { type: string }
      stack: { type: [string, "null"] }
    required: [name, stack]

  geo_response:
    type: object
    properties:
      latitude: { type: number }
      longitude: { type: number }
      name: { type: string }
      country: { type: string }
    required: [latitude, longitude, name]

  reading:
    type: object
    properties:
      time: { type: string }
      condition: { type: string }
      temperature_c: { type: number }
      summary: { type: string }
    required: [time, condition, temperature_c, summary]
