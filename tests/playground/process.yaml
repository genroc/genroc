# yaml-language-server: $schema=https://genroc.org/process-schema.json
name: weather-logger
input_schema:
  type: object
  properties:
    place: { type: string, default: "Praha" }
    ticks:
      type: integer
      default: 0
      description: "how many measurements to do; 0 = run forever"
tasks:
  - id: location
    action:
      type: child
      name: script
      input:
        code: "$import: ./location.ts"
        input:
          place: "$: input.place"
      result_schema:
        $ref: "#/$defs/geo_response"
    output: "$: self.result"
    switch: next

  # Parks the instance until the next whole 10 seconds, holding no worker.
  - id: wait
    action:
      type: delay
      until: "*:*:0/10"
    switch: next

  # The whole measurement, as a child call. The code lives in reading.ts
  - id: reading
    action:
      type: child
      name: script
      input:
        code: "$import: ./reading.ts"
        # The script's own budget. script.yaml waits 30s on top of it, so an overrun
        # arrives here as script_timeout rather than an unknowable http.timeout.
        timeout_ms: 20000
        input:
          geo: "$: outputs.location"
      result_schema:
        $ref: "#/$defs/reading"
    output:
      count: "$: (self.previous.count ?? 0) + 1"
      last: "$: self.result"
    on_error:
      # A refusal from the sky is a reason to look again at the next window, and so is a
      # reading that may or may not have happened — reading.ts pins nothing, so a rerun is
      # free. engine_not_available means the child already retried, so it travels on up.
      - code: ["script_threw", "script_timeout", "script_unknown"]
        goto: $wait
    switch:
      - case: "input.ticks > 0 && self.output.count >= input.ticks"
        goto: end
      - goto: $wait

output:
  place: "$: outputs.location.name"
  readings: "$: outputs.reading.count"
  last: "$: outputs.reading.last"

$defs:
  geo_response:
    type: object
    properties:
      latitude: { type: number }
      longitude: { type: number }
      name: { type: string }
      country: { type: string }
    required: [latitude, longitude, name]

  reading:
    type: object
    properties:
      time: { type: string }
      condition: { type: string }
      temperature_c: { type: number }
      summary: { type: string }
    required: [time, condition, temperature_c, summary]
