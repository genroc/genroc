# yaml-language-server: $schema=https://genroc.org/process-schema.json
#
# The script task as a CHILD PROCESS: one place that knows the evaluator's wire contract, so
# a caller writes `type: child` plus a result_schema instead of a fetch plus its own 422
# handling. This is custom-tasks.md's middle tier — the parent↔child relationship IS the
# extension point — and the engine still has no idea scripts exist.
#
# The output is the TOP TYPE. A forwarding process must not declare a shape that is the
# caller's concern; the caller narrows it with result_schema, which collect conforms against
# the real output. See specs/unknown-type.md.
name: script
config_schema:
  type: object
  properties:
    runner_url: { type: string, default: "http://localhost:3010" }
    # How long to keep trying an evaluator that is not answering yet. The defaults suit a
    # local runner; a deployment where the evaluator is a pod wants minutes, because a cold
    # start that pulls an image looks exactly like an evaluator that is gone.
    # GENROC_SCRIPT_RETRY_ATTEMPTS=8 GENROC_SCRIPT_RETRY_MAX_DELAY_MS=60000
    retry_attempts: { type: integer, default: 4 }
    retry_delay_ms: { type: integer, default: 1000 }
    retry_factor: { type: number, default: 3 }
    retry_max_delay_ms: { type: integer, default: 30000 }
input_schema:
  type: object
  properties:
    code: { type: string }
    input:
      description: "opaque here — whatever the script reads, typed by whoever wrote it"
    timeout_ms: { type: integer, default: 5000 }
  required: [code]
tasks:
  - id: eval
    action:
      type: fetch
      url: "${ config.runner_url }/eval"
      body:
        code: "$: input.code"
        input: "$: input.input"
        timeout_ms: "$: input.timeout_ms"
      responses:
        200: {}
        "422": { $ref: "#/$defs/script_error" }
    # Above the runner's own budget, so a script that overruns comes back as a classified
    # 422 rather than http.timeout — which is unknowable, and so never retryable.
    timeout: 30s
    output: "$: self.result"
    on_error:
      - code: ["http.422"]
        goto: $failed
      # Nothing ran — the request never left, or a gateway refused on the backend's behalf.
      # Only a spent budget makes "not available" true, which is what lets a caller fail on
      # it rather than loop. The curve is config so it can outlast a cold start.
      #
      # Retrying a 5xx trades on the evaluator being idempotent: from here an ingress
      # refusing for a dead backend and the app itself answering 503 look identical.
      - code: [pre.error, pre.timeout, http.502, http.503, http.504]
        retry:
          attempts: "$: config.retry_attempts"
          delay: "$: config.retry_delay_ms"
          factor: "$: config.retry_factor"
          max_delay: "$: config.retry_max_delay_ms"
        raise:
          code: engine_not_available
          message: "no answer from the evaluator: ${error.message}"
      # The request left and nothing came back. Whether the script ran is unknowable, so
      # this is never retried here — only a caller knows whether a rerun is safe.
      - code: [http.timeout, http.disconnected]
        raise:
          code: script_unknown
          message: "the evaluator stopped answering; the script may have run: ${error.message}"
      # The runner answers 200 or 422 and nothing else (bun-runtime/server.ts). A 404, a 500
      # or an unparseable body is our own deployment broken, not a condition to react to.
      # The gateway statuses above are caught first, so this arm never sees them.
      - panic:
          code: engine_broken
          message: "the evaluator broke its contract (${error.code}): ${error.message}"
    switch:
      - goto: end

  # The error codes are this process's `throws` clause, and they split on whether a caller
  # could sensibly react: a script that ran and said no is a raise, a script that is simply
  # wrong is a panic no one should work around.
  #
  # The messages carry the evaluator's own words. A caller still branches on the CODE — this
  # prose is for whoever reads the failure, and nothing should ever parse it back.
  - id: failed
    switch:
      # Spelled the way JavaScript prints an error, because that is what it is: `name` is
      # what a script sets to tell one refusal from another (bun-runtime/README.md).
      - case: 'error.data.kind == "threw"'
        raise:
          code: script_threw
          message: "${error.data.name}: ${error.data.message}"
      # The budget is the caller's, so name it — "too slow" without the number sends whoever
      # reads this to the wrong file.
      - case: 'error.data.kind == "timeout"'
        raise:
          code: script_timeout
          message: "the script ran past its ${input.timeout_ms}ms budget"
      # `kind` discriminates here rather than `name`: this arm covers a script that would not
      # compile and one that returned what JSON cannot represent, which are fixed differently.
      - panic:
          code: script_broken
          message: "the script is broken (${error.data.kind}) - ${error.data.message}"

output: "$: outputs.eval"

$defs:
  # The 422 body from bun-runtime. Only this process needs to know it.
  script_error:
    type: object
    properties:
      kind: { type: string }
      name: { type: string }
      message: { type: string }
      stack: { type: string }
    required: [kind, name, message]
