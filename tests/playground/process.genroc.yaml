name: weather-logger
input_schema:
  type: object
  properties:
    place: { type: string, default: "Praha" }
tasks:
  - id: location
    action:
      type: fetch
      url: https://geocoding-api.open-meteo.com/v1/search
      method: get
      query:
        name: "$: input.place"
        count: 1
        format: json
      responses:
        200:
          $ref: "#/$defs/geo_response"
    output: "$: self.result.results[0]"
    switch:
      - case: "self.output == null"
        panic:
          code: "location_not_found"
          message: "Location ${input.place} not found"
      - goto: next

  # The whole measurement, as a child call. The code lives in reading.ts
  - id: reading
    action:
      type: child
      <<: "$process: ./script-node.genroc.yaml"
      input:
        code: "$import: ./reading.ts"
        # The script's own budget. script.yaml waits 30s on top of it, so an overrun
        # arrives here as script_timeout rather than an unknowable http.timeout.
        timeout_ms: 20000
        input:
          geo: >
            $: outputs.location
      result_schema:
        $ref: "#/$defs/reading"
    output: "$: self.result"
    switch: end

output: "$: outputs.reading"

$defs:
  # Only the two fields this process reads: the conform narrows the forwarded payload to
  # exactly what was declared, so kind and stack stay where they were produced.
  script_throw:
    type: object
    properties:
      name: { type: string }
      stack: { type: [string, "null"] }
    required: [name, stack]

  geo_response:
    type: object
    properties:
      results:
        type: array
        items:
          type: object
          properties:
            latitude: { type: number }
            longitude: { type: number }
            name: { type: string }
            country: { type: string }
          required: [latitude, longitude, name]

  reading:
    type: object
    properties:
      time: { type: string }
      condition: { type: string }
      temperature_c: { type: number }
      summary: { type: string }
    required: [time, condition, temperature_c, summary]
