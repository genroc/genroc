<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 420" role="img" aria-labelledby="sd-title">
  <title id="sd-title">Instance status transitions</title>
  <style>
    .sd-group { fill: none; stroke: var(--line-strong, #b8b8b2); stroke-dasharray: 4 4; }
    .sd-group-label { fill: var(--muted, #6b6b6b); }
    .sd-note { fill: var(--muted, #6b6b6b); font-size: 11px; }
    .sd-node { fill: var(--bg, #f7f7f4); stroke: var(--line-strong, #b8b8b2); }
    .sd-node.sd-settled { fill: var(--code-bg, #ececea); }
    .sd-name { fill: var(--fg, #1c1c1c); text-anchor: middle; dominant-baseline: central; }
    .sd-engine { fill: none; stroke: var(--muted, #6b6b6b); stroke-width: 1.2; }
    .sd-op { fill: none; stroke: var(--accent, #b5532b); stroke-width: 1.6; }
    .sd-engine-label { fill: var(--muted, #6b6b6b); }
    .sd-op-label { fill: var(--accent, #b5532b); }
    .sd-engine-head { fill: var(--muted, #6b6b6b); }
    .sd-op-head { fill: var(--accent, #b5532b); }
    .sd-dot { fill: var(--fg, #1c1c1c); }
    text { font-family: inherit; font-size: 13px; }
  </style>
  <defs>
    <marker id="sd-arrow-engine" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="sd-engine-head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="sd-arrow-op" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="sd-op-head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- groups: commands leave only the live and settled ones; a transition takes none -->
  <rect class="sd-group" x="12" y="44" width="232" height="330" rx="4"/>
  <text class="sd-group-label" x="22" y="62">live</text>
  <rect class="sd-group" x="300" y="126" width="160" height="248" rx="4"/>
  <text class="sd-group-label" x="310" y="143">in transition</text>
  <text class="sd-note" x="310" y="352">instant when nothing</text>
  <text class="sd-note" x="310" y="366">is in flight</text>
  <rect class="sd-group" x="600" y="44" width="140" height="330" rx="4"/>
  <text class="sd-group-label" x="610" y="62">settled</text>

  <!-- start -->
  <circle class="sd-dot" cx="44" cy="96" r="4"/>
  <text class="sd-engine-label" x="30" y="84">start</text>
  <path class="sd-engine" d="M48,96 H118" marker-end="url(#sd-arrow-engine)"/>

  <!-- running settles on its own -->
  <path class="sd-engine" d="M220,86 L618,80" marker-end="url(#sd-arrow-engine)"/>
  <text class="sd-engine-label" x="420" y="76" text-anchor="middle">end reached</text>
  <path class="sd-engine" d="M220,92 L618,122" marker-end="url(#sd-arrow-engine)"/>
  <text class="sd-engine-label" x="500" y="106" text-anchor="middle">raise</text>

  <!-- failure: from running, and from a pause it outranks -->
  <path class="sd-engine" d="M220,100 L318,160" marker-end="url(#sd-arrow-engine)"/>
  <text class="sd-engine-label" x="280" y="124">error</text>
  <path class="sd-engine" d="M370,222 V184" marker-end="url(#sd-arrow-engine)"/>
  <text class="sd-engine-label" x="378" y="207">child failed</text>
  <path class="sd-engine" d="M420,166 H618" marker-end="url(#sd-arrow-engine)"/>
  <text class="sd-engine-label" x="519" y="158" text-anchor="middle">tasks land</text>

  <!-- pause and back -->
  <path class="sd-op" d="M220,110 L318,232" marker-end="url(#sd-arrow-op)"/>
  <text class="sd-op-label" x="250" y="200">pause</text>
  <path class="sd-engine" d="M320,246 L222,306" marker-end="url(#sd-arrow-engine)"/>
  <text class="sd-engine-label" x="238" y="272" text-anchor="end">tasks land</text>
  <path class="sd-op" d="M170,298 V114" marker-end="url(#sd-arrow-op)"/>
  <text class="sd-op-label" transform="translate(160,206) rotate(-90)" text-anchor="middle">resume</text>

  <!-- the task in flight can end the process before the pause lands: settled as its outcome says -->
  <path class="sd-engine" d="M420,248 H598" marker-end="url(#sd-arrow-engine)"/>
  <text class="sd-engine-label" x="530" y="240" text-anchor="middle">task ends the process</text>

  <!-- cancel, from running or paused -->
  <path class="sd-op" d="M244,316 H318" marker-end="url(#sd-arrow-op)"/>
  <text class="sd-op-label" x="281" y="308" text-anchor="middle">cancel</text>
  <path class="sd-engine" d="M420,316 H618" marker-end="url(#sd-arrow-engine)"/>
  <text class="sd-engine-label" x="519" y="308" text-anchor="middle">tasks land</text>

  <!-- retry -->
  <path class="sd-op" d="M720,166 H752 V22 H185 V78" marker-end="url(#sd-arrow-op)"/>
  <text class="sd-op-label" x="470" y="16" text-anchor="middle">retry</text>

  <!-- nodes -->
  <rect class="sd-node" x="120" y="80" width="100" height="32" rx="3"/>
  <text class="sd-name" x="170" y="96">running</text>
  <rect class="sd-node" x="120" y="300" width="100" height="32" rx="3"/>
  <text class="sd-name" x="170" y="316">paused</text>
  <rect class="sd-node" x="320" y="150" width="100" height="32" rx="3"/>
  <text class="sd-name" x="370" y="166">failing</text>
  <rect class="sd-node" x="320" y="224" width="100" height="32" rx="3"/>
  <text class="sd-name" x="370" y="240">pausing</text>
  <rect class="sd-node" x="320" y="300" width="100" height="32" rx="3"/>
  <text class="sd-name" x="370" y="316">cancelling</text>

  <rect class="sd-node sd-settled" x="620" y="64" width="100" height="32" rx="3"/>
  <text class="sd-name" x="670" y="80">completed</text>
  <rect class="sd-node sd-settled" x="620" y="106" width="100" height="32" rx="3"/>
  <text class="sd-name" x="670" y="122">raised</text>
  <rect class="sd-node sd-settled" x="620" y="150" width="100" height="32" rx="3"/>
  <text class="sd-name" x="670" y="166">failed</text>
  <rect class="sd-node sd-settled" x="620" y="300" width="100" height="32" rx="3"/>
  <text class="sd-name" x="670" y="316">cancelled</text>

  <!-- legend -->
  <path class="sd-op" d="M12,404 H44" marker-end="url(#sd-arrow-op)"/>
  <text class="sd-op-label" x="52" y="408">genctl command</text>
  <path class="sd-engine" d="M190,404 H222" marker-end="url(#sd-arrow-engine)"/>
  <text class="sd-engine-label" x="230" y="408">engine</text>
</svg>
