name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: lint (gofmt + vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        # -l alone always exits 0, so the file list has to become the failure.
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi
      - name: go vet
        run: go vet ./...

  test:
    name: tests (Go unit + dual-engine DB + TS integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: genroc
          POSTGRES_PASSWORD: genroc
          POSTGRES_DB: genroc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U genroc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CGO_ENABLED: "1"
      POSTGRES_DSN: postgres://genroc:genroc@localhost:5432/genroc_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install test dependencies
        run: cd tests && npm ci
      - name: Install evaluator dependencies
        # The import resolver shells out to typescript/bin/tsc and to rollup, resolved from
        # the evaluator's OWN node_modules (import.meta.resolve, relative to import.ts) —
        # which is gitignored, so without this every resolver test fails with "Cannot find
        # module".
        run: cd evaluator && npm ci
      - name: Typecheck the evaluator
        # It is the shipped artefact and nothing else checks it: `make test` covers the Go
        # engine and the test suite, and the evaluator only ever gets RUN.
        run: cd evaluator && npm run typecheck
      - name: make test
        run: make test

  stress:
    name: stress (concurrency / deadlock, x3)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: genroc
          POSTGRES_PASSWORD: genroc
          POSTGRES_DB: genroc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U genroc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CGO_ENABLED: "1"
      POSTGRES_DSN: postgres://genroc:genroc@localhost:5432/genroc_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: make test-stress
        run: make test-stress

  # Builds both images on every PR without pushing. The Dockerfile is not exercised by any
  # test, so without this it rots between releases and the break surfaces during one.
  images:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: genroc
        uses: docker/build-push-action@v6
        with: { context: ., target: genroc, push: false, cache-from: 'type=gha,scope=genroc' }
