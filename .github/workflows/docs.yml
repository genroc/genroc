name: docs

# No `paths:` filter: the site publishes process-schema.json, reflected from
# internal/model and everything it imports, so any filter narrow enough to be worth having
# is one a later type change escapes — and the published schema then rots silently. An
# unrelated push rebuilds byte-identical output and the push step exits without a commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Serialize deploys of this workflow; the bench chart job pushes to gh-pages too, but
# from its own workflow — that race is handled by the retry loop in the push step, not
# by this group (sharing a group would cancel pending chart jobs and lose bench points).
concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: build and push to gh-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      # Into docs/public/, so the built site serves it at /process-schema.json. Must run
      # before the Astro build — public/ is copied into dist/ at build time.
      - name: Generate process-schema.json
        run: make docs-schema

      - name: Build site
        run: |
          cd docs
          bun install --frozen-lockfile
          bun run build
          # Pages runs Jekyll on branch deploys, which drops _astro/ (underscore dirs).
          touch dist/.nojekyll

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      # /bench/ on gh-pages belongs to github-action-benchmark (bench.yml), not this
      # build — it must survive the --delete sweep of stale docs pages.
      - name: Push to gh-pages, preserving /bench/
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898270+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            rsync -a --delete --exclude=/.git/ --exclude=/bench/ ../docs/dist/ .
            git add -A
            if git diff --cached --quiet; then
              echo "no changes to deploy"
              exit 0
            fi
            git commit -m "docs: deploy ${GITHUB_SHA}"
            if git push origin gh-pages; then
              exit 0
            fi
            # Lost the race against the bench chart job's push; redo on the new tip.
            git fetch origin gh-pages
            git reset --hard origin/gh-pages
          done
          echo "::error::failed to push gh-pages after 3 attempts"
          exit 1
