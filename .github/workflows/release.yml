name: release

# Publishes two images, mirrored to Docker Hub when its secrets exist:
#
#   genroc/genroc     engine, UI, SQLite
#   genroc/eval-node  the script-task worker (named for its runtime: another evaluator in
#                     another language claims the same queue)
#
# ghcr.io is primary because a Docker Hub ORGANISATION needs a paid plan and GitHub's registry
# is free for public images. Docker Hub is mirrored anyway: it is the only registry
# `docker run <name>` resolves without a host prefix.
#
#   edge          every push to main
#   preview       newest prerelease; the short command while `latest` does not exist
#   0.2.0-rc.1    that prerelease, pinned
#   0.2.0 0.2 0   a release, plus `latest`
#
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # ghcr.io, authenticated by GITHUB_TOKEN rather than a stored secret

jobs:
  # One job per architecture on a native runner: cgo (needed for SQLite) cannot cross-compile,
  # and QEMU would be an order of magnitude slower. arm64 runners are free for public repos.
  build:
    name: ${{ matrix.image }} ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: [genroc, eval-node]
        platform: [linux/amd64, linux/arm64]
        include:
          - { platform: linux/amd64, runner: ubuntu-24.04 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # By digest, no tag: a per-arch tag would have each arch overwrite the other. The merge
      # job assembles one manifest list and tags that.
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image == 'genroc' && 'Dockerfile' || 'eval-node/Dockerfile' }}
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'edge' }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }},mode=max

      - name: export the digest
        # The prefix is stripped because an artifact filename cannot contain a colon; the merge
        # step puts `sha256:` back.
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.push.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    name: ${{ matrix.image }} manifest
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        image: [genroc, eval-node]
    # Hoisted because `secrets` is not an allowed context in a step-level `if` — referencing it
    # there fails the whole workflow at parse time, with zero jobs and no error in the UI.
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=preview,enable=${{ startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-') }}
            # The `-` test keeps `latest` off prereleases.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

      - name: assemble the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      # The same manifest is copied, not rebuilt, so the registries cannot diverge.
      - name: log in to Docker Hub
        id: dockerhub
        if: ${{ env.DOCKERHUB_TOKEN != '' }}
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: mirror to Docker Hub
        if: ${{ steps.dockerhub.outcome == 'success' }}
        env:
          NS: ${{ vars.DOCKERHUB_NAMESPACE || 'genroc' }}
        run: |
          for tag in $(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON"); do
            docker buildx imagetools create -t "docker.io/${NS}/${{ matrix.image }}:${tag##*:}" "$tag"
          done

      # Hub-only: ghcr.io takes its description from the linked repo. Its own README because
      # relative links do not resolve on Docker Hub.
      - uses: actions/checkout@v4
        if: ${{ steps.dockerhub.outcome == 'success' }}
      - name: sync the Docker Hub description
        if: ${{ steps.dockerhub.outcome == 'success' }}
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_NAMESPACE || 'genroc' }}/${{ matrix.image }}
          short-description: ${{ matrix.image == 'genroc' && 'A durable process orchestrator — engine, API and web UI' || 'genroc script-task worker (Node)' }}
          readme-filepath: ./.github/dockerhub-README.md

  # genctl binaries. Tags only — a `main` push publishes images, not a release. genctl is
  # CGO_ENABLED=0 with no database dependency, so every target cross-compiles from one runner;
  # the server does not, which is why it ships as an image instead.
  cli:
    name: genctl binaries
    # After the images: a tag should not leave binaries published against images that failed.
    needs: merge
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # goreleaser builds the changelog from history
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # @genroc/eval-node. The bundler has to be an npm package rather than only an image: genctl
  # runs it on every apply and on every edit in the editor loop, where a container start is too
  # slow and the resolver needs the user's own node_modules.
  #
  # TRUSTED PUBLISHING — no NPM_TOKEN. npm exchanges GitHub's OIDC token for a short-lived
  # credential scoped to this workflow, and attaches a provenance attestation automatically.
  # Configured on the package's npm settings page, naming this repo and this filename; renaming
  # this file breaks publishing until the setting is updated.
  npm:
    name: npm package
    needs: merge
    if: ${{ startsWith(github.ref, 'refs/tags/v') && github.repository == 'genroc/genroc' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; what Node ships is not guaranteed to be newer.
      - run: npm install -g npm@latest
      - name: publish
        working-directory: eval-node
        run: |
          tag=${GITHUB_REF_NAME#v}
          npm version "$tag" --no-git-tag-version --allow-same-version
          # A prerelease must not become `latest` on npm either — same rule as the image tags.
          case "$tag" in
            *-*) npm publish --access public --tag preview ;;
            *)   npm publish --access public ;;
          esac
