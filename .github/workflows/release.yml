name: release

# Publishes three images, mirrored to Docker Hub when its secrets exist:
#
#   genroc/genroc     engine, UI, SQLite
#   genroc/eval-node  the script-task worker (named for its runtime: another evaluator in
#                     another language claims the same queue)
#   genroc/ui         the UI server, which authenticates and issues the token
#
# A tag also publishes the genctl binaries, @genroc/eval-node, and the VS Code extension —
# which bundles `genctl lsp` as WebAssembly, so an editor with no genctl installed still gets a
# server. They all carry ONE version: the tag without its `v`. Nothing here is versioned in the repo — the
# committed package.json versions are placeholders (0.0.0).
#
# ghcr.io is primary because a Docker Hub ORGANISATION needs a paid plan and GitHub's registry
# is free for public images. Docker Hub is mirrored anyway: it is the only registry
# `docker run <name>` resolves without a host prefix.
#
#   edge          every push to main
#   preview       newest prerelease; the short command while `latest` does not exist
#   0.2.0-rc.1    that prerelease, pinned
#   0.2.0 0.2 0   a release, plus `latest`
#
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # ghcr.io, authenticated by GITHUB_TOKEN rather than a stored secret

jobs:
  # One job per architecture on a native runner: cgo (needed for SQLite) cannot cross-compile,
  # and QEMU would be an order of magnitude slower. arm64 runners are free for public repos.
  build:
    name: ${{ matrix.image }} ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: [genroc, eval-node, ui]
        platform: [linux/amd64, linux/arm64]
        include:
          - { platform: linux/amd64, runner: ubuntu-24.04 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm }
          # The Dockerfile per image, carried in the matrix rather than picked by an
          # expression: a ternary works for two and silently mis-picks for three.
          - { image: genroc,    dockerfile: Dockerfile }
          - { image: eval-node, dockerfile: eval-node/Dockerfile }
          - { image: ui,        dockerfile: ui/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # By digest, no tag: a per-arch tag would have each arch overwrite the other. The merge
      # job assembles one manifest list and tags that.
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'edge' }}
            COMMIT=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.image }}-${{ matrix.platform }},mode=max

      - name: export the digest
        # The prefix is stripped because an artifact filename cannot contain a colon; the merge
        # step puts `sha256:` back.
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.push.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  merge:
    name: ${{ matrix.image }} manifest
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        image: [genroc, eval-node, ui]
    # Hoisted because `secrets` is not an allowed context in a step-level `if` — referencing it
    # there fails the whole workflow at parse time, with zero jobs and no error in the UI.
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=preview,enable=${{ startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-') }}
            # The `-` test keeps `latest` off prereleases.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

      - name: assemble the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      # The same manifest is copied, not rebuilt, so the registries cannot diverge.
      - name: log in to Docker Hub
        id: dockerhub
        if: ${{ env.DOCKERHUB_TOKEN != '' }}
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: mirror to Docker Hub
        if: ${{ steps.dockerhub.outcome == 'success' }}
        env:
          NS: ${{ vars.DOCKERHUB_NAMESPACE || 'genroc' }}
        run: |
          for tag in $(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON"); do
            docker buildx imagetools create -t "docker.io/${NS}/${{ matrix.image }}:${tag##*:}" "$tag"
          done

      # Hub-only: ghcr.io takes its description from the linked repo. Its own README because
      # relative links do not resolve on Docker Hub.
      - uses: actions/checkout@v4
        if: ${{ steps.dockerhub.outcome == 'success' }}
      - name: sync the Docker Hub description
        if: ${{ steps.dockerhub.outcome == 'success' }}
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_NAMESPACE || 'genroc' }}/${{ matrix.image }}
          short-description: ${{ matrix.image == 'genroc' && 'A durable process orchestrator — engine, API and web UI' || 'genroc script-task worker (Node)' }}
          readme-filepath: ./.github/dockerhub-README.md

  # genctl binaries. Tags only — a `main` push publishes images, not a release. genctl is
  # CGO_ENABLED=0 with no database dependency, so every target cross-compiles from one runner;
  # the server does not, which is why it ships as an image instead.
  cli:
    name: genctl binaries
    # After the images: a tag should not leave binaries published against images that failed.
    needs: merge
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # goreleaser builds the changelog from history
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # @genroc/eval-node. The bundler has to be an npm package rather than only an image: genctl
  # runs it on every apply and on every edit in the editor loop, where a container start is too
  # slow and the resolver needs the user's own node_modules.
  #
  # TRUSTED PUBLISHING — no NPM_TOKEN. npm exchanges GitHub's OIDC token for a short-lived
  # credential scoped to this workflow, and attaches a provenance attestation automatically.
  # Configured on the package's npm settings page, naming this repo and this filename; renaming
  # this file breaks publishing until the setting is updated.
  npm:
    name: npm package
    needs: merge
    if: ${{ startsWith(github.ref, 'refs/tags/v') && github.repository == 'genroc/genroc' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: pnpm
      # Trusted publishing needs npm >= 11.5.1; what Node ships is not guaranteed to be newer.
      # The INSTALL is pnpm's and the PUBLISH is npm's: pnpm has no working support for npm's
      # OIDC trusted publishing (pnpm#9812), so the step that needs the OIDC exchange keeps the
      # npm CLI. Nothing in the tarball depends on which one installed node_modules.
      - run: npm install -g npm@latest
      - name: install
        # The build needs devDependencies (@types/node, typescript); without them tsc fails
        # with "Cannot find type definition file for 'node'" at publish time.
        run: pnpm install --frozen-lockfile
      - name: publish
        working-directory: eval-node
        run: |
          tag=${GITHUB_REF_NAME#v}
          npm version "$tag" --no-git-tag-version --allow-same-version
          npm run build          # prepublishOnly does this too; explicit so a failure is visible here
          # A prerelease must not become `latest` on npm either — same rule as the image tags.
          case "$tag" in
            *-*) npm publish --access public --tag preview ;;
            *)   npm publish --access public ;;
          esac

  # The VS Code extension, packaged from the same tag and attached to the same release.
  #
  # The Marketplace REFUSES a prerelease version — `vsce publish` throws on one, and its
  # pre-release channel wants a plain x.y.z it can order — so `v0.2.0-rc.1` produces a .vsix on
  # the release and publishes nothing. Stripping the suffix to publish it anyway would collide
  # with the real 0.2.0 later.
  #
  # VSCE_PAT is an Azure DevOps token for the `genroc` publisher; there is no trusted publishing
  # here. Both registries are therefore SKIPPED when their secret is absent rather than failing
  # the release — the .vsix is attached either way, so a tag is never left without one.
  vscode:
    name: VS Code extension
    needs: cli   # goreleaser creates the release the .vsix attaches to
    if: ${{ startsWith(github.ref, 'refs/tags/v') && github.repository == 'genroc/genroc' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Hoisted for the same reason the Docker Hub secrets are: `secrets` is not a context an
    # `if` may read.
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      # The server the extension falls back to on a machine with no genctl. ONE module for every
      # platform is what keeps this a single universal .vsix — a native binary would mean a
      # package per target — and it carries the release's own version, so what it reports and
      # what it accepts are the tag's.
      - name: build the bundled server
        run: |
          GOOS=wasip1 GOARCH=wasm go build -trimpath \
            -ldflags="-s -w -X main.version=${GITHUB_REF_NAME#v} -X main.commit=$(git rev-parse --short HEAD)" \
            -o editors/vscode/bin/genctl.wasm ./cmd/genctl
      - name: package
        run: |
          pnpm install --frozen-lockfile
          cd editors/vscode
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
          pnpm run compile
          pnpm exec vsce package --no-dependencies -o "genroc-${GITHUB_REF_NAME#v}.vsix"
      - name: attach it to the release
        run: gh release upload "$GITHUB_REF_NAME" editors/vscode/*.vsix --clobber

      # The same file both registries get, not a rebuild: `--packagePath` publishes the artifact
      # that is already attached, so what a user installs is what the release carries.
      # The `-` test keeps a prerelease out, exactly as it keeps `latest` off the images.
      - name: publish to the Marketplace
        if: ${{ !contains(github.ref_name, '-') && env.VSCE_PAT != '' }}
        working-directory: editors/vscode
        run: pnpm exec vsce publish --packagePath genroc-*.vsix

      # VSCodium, Cursor and the other forks resolve extensions here and not from the
      # Marketplace, so it is a mirror in the same sense Docker Hub is.
      - name: mirror to Open VSX
        if: ${{ !contains(github.ref_name, '-') && env.OVSX_PAT != '' }}
        continue-on-error: true
        working-directory: editors/vscode
        run: npx --yes ovsx publish genroc-*.vsix -p "$OVSX_PAT"

  # Rolling `edge` binaries, to match the `edge` image tag. A prerelease so it never becomes
  # GitHub's "latest"; tagged `edge` rather than a version so the install script can ask for it
  # by name and so the prerelease channel (which looks for v-tags) ignores it.
  edge:
    name: edge binaries
    needs: merge
    if: ${{ github.ref == 'refs/heads/main' && github.repository == 'genroc/genroc' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write   # trusted publishing, same as the npm job
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean
      - name: move the edge tag and refresh its release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -f edge && git push -f origin edge
          gh release view edge >/dev/null 2>&1 \
            || gh release create edge --prerelease --title edge \
                 --notes "Built from main. Moves on every push; not a release."
          gh release upload edge dist/*.tar.gz dist/*.zip dist/checksums.txt --clobber

      # The npm half of `edge`, so the bundler tracks main like the images and the CLI do.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - name: publish @genroc/eval-node@edge
        working-directory: eval-node
        run: |
          # npm versions are immutable, so every edge publish needs its own. `0.0.0-edge.<sha>`
          # sorts below every real release, so it can never become `latest` by accident.
          npm version "0.0.0-edge.$(git rev-parse --short HEAD)" --no-git-tag-version
          npm run build
          npm publish --access public --tag edge

      # The extension's edge build. The Marketplace has no channel that is not a release — every
      # publish reaches every user of the extension — so edge ships as a .vsix beside the
      # binaries. Its version stays the placeholder 0.0.0, which any release supersedes.
      - name: package the VS Code extension
        run: |
          GOOS=wasip1 GOARCH=wasm go build -trimpath \
            -ldflags="-s -w -X main.version=edge -X main.commit=$(git rev-parse --short HEAD)" \
            -o editors/vscode/bin/genctl.wasm ./cmd/genctl
          pnpm install --frozen-lockfile
          cd editors/vscode
          pnpm run compile
          pnpm exec vsce package --no-dependencies -o genroc-edge.vsix
      - name: attach it to the edge release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload edge editors/vscode/genroc-edge.vsix --clobber
